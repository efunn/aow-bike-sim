[project]
name = "aow-sim"
version = "0.1.0"
description = "MuJoCo simulation of an active omni wheel (AOW) RC bike"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Everything the BIKE needs and nothing else. The base `dependencies` above
# include mujoco and scipy for the simulator; the Pi runs the controllers, not
# the simulator, and must not install either (see docs/plans/untethered-setup.md
# and tests/test_hw_no_mujoco.py, which enforces the import boundary).
#
# Because `dependencies` is unconditional, installing this on the Pi is a
# two-step -- `pip install --no-deps -e .` for the package itself, then this
# extra for the runtime. Recorded here so the list lives in one place.
onboard = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyserial>=3.5",        # TM151 UART
    "dynamixel-sdk>=3.8",   # needs >=3.8 for GroupSyncRead.fastSyncRead()
]
# matplotlib is in `dev` (not just `viz`) because plotting is part of the
# normal inspection loop: rollout_move --out and the trainers' --trace both
# write a PNG beside the CSV, and silently getting only the CSV is a
# confusing way to find out it is missing.
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "matplotlib>=3.7", "imageio>=2.31",
       "imageio-ffmpeg>=0.4"]
# imageio/-ffmpeg are for `aow_sim.record`, which renders a scripted run
# offscreen to MP4 + a contact sheet. Same argument as matplotlib being in
# `dev`: looking at what the bike actually did is part of the normal loop, and
# a missing encoder should be an install problem, not a traceback mid-render.
viz = ["matplotlib>=3.7", "imageio>=2.31", "imageio-ffmpeg>=0.4"]
# Hold-to-drive in teleop. MuJoCo's viewer reports a key going DOWN and
# nothing else — no release, no auto-repeat — so holding the arrows can only
# work if the OS supplies real key state. On macOS that means pyobjc:
# AppKit for the (permission-free) NSEvent local monitor, Quartz for polling.
# Without these, teleop still works — the arrows step the command per tap.
teleop = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
# RL training only (the base install replays a trained policy with numpy alone).
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "torch>=2.1",
    "tensorboard>=2.14",
    "tqdm>=4.66",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aow_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a misspelt marker into an error. Without it
# `pytest -m contct` selects nothing, says nothing, and exits 0 -- which is
# indistinguishable from "that change affected no tests", the one answer a
# marker must never give by accident.
addopts = ["--strict-markers"]
# RUNNING IT IN PARALLEL. 81% of the suite's wall time is inside MuJoCo C
# (mj_step 56 s, mj_forward 4.6 s, against 13.5 s of Python, measured with
# cProfile over test_drive + test_teleop), so there is nothing to optimise in
# our own code -- the only lever is running more of it at once:
#
#     pytest -n 10 --dist load
#
# Measured on a 10-core M4, whole suite:
#
#     serial                   139-147 s
#     -n 10 --dist load          27-31 s   <- ~4.7x
#     -n 6  --dist load          37-41 s
#     -n 10 --dist loadfile         68 s   (floor is the longest FILE, 39 s)
#
# `--dist load` (per test, not per file) is what gets the speedup: test_drive.py
# alone is 39 s, so loadfile can never beat that. Worker count barely matters
# above 6; run-to-run spread at a fixed -n is several seconds.
#
# DO NOT bother pinning BLAS threads. An earlier version of this comment told
# you to set OMP_NUM_THREADS / OPENBLAS_NUM_THREADS / VECLIB_MAXIMUM_THREADS
# for a reproducible red set. That was wrong twice over, and the measurements
# behind it were confounded:
#
#   - numpy and scipy here are built against Apple ACCELERATE, not OpenBLAS
#     (`numpy.show_config()`; vmmap shows only vecLib in the process), so
#     OPENBLAS_NUM_THREADS was a no-op on this machine to begin with.
#   - The gains are not thread-sensitive anyway. Ten concurrent processes each
#     running design_gain_schedule produce a BITWISE identical fingerprint of
#     (Ks, r2s), matching the serial reference.
#   - Four unpinned runs gave an identical red set; the one flip in eight runs
#     was in the PINNED batch.
#
# The real flake is tests/test_teleop.py::test_keystate_degrades_safely, and it
# is not parallelism at all: _KeyState reads LIVE OS KEYBOARD STATE through
# pyobjc, and the test asserts nothing is held. It fails when someone is
# actually typing while the suite runs -- which is exactly what was happening
# during the runs that produced 47/48/51 failures and got blamed on threads.
# Serial is just as exposed; parallel runs are shorter and so hit it less.
#
# Every marker answers ONE question: what change should send me back here?
# The text below is that answer, and `pytest --markers` prints it. Markers are
# set per FILE (a `pytestmark` line under the imports) and added per test where
# a file is mixed, so a test can carry more than one.
#
# The standing red set is NOT expressed here -- see tests/expected_failures.txt
# and the summary tests/conftest.py prints at the end of every run.
markers = [
    "contact: rides on the contact model. Run after any config/bike_params.yaml `sim:` change -- contact_solref, timestep, mesh_segments, impratio, condim. These are also the slow ones.",
    "geometry: rides on a dimension, a mass, or a gear ratio. Run after any other bike_params change.",
    "spec: pins a contract two sides have to agree on -- a control/*_spec.py obs/action layout, or the HardwareData shim. Change one side and this catches the other.",
    "policy: replays a trained export from moves/. All of these go provisional whenever the plant moves; analysis/chatter.py is the fuller check.",
    "deploy: pins deploy/bundle.npz against the params digest. This is step 1 of the bike_params checklist in CLAUDE.md.",
    "boundary: the onboard import boundary -- the Pi installs no mujoco, scipy or torch. Run after touching imports under hw/.",
    "pure: builds no model and returns in well under a second. The inner loop while editing control logic.",
]
