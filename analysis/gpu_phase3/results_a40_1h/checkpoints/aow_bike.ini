; PufferLib 5.0 config for the AoW bike GPU env (aow_bike.cu; phase 3 of
; docs/plans/gpu-training.md). install.sh copies this to config/aow_bike.ini
; in a PufferLib checkout and fills the [env] paths.
;
; PHASE 3 IS A SMOKE TEST OF THE BRIDGE, not a training recipe: the policy
; is PufferLib's default MinGRU net, bf16, no observation normalization, and
; time limits count as terminals. Matching SmoothPPO (MLP, smoothness terms,
; VecNormalize, truncation bootstrap) is phase 4.

[base]
env_name = aow_bike
; -1: PufferLib's whole-horizon capture would record our cudaGraphLaunch
; inside its own capture, which phase 1 measured as unsupported (T5a/T5b).
cudagraphs = -1
seed = 42
checkpoint_interval = 50

[vec]
; must equal the exported graph's worlds (aow_bike.cu refuses otherwise)
total_agents = 4096
num_buffers = 1
num_threads = 1

[env]
graph = /root/aow/graphs/aow_bike_4096
warp_lib = /root/venv/lib/python3.12/site-packages/warp/bin/warp.so
warp_version = 1.18.0

[policy]
hidden_size = 128
num_layers = 1

[train]
; sized to the run: ~80M steps is ~1 h at ~22k SPS. The lr schedule spans it,
; so a different budget is a different schedule.
total_timesteps = 80_000_000
; the CPU stack's PPO where PufferLib has the same knob (config/rl_general_v3.yaml;
; vf_coef and max_grad_norm are SB3's defaults, which v3 does not set) -- EXCEPT
; the update count and step size, which do not carry over (2026-10-14 A40 run:
; lr 3e-4, minibatch 32768, replay 1.0 = 8 gradient steps an epoch, learned
; nothing in 14.4M steps). Gradient steps an epoch = replay_ratio x horizon x
; total_agents / minibatch_size (src/pufferl.cu:1504) = 4 x 262144 / 8192 = 128.
; PufferLib's default for Muon (v3's 3e-4 is an Adam rate)
learning_rate = 0.015
; cosine from learning_rate down to min_lr_ratio x it over total_timesteps.
; PufferLib's default floor is 0, which stopped run 2 learning at its end
; (lr ~1e-5 by 19.7M). 0.2 -> 0.003: kl climbed mid-run as entropy fell
; (0.37 at lr 0.0066), so the rate eases off, but never to nothing.
anneal_lr = 1
min_lr_ratio = 0.2
gamma = 0.99
gae_lambda = 0.95
horizon = 64
minibatch_size = 8192
; PufferLib's sweeps span 0.25-4
replay_ratio = 4.0
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
ent_coef = 0.005
