# The TM151's orientation on the chassis: its axes in the chassis frame.
#
# From the v2 CAD (cad.bike_v2): the TM151 sits on the drive's tabs on the
# 45 deg drive face, USB up and back, its +x (the pin header) down and
# forward, +z (out of the top) up and forward, +y left. That is +45 deg about
# chassis y. The tabs locate it on its own four M2 holes, so the CAD is the
# measurement. How level the floor is under the bike is a separate
# correction, MountCalibration.capture in hw/ahrs.py.
#
# Applied as: chassis attitude = q_sensor * conj(q_mount), chassis vector =
# R(q_mount) @ v_sensor (the TM151's quaternion is sensor -> earth, as
# MuJoCo's). The sim carries the same rotation as bike.ahrs.quat;
# tests/test_hw_ahrs.py pins the two equal. The bike reads it from the deploy
# bundle, so re-run `python -m aow_sim.export_deploy` after changing it.
#
# Kept out of bike_params.yaml so it stays out of plant_digest: the sim's
# sensor already reports in the chassis frame, so this cannot change a
# trained policy.

q_mount: [0.9238795325, 0.0, 0.3826834324, 0.0]   # w, x, y, z
source: design                                    # the v2 CAD

# The part as built, turned about chassis x on top of the CAD's mount (+ =
# right side down): the bike then reads this much LESS roll. 0.7 (2026-11-03,
# estimate): the string hang from the ring apexes (+0.3 / +1.2 turned round)
# against the riding reading (+0.5..+1.0) solves to the CoM centred and the
# AHRS 0.7 +-0.3 high; in the sim a 1 deg high reading reproduces the bike's
# left steer and left crab (docs/status.md, Self-righting). Not settled: the
# phone level reads in 0.4 deg steps. Applied by export_deploy.load_ahrs_mount
# into the bundle only; the sim's bike.ahrs.quat stays the CAD's.
roll_trim_deg: 0.7
