# Windowed-velocity variant of rl_general.yaml. IDENTICAL except for
# `vel_window_s` and `resample_s`, so the two are a clean A/B --
# rl_general.yaml is untouched and stays the baseline.
#
# WHY. The differential is the ONLY actuator for both roll balance and lateral
# crawl, and under a pure hold command it is already p95-saturated by balance
# alone (analysis/chatter.py). A sustained pure crab is therefore not
# physically available at standstill, and measured crab tracking is 0.1-0.2 of
# commanded at EVERY magnitude, down to 0.05 m/s.
#
# The only manoeuvre that produces net lateral motion without a sustained
# differential bias is an oscillatory wriggle -- fore/aft oscillation against a
# steering pattern, the parallel-park bracket. But it necessarily has
# instantaneous speed >> commanded speed, and the baseline reward scores
# instantaneous velocity error every step at sigma_v 0.35. Measured: at a
# 0.144 m/s crab command, a PERFECT wriggle with more than 0.208 m/s of
# fore/aft amplitude scores worse than standing still, and heading-constrained
# optimised gaits all scored 1.3-1.5 reward BELOW idling.
#
# So the baseline reward forbids the one manoeuvre that can satisfy a lateral
# command. `vel_window_s` low-passes the MEASURED velocity (not the command --
# nothing here integrates a setpoint) so the gait's time average is what is
# tracked. Attenuation is 1/sqrt(1+(2*pi*f*tau)^2); the design rule is
# f*tau >~ 0.70, and the optimised gaits ran near 2 Hz, so tau = 1.0 s has
# margin. The filter state rides in the observation (entries 15-16) because a
# reward may not depend on state the policy cannot see.
#
# WHAT TO WATCH, in order:
#   * curriculum/difficulty. If it stalls below ~0.5 the transient exclusion in
#     general_env.step is not working, the lateral command never opens, and the
#     whole experiment quietly does nothing. Fastest failure signal.
#   * crab_ratio_left/right -- now computed from DISPLACEMENT (v_lat_net), not
#     the mean of body-frame v_lat, which reads ~0 for a working wriggle.
#   * crab_osc -- separates a real wriggle (high) from a smooth crab (~0).
#   * crab_head_err -- a high crab_ratio with a high head_err is the bike
#     turning, not crabbing.
#
# NOTE `track` and therefore `score` are NOT comparable to the baseline arm --
# they are computed against a different quantity. Compare crab_ratio_* and
# crab_osc, not score.
#
# If this arm underdelivers, the next knob is sigma_psi_deg 25 -> 35 (a
# parallel-park inherently yaws; at +-15 deg r_head drops to 0.70, the same
# order as the gain windowing buys) and it needs no observation change.
#
#   python -m aow_sim.train_general_rl --config config/rl_general_glide.yaml \
#       --run-dir runs/general_glide --export-name general_glide_rl
#
# General command-conditioned policy: one always-on controller tracking a
# live (velocity vector, heading) command. See control/general_spec.py for
# the observation contract and control/general_env.py for the episode design.

algo:
  algorithm: PPO
  total_timesteps: 6000000    # a general controller is a bigger task than a
                              #   single move; expect to need the full budget
  n_envs: 32    # was 8
  learning_rate: 3.0e-4
  n_steps: 512 # was 2048  -> 32 x 512 = 16384, unchanged
  batch_size: 1024
  n_epochs: 10
  # gamma at 50 Hz: 1/(1-g) = 100 steps = 2.0 s of lookahead, which matches
  # the timescale of a heading change. THE MOVES' 0.99 AT 200 Hz IS ONLY
  # 0.5 s — far too myopic here; they get away with it because their reward
  # is a dense per-step yaw-progress term rather than setpoint tracking.
  # If control_rate_hz is raised back to 200, gamma must go to ~0.998.
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005        # ball_rl's lesson: 0.0 collapsed exploration
  net_arch: [128, 128]
  seed: 0
  eval_every: 1000000     # BestByScore cadence [timesteps]

env:
  action_space: full
  # 50 Hz, not the moves' 200 Hz: standard for locomotion RL, and it makes a
  # 2.5 s maneuver 125 steps instead of 500 — far better credit assignment.
  # Replay is ZOH at this rate, so the controller holds each action 4 physics
  # ticks longer than a move does.
  control_rate_hz: 50
  max_episode_s: 15.0    # long: the policy must hold a command, not finish one
  v_max: 1.2             # matches control.drive.v_max in bike_params.yaml
  # Low-pass time constant [s] on MEASURED velocity, which the reward
  # tracks the command against. 0.0 (or absent) is the instantaneous
  # reward bit for bit and a 15-wide observation; > 0 appends v_bar to
  # the observation, making it 17 wide. See control/general_spec.py.
  vel_window_s: 1.0
  v_lat_frac: 0.4        # lateral command as a fraction of the speed limit
                         #   (the rear omni makes crabbing physical); only
                         #   opens up with curriculum difficulty
  p_v_zero: 0.2          # chance the speed command is exactly 0 (stop is a
                         #   first-class command, not an edge case)
  resample_s: [3.0, 6.0] # was [1.5, 4.0]: the velocity filter needs about
                         #   vel_window_s to flush after a step change, so
                         #   short commands would be mostly transient
  ball_prob: 0.25        # fraction of episodes with a ball parked nearby --
                         #   contact robustness only, NO ball reward. Set to
                         #   0.0 to train on the ball-free model.
  ball_place_radius: 0.5 # ball dropped within this radius of the start pose
  action_bounds:
    steer_rate_max: 8.0
    hub_max: 1.4         # v_max 1.2 + margin (moves cap at 0.6-0.72 because
                         #   they are standstill maneuvers)
    diff_max: 40.0

curriculum:              # the repo's first; a single scalar scaling the
  enabled: true          #   command sampling ranges in _sample_command
  start: 0.15            # gentle: low speed, +-30 deg heading steps, no crab
  step: 0.02             # advance per episode that clears advance_score
  advance_score: 0.6     # mean of (vel + heading) tracking rewards, in [0,1]

reward:
  # Bounded-POSITIVE tracking + alive bonus. Over a 15 s episode a
  # penalty-only reward (the moves' form) makes falling early strictly
  # rational; this removes that incentive.
  w_vel: 1.5             # x exp(-|v_cmd - v|^2 / sigma_v^2)
  w_head: 1.0            # x exp(-(psi_err/sigma_psi)^2)
  w_alive: 0.5
  sigma_v: 0.35          # [m/s] tracking tolerance scale
  sigma_psi_deg: 25.0    # heading tolerance scale
  w_upright: 0.5
  w_effort: 0.001
  w_smooth: 0.005        # higher than the moves': prev_action is observable
                         #   here, so the penalty is actually well-posed.
                         #   One number prices all three action channels
                         #   alike; a 3-list prices [steer_rate, hub, diff]
                         #   separately -- see rl_general_smooth_diff.yaml.
  penalty_fall: 50.0
  fall_roll_deg: 60

randomization:           # as rl_flick/rl_pivot
  enabled: true
  init_roll_deg: 2.0
  init_yaw_deg: 5.0
  init_pos_m: 0.02
  init_vel: 0.05
  mass_frac: 0.15        # was 0.1. The as-built payload mass (battery + Pi +
                         #   U2D2 + buck, ~190 g of a 1.02 kg bike) is a GUESS
                         #   until the thing is weighed, and it is a bigger
                         #   share of the total than anything else unmeasured.
  friction_frac: 0.2
  # Supply voltage. The model's servo numbers are the 12 V datasheet column,
  # but a 3S pack spans 12.6 V (full) to 9.9 V (cutoff) -> ~0.83-1.05x nominal
  # strength. 0.15 covers that window with margin. Scales ctrlrange AND
  # forcerange from a single draw (speed and torque both go with voltage) --
  # see control/randomize.py. Untethered transfer depends on this.
  actuator_frac: 0.15
  # Contact. UNCOMMENT FOR THE NEXT RUN -- left off so this config still
  # reproduces the policies trained before it existed. sim.contact_solref is
  # the least-measured parameter in the model (the bench tests that would pin
  # it are specified in docs/measurements/contact-protocol.md but not yet
  # done), and it is the one the policies are most brittle to: holding
  # timeconst and sweeping dampratio, eval survival is 1.00 from 1.0 down to
  # 0.5 and then drops to 0.9 at 0.3 and 0.7 at 0.2. The drop test puts the
  # true value near 0.3, i.e. right on the cliff edge.
  # solref_frac: 0.4          # scales contact_solref[0], the time constant
  # dampratio_range: [0.3, 0.8]   # absolute draw, not a fraction of nominal
  disturb_force_N: 2.0
  disturb_prob: 0.01
