# The bike's onboard settings: the Pi's devices, servo ids and registers, the
# AHRS reader and the loop. Read by aow_sim.hw (run_bike, bike_bus), the
# mirror, scripts/bike.sh and the bench tools, never by the physics, so it
# moves neither digest. It changes with the hardware, not the plant.
# params.load_params() merges it in at control.onboard.

# The two USB devices, as /dev/serial/by-id/ paths (ttyUSB0 / ttyACM0 follow
# enumeration order and can swap). --port and --ahrs-port override them for
# one session.
dxl_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTB8HMQ3-if00-port0
ahrs_port: /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_338139793235-if00
# Which way each drive servo turns for a positive input-shaft rotation.
# Measured 2026-09-13 on the rear drivetrain
# (docs/measurements/drivetrain-measurements.yaml): both horns face outboard,
# so the two are mirrored: the LEFT servo (101) +1, the RIGHT (102) -1.
# Applied in BikeBus, the one boundary between the servo frame and the model's.
# Per ROLE [drive_a, drive_b], so it swaps with servo_ids below.
servo_sign: [-1, 1]
# Which way the steer servo turns for a positive steer (the model's +steer is
# left, counter-clockwise from above). Observed 2026-10-21: hand-steering left
# showed the mirror's wheel turning right until this was -1. A horn facing
# down onto the headset would explain it (inferred, not checked). Applied in
# BikeBus.
steer_sign: -1           # source: measured -- hand-steer vs the mirror
# The three servos the policy drives: drive_a, drive_b, steer (--ids
# overrides). 101-103 rather than 1-3: a new Dynamixel ships as ID 1, so an
# ID 1 on the bus is an unconfigured unit, which bring-up refuses.
#
# drive_a is the RIGHT servo (102), not the left. Measured 2026-10-24 on the
# assembled bike, held upright on the floor, one servo forward at a time: the
# left servo (101) rolls the wheel forward and slides the rear LEFT; the
# model's drive_a alone slides it RIGHT (the omni rollers follow
# ring-vs-hub, i.e. (a - b) / 2). The plant's error is the sign of k_roller
# (omni-wheel-measurements.yaml, spin_direction_sign); fixing it there moves
# the plant digest, so it waits for a retrain -- and this swap must be
# reverted in the same change. Records before
# 2026-10-24 have 101 as drive_a; each run's meta `roles` says which.
servo_ids: [102, 101, 103]
# THE DETENT'S FLIP, for a policy that observes the detent phase
# (`obs_detent`; general_spec.detent_angle). Ring-vs-hub mod 7.5 deg at the
# top of the sawtooth, in the frame the bench measured it: BELT (s0 theta_id0
# - s1 theta_id1) / 2 over the raw Present Positions of frame_ids, i.e.
# (theta_101 + theta_102) x 1.5. general_spec.detent_flip_model converts it to
# the model's frame through servo_ids / servo_sign above (today the negative,
# with A and B swapped), so reverting the swap needs no edit here.
# Measured (analysis/servo/detent_phase.py): 0.28-0.55 deg over the 7 creeps
# since the 10-24 rebuild, 5 days and 3+ power cycles; 3.2 +- 1.1 counts of
# theta_101 + theta_102 in counts. A REBUILD OF THE DRIVETRAIN MOVES IT (the
# 09-13 testbed read 2.8-2.9): re-measure with one ~45 s diff creep.
detent_flip: {deg: 0.43, frame_ids: [101, 102], frame_signs: [1, -1]}
# The self-righting servo; omit it for a three-servo bench. It shares the
# SyncRead/SyncWrite but is driven by hand, not by the policy
# (docs/plans/self-righting.md).
righting_id: 104
# Goal Current(102) on the righting servo, in raw register counts, written at
# every startup: it is RAM, and comes up at Current Limit(38) = 910, no cap.
# The point of current-based position mode is that the servo can stall
# against the floor instead of levering the bike off it.
#
# 1 count = 1 mA. 785 is what sim teleop starts the crank at: the linkage's
# `limits.torque_nm`, 0.55 N.m at the crank, through
# CurrentBasedPositionServo.counts_for_output (2026-10-26; was 300, a
# placeholder from the geared single arm that was never built, too low to
# lift the bike). By hand in teleop (2026-09-26) 625 mA lifted it fully, and
# the sim's sweep (analysis/mechanism/righting_current_sweep.py) needs
# ~600-650. On the bike (10-26) it lifts the bike from lying to propped in
# 1.25 s, every time (runs 261026-04*). The swing-sit sequence scales from
# this (limp ramps it to 0 and restores it); the mirror and the station
# move it live with [ and ] (pad: d-pad up/down), 20 counts a press.
righting_current: 785   # source: model -- teleop's starting cap
# Where the crank's stow pose sits on the servo, and which way the crank
# runs. Read only by the mirror, to draw the mechanism:
#   crank_travel = (righting_pos - righting_stow_deg) * righting_sign
# 180 puts stow mid-way through the single-turn range, so the full stroke
# (about +-117 deg with the V3 blade) stays inside 0-360 and never needs
# extended position, which loses its turn count at power-up.
righting_stow_deg: 180.0   # source: design
# Measured 2026-10-17, V2 module, horn facing forward: pushing the right wing
# down by hand (torque off) took Present Position up. Flips if the horn is
# turned around. Only the drawing depends on it.
righting_sign: 1           # source: measured -- right wing down = +, horn forward
# false: the TM151 streams Ep_Combo frames by itself (enabled in the unit's
# flash from the vendor's Windows GUI, 2026-09-16; it survives a power cycle).
# true: poll for each frame, the fallback for an unconfigured unit (~200 Hz
# at the 200 Hz output rate). The first frame after opening the port is a
# stale one from the previous session.
ahrs_poll: false
# Servo-shaft angle [deg] at which the front wheel points straight ahead. No
# homing is needed: the encoder is absolute within a turn, steering.gear_ratio
# is 1.0, and the policy observes the steer as sin/cos(2*delta), so only the
# angle mod pi matters. 180 keeps small steers away from the 0/4095 wrap.
# Nominal; `--steer-zero capture` takes the current pose as zero for a
# session.
steer_zero_deg: 180.0
# The safety cut: torque off past this roll. Not a recoverability boundary
# (see FallGuard in run_bike and analysis/policy/no_return.py); 60 is the
# training configs' fall_roll_deg, past which the policy never trained. A
# bike that comes to rest at 30-45 deg on a wing or wheel never reaches it.
cut_roll_deg: 60.0
# Re-arm after a cut: control/recovery.py's RECOVER_DEG and HANDOFF_RATE,
# from what analysis/policy/no_return.py found the policy recovers from (the
# weaker left side sets the 12). Re-run that before tuning them.
rearm_roll_deg: 12.0        # must be below cut_roll_deg
rearm_roll_rate_dps: 171.9  # 3.0 rad/s
rearm_dwell_s: 0.2
# Firmware gains are written at every startup, because they are RAM. The
# steer and righting XC330s get the plant's registers (bike_params.yaml:
# actuators.steer_gains, righting.module.gains), which the sim's gains are
# derived from. The drives get the policy's own training gains from its
# moves/<name>.yaml record. A `gains: {drive: {...}}` block here is the
# fallback for a policy without one (one trained on the ideal drive plant);
# without it the drives keep their power-on values. Every written register
# is read back, and startup raises on a mismatch (`_verify_gains`).
