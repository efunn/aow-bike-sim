# Which Onshape document `aow_sim.cad_layout --push/--shot` talks to.
#
# NOT SECRET. A document id grants nobody anything -- access is the API key,
# which lives in the macOS Keychain and never in this repo (see
# aow_sim.onshape). This file exists so the ids stop being 24-hex arguments
# pasted by hand, which is a mistake with no symptom other than a 404.
#
# Re-read them from a browser URL: .../documents/<document>/w/<workspace>/e/<tab>
document: 1124c4fc2691d6f419d3156e
workspace: edb7e05ee8cb5e6597ba6fb4

tabs:
  # The generated Feature Studio -- the ONLY --push target. Overwritten wholesale
  # on every push, so nothing here may ever be hand-edited.
  feature_studio: 8d3cc86d8a005a59d82d7c10
  # Part Studio the generated features are inserted into: envelopes, datum
  # planes, the four-bar sketch. This is what --shot renders by default,
  # because it is the thing cad_layout actually produces.
  #
  # RE-POINTED 2026-08-21. The original tab is now `rip` below: every body in
  # it had a hand-set appearance, and Onshape will never let FeatureScript
  # overwrite one, so the generated palette was permanently invisible there.
  # A fresh tab has fresh bodies and takes the colours. See
  # docs/plans/cad-onshape-workflow.md, "Colour is a one-way door".
  layout: 2339a3e2fa7a287797ed07ac
  # The superseded tab, kept to debug the appearance lock-out rather than
  # deleted. Nothing generated should be aimed here.
  rip: 0e4da05733a469beac9024c3
  # Target for `--check`, which compiles and RUNS the generated FeatureScript
  # against a throwaway copy of this tab's context. Nothing is ever written
  # here: Onshape derives the context, executes the script, hands back what it
  # measured and discards the whole thing.
  #
  # KEEP THIS TAB EMPTY. Its emptiness is the feature -- a body modelled here
  # lands in any query not scoped to `qCreatedBy(id, ...)`, silently inflating
  # a body count or a collision sweep. `_eval_wrapper` scopes its own queries,
  # but a hand-written probe pasted in later will not.
  #
  # Created 2026-08-24 via POST /api/partstudios/d/{did}/w/{wid}, one call.
  check: 67e6fe3d09d0157389e0dcc4
  # The horn-pin custom feature, generated by `aow_sim.cad_servo_mount`.
  # A SECOND generated studio, separate from `feature_studio` on purpose:
  # cad_layout overwrites that tab wholesale on every push, and this one holds
  # a different kind of thing -- a few small hand-designed features a person
  # inserts once and then drives from the dialog, not a whole document.
  # `cad_servo_mount --push` refuses `feature_studio` outright to keep the two
  # from ever landing on each other.
  #
  # Created 2026-08-25 via POST /api/featurestudios/d/{did}/w/{wid}, one call.
  horn_features: 2df9ad6fc900d97224927937
  # The swing linkage sketch feature, generated by `aow_sim.cad_swing_linkage`.
  # A THIRD generated studio: a push replaces a studio's whole contents, so a
  # generator that does not own its tab deletes whatever else was in it.
  # `cad_swing_linkage --push` refuses `feature_studio` and `horn_features` by
  # name for that reason.
  #
  # Created 2026-09-03 via onshape.create_feature_studio, one call.
  swing_features: e52af027f9bbaf92285b2c45
  # The AHRS fixture's layout feature, generated by `aow_sim.cad_ahrs_fixture`.
  # A FOURTH generated studio, for the same reason as the third: a push
  # replaces the whole tab. Created 2026-09-23 via create_feature_studio.
  fixture_features: 9e5439199b2e484c2a2d9de0
  # The yaw-roll AHRS fixture's Part Studio. `AHRS fixture` is inserted
  # here: every printed part, the servo and TM151 envelopes, the horn datums.
  # Created 2026-09-23 via onshape.create_part_studio, one call.
  ahrs_fixture: 5eb80ae63405c2c2a0b8bafc
  # The X330 load-test fixture's feature, generated by `aow_sim.cad_x330_fixture`.
  # A FIFTH generated studio, its own tab for the same reason as the others.
  # Created 2026-09-25 via create_feature_studio, one call.
  x330_fixture_features: 355f8b882cb6574a06fc5790
  # Its Part Studio, holding the IDLER version (the feature's default): plate,
  # base, cover, lever and yoke round one X330, shaft horizontal. Created
  # 2026-09-25 via create_part_studio, one call.
  x330_fixture: 9b58ee53901304e6ff40fce9
  # The same feature set to the SCREWDRIVER version (servo in a cradle, lever
  # on its own two 608s). Created 2026-09-25 via create_part_studio.
  x330_fixture_screwdriver: 152b960e06cf79e869b3efca
  # The horn-pin coupon (feature `X330 pin coupon`, same studio), 2026-09-25.
  x330_pin_coupon: 6876f762a7562570920ce359
  # The real drawing -- actual parts, imported wheel geometry. cad_layout never
  # writes here; it is a --shot target only, for seeing the parts in context.
  bike: eb278418be25018fb7253dd3
  # Hand-drawn Part Studio the SWING linkage was traced from, read back through
  # the API on 2026-08-25. Its `assignVariable` features name the driving values
  # directly, which is how config/swing_linkage.yaml's numbers were derived --
  # and how the crank angle was found to be 45 deg rather than the 90 traced
  # earlier from `swing-wings-geom-mock`. Nothing generated is ever pushed here.
  # Listed 2026-09-08; it had been recorded only in a comment in
  # config/swing_linkage.yaml.
  wing_linkage_straight: 011b691f0af4ce5194344456
  # Hand-drawn Part Studio holding the as-built idler, 6-32 joint and the
  # case-side-wall / case-end-wall sketches that the X330 idler, screw and
  # full-wrap case features were read from (2026-09-23). Read-only for us.
  # Recorded here because finding it cost a billed tab listing.
  wing_linkage_shorter: 3373737858fdf3ee8595a8f2
  # The floor arm rig (docs/plans/pre-assembly-bench-checklist.md, Rig 1).
  # Studio holds docs/cad/floor_arm_rig.fs VERBATIM -- hand-written, pushed
  # as-is. Created 2026-09-25 via create_feature_studio, one call.
  floor_rig_gen: 9154bc4e2f91b7966eab136d
  # User-made Part Studio holding the real rear drivetrain; `Floor arm rig`
  # was inserted here 2026-09-25 and follows every push of the studio. STALE
  # as a design: the rig moved to MuJoCo (aow_sim.floor_rig) after this.
  aow_bike_rig: ec4e01fa6b9e81ac623d4681

# Inserted custom features, by the tab they live in: the id + nodeId that
# onshape.update_custom_feature needs to change one's dialog values in place.
# NOT needed to pick up a push -- a same-document feature follows its studio
# (tested 2026-09-23). Never delete + re-insert one: it moves to the end of
# the tree and orphans the hand-made chamfers and fillets after it.
# Read off GET .../features on 2026-09-23.
features:
  ahrs_fixture: {id: Fln3klct5K8jQ2e_0, node: MvB9luGDi9JjuG/KU}
  x330_fixture: {id: FbLk4rq4wQTARd7_0, node: MRnGHjRYfg8ZMS/5Q}   # inserted 2026-09-25
  x330_fixture_screwdriver: {id: FTgqIdkcGWX9jEk_0, node: M1bMYfcWSpUQi8v5R}   # version SCREWDRIVER
  x330_pin_coupon: {id: FXlxCqeurJos3Ys_0, node: MSCmztfPEeUckvmj5}   # inserted 2026-09-25

# ---------------------------------------------------------------------------
# OTHER DOCUMENTS TOUCHED, none of them driven by this repo's generators.
#
# Added 2026-09-08. They existed only in ~/.local/state/aow/onshape_calls.jsonl,
# which is outside the repo and outside Dropbox -- so the ids were one `rm` away
# from being unrecoverable. Nothing here is a --push target; `resolve()` only
# ever reads the `tabs:` block above.
other_documents:
  # Scratch document, 2026-08-24, 25 calls in one evening. Where the eval
  # harness was PROVEN: build a body, count it, count again in a second call
  # (0 -> 1 -> 0), which is what established that the endpoint derives a
  # throwaway context. Also where the undocumented custom-feature `insert` was
  # worked out -- five 400s in a row, then the "envelope form" that worked.
  # A sandbox, not a design. Kept because re-deriving either result costs calls.
  eval_harness_scratch: 8b9c6e8eb742abd7ad24af7d
  # Read-only, 2026-08-25, 3 calls: list tabs, list parts, one eval. A
  # Dynamixel bracket/link library browsed for reference geometry. Never
  # written to, and not ours -- treat as read-only.
  dynamixel_link: dfa36634c6c344faf47a020f
