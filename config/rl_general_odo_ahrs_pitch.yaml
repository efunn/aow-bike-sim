# obs_pitch: true ON THE SENSOR LINE. One line changed from
# rl_general_odo_ahrs_rand2.yaml, and it is a REGRESSION FIX, not a new idea.
#
# WHAT WAS FOUND, 2026-08-29. The odo/ahrs line cannot turn around. Every
# policy in it -- odo, odo_ahrs, tau019, rand, rand2 -- fails the moving 180
# commands, and NOT by falling: it drives BACKWARDS at ~0.8 m/s and declines
# to turn. general_rl_odo_ahrs_rand2 on (0.804, 0, 180) reads vel_err 0.091
# with a heading error of 175.6 deg and v_ach -0.843. The command is a
# world-frame velocity vector plus a heading, so reversing satisfies the
# velocity half exactly while abandoning the other, and `track` is
# 0.5 * (r_vel + r_head) -- half marks, none of the risk.
#
# IT IS THE OBSERVATION, NOT THE SENSORS AND NOT THE BUDGET. On MuJoCo truth,
# turn_big commands completed (reached 10 deg and survived), 2026-08-29:
#
#   policy                          obs_pitch  steps  completed  v_ach moving
#   general_rl_smooth_diff_pi         false      11M     3/6      -0.85 -0.76 -0.69
#   general_rl_pitch_smooth_diff_pi   true       12M     6/6      +0.79 +0.70 +0.65
#   general_rl_glide_pitch_smooth_pi  true        5M     6/6      +0.81 +0.58 +0.60
#   general_rl_nolat                  false       9M     3/6      -0.82 -0.70 -0.76
#
# Perfect separation on obs_pitch, and the SIGN OF v_ach is the tell: pitch
# policies turn round and drive forward, pitchless ones reverse. Training
# length is ruled out within this set -- 5M with pitch beat 11M without.
# Sensor accuracy is ruled out as sufficient -- all four ran on truth and two
# still failed. And this is not a new discovery so much as a rediscovery:
# pitch is what solved the flicks on the old policies, and eight configs in
# the glide_pitch/pitch_smooth_diff family carry obs_pitch: true.
#
# HOW IT WAS LOST. The sensor workstream forked off rl_general.yaml, the
# pre-pitch trunk, rather than off the pitch line, and inherited
# obs_pitch: false BY OMISSION -- rl_general_odo.yaml, rl_general_odo_ahrs.yaml
# and rl_general_odo_ahrs_rand2.yaml never mention it. Nothing flagged it,
# because the whole-grid eval median cannot see a failure in 3 of 20 commands.
#
# THE MECHANISM, and it is not "pitch helps". WITHOUT PITCH THE MANOEUVRE ENDS
# THE EPISODE. analysis/reverse_flip.py sets up the case the eval grid cannot
# -- reverse until the speed is established, then snap the heading 180, which
# is what the teleop `8` key does -- and records the peak pitch:
#
#   policy                            -0.50   -0.84    -1.02    -1.20  m/s
#   general_rl_odo_ahrs               13.0    86.9 X   85.7 X   81.8 X
#   general_rl_odo_ahrs_rand2          7.2    31.9     87.6 X   (fell first)
#   general_rl_smooth_diff_pi         16.8    50.0     82.7 X   11.3 X
#   general_rl_pitch_smooth_diff_pi    7.8     9.1     14.5     23.0
#
# 80-90 deg of pitch is the bike over backwards. Every policy without
# obs_pitch flips above ~0.84 m/s of reverse; the one with it never exceeds 23
# deg at any reverse speed up to v_max and never falls. So the pitchless
# policies are not failing to turn -- they have correctly learned that
# attempting it from a reverse ends the episode, and the reversing-with-a-175-
# deg-heading-error behaviour the eval sees is the AVOIDANCE, not the failure.
#
# The eval grid cannot see any of this: its 180 commands start from REST, so
# the bike never reaches the reversing state that triggers the flip.
#
# THE PITCH THE POLICY SEES IS THE SENSOR'S, as of 2026-08-29 and not before.
# `_obs` used to decode the corrupted AHRS quaternion and DISCARD its pitch,
# feeding s.pitch from the model instead -- so obs_pitch meant "TM151 roll,
# perfect truth pitch". Training this arm against that would have produced a
# policy leaning on a signal the bike does not have, which is the exact defect
# this workstream exists to remove. Both pitch and pitch_rate now come from
# the sensor. Guarded by
# test_every_orientation_channel_in_the_obs_comes_from_the_sensor.
#
# WHY obs_pitch ALONE, without w_pitch. Both working configs carry
# obs_pitch: true AND w_pitch: 2.0, so the penalty demonstrably does not
# suppress the manoeuvre. But the dependency runs one way -- obs_pitch is
# REQUIRED BY w_pitch, not the reverse -- so observing without charging is
# legal, and it keeps this to ONE variable against rand2. If flicks do not
# come back, the next arm adds w_pitch: 2.0 and matches the working configs
# exactly -- and it now has a specific rationale rather than a matching one:
# w_pitch prices the wheelie that ends the episode, which is exactly the event
# reverse_flip.py measures.
#
# 18M STEPS, NOT 12M, AND THE CURVES SAY WHY. Steps to reach difficulty 0.95,
# from curriculum/difficulty in runs/*/PPO_*:
#
#   CLEAN  smooth_diff_pi         2.61M      DIRTY  odo             4.29M
#   CLEAN  pitch_smooth_diff_pi   2.16M      DIRTY  odo_ahrs        7.67M
#   CLEAN  glide_pitch_smooth_pi  1.56M      DIRTY  odo_ahrs_rand   8.03M
#                                            DIRTY  odo_ahrs_rand2  7.23M
#
# The sensor runs take ~3x longer to reach full difficulty -- getting off the
# 0.15 floor alone costs them 0.95-1.26M against 0.39-0.52M. The consequence
# is the BUDGET SPLIT: rand2 spent 7.23M of its 12M on the ramp and got 4.8M
# at full difficulty, while pitch_smooth_diff_pi spent 2.16M and got 9.8M.
# Twice the exposure -- and full difficulty is where the 180 commands live,
# which is the behaviour this arm exists to recover. 7.5M of ramp plus ~10M at
# full difficulty is ~17.5M; 18M rounds it.
#
# Second, independent: general_rl_odo_ahrs_rand and _rand2 both recorded their
# BEST eval/score at 12.0M -- the last eval, still climbing when the budget
# ran out. (odo_ahrs peaked at 6M and odo at 9M, so those had headroom; the
# two most recent did not.) Note this arm adds two observation entries, which
# historically slows the ramp rather than speeding it.
#
# The risk of over-running is low: BestByScore exports the best checkpoint by
# score, not the last, so a longer budget costs wall clock and not quality.
# What it does NOT protect against is the `2.7` failure in
# general-rl-improvements.md -- score rising while chatter doubles, which
# _score cannot see. Check dsteer^2 on the export, not just the score.
#
# THE BAR. rand2 completes 0 of the 3 moving reversals. Anything above 0 is
# the hypothesis confirmed. Score is expected to move little either way --
# 3 of 20 commands -- so DO NOT read this arm on score alone; read
# by_family.turn_big, and read survive_rate WITH t_head_s, because a policy
# that declines the turn cannot fall doing it.
#
# Observation goes 15 -> 17 wide, measured (pitch and pitch_rate). NOT 19 --
# that is the glide_pitch arm, which had other options on. Width is not the
# contract anyway: the move yaml records obs_layout and replay compares it
# element-wise, so a policy trained here will not load against a 15-wide env.
#
# ---- everything below is rl_general_odo_ahrs_rand2.yaml, unchanged ---------
#
# THE RANGES, TIGHTENED ONTO THE MEASUREMENT. Second attempt at randomising
# the AHRS error parameters, after rl_general_odo_ahrs_rand failed.
#
# WHAT FAILED, measured 2026-08-28 at --encoder counts --ahrs tm151:
#
#                            tau 2.0        tau 0.19
#   general_rl_odo_ahrs      0.672 / 1.00   0.570 / 0.95
#   general_rl_odo_ahrs_rand 0.480 / 0.85   0.457 / 0.75
#
# Worse at both taus, on 12M steps against 6M. The score spread across tau did
# collapse (0.102 -> 0.023), so it IS flatter in tau -- by being uniformly
# worse, which is not robustness.
#
# WHY, and it was predicted IN THE PREVIOUS CONFIG rather than diagnosed after:
# log-uniform over 0.05-2.0 deg puts the MEDIAN episode at 0.32 deg and only
# 7.8% at or above the 1.5 deg design case. The policy spent most of training
# on a sensor cleaner than the one it has to fly. The old header said: "if the
# policy comes back robust across tau but worse than general_rl_odo_ahrs at
# tm151 itself, raise the floor to ~0.3 rather than abandoning the log." That
# is exactly what happened, and this is that change.
#
# THE TWO RANGES, and what each is now centred on:
#
#   RMS   0.3 - 2.0 deg   floor raised from 0.05. 0.3 is above a bench
#                         calibration and below the datasheet's 1.5 dynamic
#                         bound; 2.0 still exceeds the bound, because a bound
#                         is not a measurement. Fraction at or above 1.5 deg
#                         goes 7.8% -> 15.6%, and the median 0.32 -> 0.77.
#   tau   0.1 - 0.6 s     was 0.1-3.0. 0.19 s is measured at rest, and a fusion
#                         filter's correlation time under motion is unlikely to
#                         be 10x slower than at rest. The old range was
#                         spanning IGNORANCE; this one spans a belief with the
#                         measurement inside it.
#
# RUN THIS ONLY IF rl_general_odo_ahrs_tau019 DOES NOT SETTLE IT. That run
# pins tau at the measured 0.19 instead of spanning it, and if it beats
# 0.672 / 1.00 the answer is "identify, do not randomise" and this file is
# unnecessary. Randomising is the fallback for a parameter that stays unknown,
# not the default.
#
# WHAT TO LOOK FOR: both taus, as before, and the bar is the SPECIALISED
# policy, not the failed one --
#
#   python analysis/chatter.py --policies general_rl_odo_ahrs_rand2 \
#       --encoder counts --ahrs tm151 --ahrs-tau 2.0     # beat 0.672 / 1.00
#   python analysis/chatter.py --policies general_rl_odo_ahrs_rand2 \
#       --encoder counts --ahrs tm151 --ahrs-tau 0.19    # beat 0.570 / 0.95
#
# LAUNCH (on the remote box, after committing and pushing):
#
#   ./scripts/rl.sh sync
#   ./scripts/rl.sh up general --config config/rl_general_odo_ahrs_rand2.yaml \
#       --run-dir runs/general_rl_odo_ahrs_rand2 \
#       --export-name general_rl_odo_ahrs_rand2
#
# --- inherited from rl_general_odo_ahrs.yaml, unchanged ---
# WHY. rl_general_odo put the ONBOARD VELOCITY ESTIMATE in the observation and
# it worked -- general_rl_odo clears the eval grid at survival 1.00 where the
# truth-trained general_rl_smooth_diff_pi manages 0.15. But that run left two
# things idealised, and measured 2026-08-27 the second one is the bigger risk
# by a wide margin:
#
#   * THE ENCODER was read as instantaneous joint velocity -- no quantisation,
#     no lag. Modelled properly (4096 counts/rev differenced through the same
#     25 ms RateFilter the Pi runs), it costs general_rl_odo NOTHING: 0.771
#     against 0.766, survival 1.00 either way. Included here because it is free
#     and it is what the bike does, not because it is expected to matter.
#
#   * THE AHRS was perfect. It is not, and this is the one that hurts. The
#     TM151's DYNAMIC roll/pitch accuracy is <1.5 deg RMS while the bike holds
#     0.2-3.3 deg of roll -- the error is the size of the signal -- and roll,
#     roll_rate and yaw_rate are observation entries 0, 1 and 2, the FAST loop,
#     with nothing averaging them. Measured on policies that never trained
#     against it:
#
#       level          roll/pitch  general_rl_odo  smooth_diff_pi  nolat
#       none                -      0.766 / 1.00    0.808 / 1.00    0.780 / 1.00
#       tm151_static     0.5 deg   0.734 / 1.00    0.261 / 0.45    0.491 / 0.70
#       tm171            1.0 deg   0.689 / 1.00    0.126 / 0.25    -
#       tm151            1.5 deg   0.537 / 0.90    0.110 / 0.20    0.149 / 0.25
#
#     The BENCH figure alone takes the standing default from clearing the grid
#     to 0.45 survival. general_rl_odo is far more robust and nothing trained
#     it to be -- which is precisely the hypothesis this run tests.
#
# THE HYPOTHESIS. Training on a wrong-but-correlated VELOCITY taught the policy
# not to over-trust that channel, and it generalised. If that is the mechanism,
# training on a wrong-but-correlated ATTITUDE should do the same for roll --
# and general_rl_odo's 0.90 should come back to 1.00. If instead odo is merely
# LESS REACTIVE (it is 6x quieter and saturates 1.2% of steps against 50.6%),
# this run will not help and the answer is a better part or a filter.
#
# WHAT TO LOOK FOR, in order:
#   * survival at --ahrs tm151 on the eval grid. Baseline to beat: 0.90.
#   * whether it also holds at tm151_static and tm171 (it should; they are
#     strictly easier).
#   * steer_rest_deg. smooth_diff_pi answers AHRS noise by sawing the steer
#     (49.6 deg at rest under tm151_static). A policy that has LEARNED the
#     noise should stay quiet instead.
#   * whether tracking pays for it. odo already trails on truth (0.772 vs
#     0.808); if robustness costs another 0.05 of track that is a real price.
#
# THE REWARD STILL KEEPS TRUTH. Same rule as the velocity estimate, for the
# same reason: score the policy on what it THINKS its attitude is and it can be
# rewarded for fooling its own AHRS. `general_env._obs` corrupts only the
# observation; `s` -- what the reward prices -- stays MuJoCo truth.
#
# TAU IS A GUESS -- AND THIS PARAGRAPH WAS WRONG, WHICH IS WHY THIS FILE
# EXISTS. It read: "swept at tm151 the eval result is flat across 0.1-5 s, so
# the run is not balanced on it". That sweep was run on general_rl_odo, which
# never trained against an AHRS; on general_rl_odo_ahrs, which did, the same
# move costs 0.672 / 1.00 -> 0.570 / 0.95. A flat sweep on a policy that did
# not train on the parameter says nothing about one that did. Superseded by
# ahrs_tau_s_range below.
#
# REPLAY NEEDS BOTH FLAGS. On hardware they are automatic; in sim neither is.
#
#   mjpython -m aow_sim.run_drive --teleop --odometry front \
#       --odometry-encoder counts --ahrs tm151 --general general_rl_odo_ahrs_rand
#
# NOTE THE --general. control.general_move now names general_rl_odo_ahrs (as of
# 2026-08-28), so the DEFAULT pairing is finally a sensor-trained one -- but it
# is not THIS export until this run finishes and is judged. Teleop prints a
# mismatch NOTE in both directions, because the bike looks broken and the
# policy is not what is broken -- the pairing is.
#
# LAUNCH (on the remote box, after committing and pushing):
#
#   ./scripts/rl.sh sync
#   ./scripts/rl.sh up general --config config/rl_general_odo_ahrs_rand.yaml \
#       --run-dir runs/general_rl_odo_ahrs_rand \
#       --export-name general_rl_odo_ahrs_rand
#

algo:
  algorithm: PPO
  total_timesteps: 18000000   # 12M -> 18M. NOT a hedge: the sensor runs spend
                              #   most of the budget on the curriculum RAMP,
                              #   and the behaviour this arm is chasing only
                              #   exists at full difficulty. See the header.
  n_envs: 32    # was 8
  learning_rate: 3.0e-4
  n_steps: 512 # was 2048  -> 32 x 512 = 16384, unchanged
  batch_size: 1024
  n_epochs: 10
  # gamma at 50 Hz: 1/(1-g) = 100 steps = 2.0 s of lookahead, which matches
  # the timescale of a heading change. THE MOVES' 0.99 AT 200 Hz IS ONLY
  # 0.5 s — far too myopic here; they get away with it because their reward
  # is a dense per-step yaw-progress term rather than setpoint tracking.
  # If control_rate_hz is raised back to 200, gamma must go to ~0.998.
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005        # ball_rl's lesson: 0.0 collapsed exploration
  net_arch: [128, 128]
  seed: 0
  eval_every: 1000000     # BestByScore cadence [timesteps]

env:
  action_space: full
  # 50 Hz, not the moves' 200 Hz: standard for locomotion RL, and it makes a
  # 2.5 s maneuver 125 steps instead of 500 — far better credit assignment.
  # Replay is ZOH at this rate, so the controller holds each action 4 physics
  # ticks longer than a move does.
  # The one change from rl_general_smooth_diff.yaml.
  obs_odometry: true
  odometry_mode: front   # what the Pi runs today; `blend` is the experiment
  # The two changes from rl_general_odo.yaml.
  odometry_encoder: counts   # 4096 counts/rev, differenced, 25 ms RateFilter
  ahrs_level: tm151          # the part we own, at its DYNAMIC accuracy
  # ahrs_tau_s: 2.0          # GUESS, not a datasheet number. See sim_ahrs.
  control_rate_hz: 50
  max_episode_s: 15.0    # long: the policy must hold a command, not finish one
  v_max: 1.2             # matches control.drive.v_max in bike_params.yaml
  obs_pitch: true        # THE ONE CHANGE. See the header: the odo/ahrs line
                         # inherited `false` by omission from rl_general.yaml
                         # and has never been able to turn around.
  v_lat_frac: 0.4        # lateral command as a fraction of the speed limit
                         #   (the rear omni makes crabbing physical); only
                         #   opens up with curriculum difficulty
  p_v_zero: 0.2          # chance the speed command is exactly 0 (stop is a
                         #   first-class command, not an edge case)
  resample_s: [1.5, 4.0] # command re-drawn as a STEP change this often
  ball_prob: 0.25        # fraction of episodes with a ball parked nearby --
                         #   contact robustness only, NO ball reward. Set to
                         #   0.0 to train on the ball-free model.
  ball_place_radius: 0.5 # ball dropped within this radius of the start pose
  action_bounds:
    steer_rate_max: 8.0
    hub_max: 1.4         # v_max 1.2 + margin (moves cap at 0.6-0.72 because
                         #   they are standstill maneuvers)
    diff_max: 40.0

curriculum:              # the repo's first; a single scalar scaling the
  enabled: true          #   command sampling ranges in _sample_command
  start: 0.15            # gentle: low speed, +-30 deg heading steps, no crab
  step: 0.02             # advance per episode that clears advance_score
  advance_score: 0.6     # mean of (vel + heading) tracking rewards, in [0,1]

reward:
  # Bounded-POSITIVE tracking + alive bonus. Over a 15 s episode a
  # penalty-only reward (the moves' form) makes falling early strictly
  # rational; this removes that incentive.
  w_vel: 1.5             # x exp(-|v_cmd - v|^2 / sigma_v^2)
  w_head: 1.0            # x exp(-(psi_err/sigma_psi)^2)
  w_alive: 0.5
  sigma_v: 0.35          # [m/s] tracking tolerance scale
  sigma_psi_deg: 25.0    # heading tolerance scale
  w_upright: 0.5
  w_effort: 0.001
  # [steer_rate, hub, diff]. One number here would price all three alike
  # (the historical form); the list is what lets `diff` be asked a separate
  # question -- see the header. All three equal == the scalar form exactly.
  w_smooth: [0.05, 0.05, 0.25]
  penalty_fall: 50.0
  fall_roll_deg: 60

randomization:           # as rl_flick/rl_pivot
  enabled: true
  init_roll_deg: 2.0
  init_yaw_deg: 5.0
  init_pos_m: 0.02
  init_vel: 0.05
  mass_frac: 0.15        # was 0.1. The as-built payload mass (battery + Pi +
                         #   U2D2 + buck, ~190 g of a 1.02 kg bike) is a GUESS
                         #   until the thing is weighed, and it is a bigger
                         #   share of the total than anything else unmeasured.
  friction_frac: 0.2
  # Supply voltage. The model's servo numbers are the 12 V datasheet column,
  # but a 3S pack spans 12.6 V (full) to 9.9 V (cutoff) -> ~0.83-1.05x nominal
  # strength. 0.15 covers that window with margin. Scales ctrlrange AND
  # forcerange from a single draw (speed and torque both go with voltage) --
  # see control/randomize.py. Untethered transfer depends on this.
  actuator_frac: 0.15
  disturb_force_N: 2.0
  disturb_prob: 0.01
  # THE AHRS ERROR PARAMETERS, log-uniform per episode. The one change from
  # rl_general_odo_ahrs.yaml. See the header.
  #
  # Roll/pitch RMS in degrees; the level's yaw figure scales with it, so the
  # part keeps its yaw:roll character rather than a third number being
  # invented. 0.05 is a floor near the measured resting 0.0142; 2.0 is above
  # the datasheet's 1.5 dynamic bound, because a bound is not a measurement.
  ahrs_orient_rms_deg_range: [0.3, 2.0]
  # Correlation time in seconds. 0.19 measured at rest, 2.0 was the guess
  # general_rl_odo_ahrs trained on; the range covers both with room either
  # side. Log-uniform because the band is ~30x wide.
  ahrs_tau_s_range: [0.1, 0.6]
  #
  # WHAT LOG-UNIFORM COSTS AT THE HARD END, written down because it is the one
  # way this run can quietly fail. Fraction of episodes above a given RMS is
  # ln(2.0/x)/ln(40):
  #
  #                                    was [0.05,2.0]   now [0.3,2.0]
  #     >= 0.5 deg (datasheet STATIC)        37.6%          73.7%
  #     >= 1.0 deg (TM171 dynamic)           18.8%          36.9%
  #     >= 1.5 deg (TM151 dynamic, DESIGN)    7.8%          15.6%
  #     median episode                       0.32 deg       0.77 deg
  #
  # The design case is still only ~1 episode in 6, which is deliberate: the
  # 1.5 deg figure is a datasheet BOUND, not a measurement, so training as if
  # every episode sat at the bound would be its own specialisation. But the
  # median episode is now harder than a bench calibration rather than easier,
  # which is the specific thing that went wrong last time.
