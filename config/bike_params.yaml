  steering:
    gear_ratio: {value: 1.0, source: design}  # servo rotation per steer rotation; range is continuous 360°+
    # HEADSET FRICTION, the printed bushing + thrust face, UNDER the XC330's
    # gearbox friction (which the joint already has): a + b x |T|, T the
    # axial load through the thrust face [N]. In the sim T is the headset's
    # reaction along the steer axis (the `headset_force` sensor); airborne it
    # reverses and the upper's skirt takes it, hence |T|.
    # gearbox_friction.attach_steer applies it.
    #
    # From steering-design.md "First print", 2026-09-30, running friction
    # at the output over four thrust loads, 86-368 g along a 15 deg axis:
    # tau = 7.68 + 0.0518 x grams mN m (rms 0.4). The gearbox's running line
    # passes 0.15 x load + 5.7 on, so the headset alone is
    # (tau - 5.7) / 1.15 = 1.72 + 0.0450 x grams, and per NEWTON ALONG THE
    # AXIS (x cos 15 of the weight): 4.75 mN m/N. At the bike's ~3.5 N the
    # two together give the bench's 26.6.
    #
    # THE PRINTED SEAMS' PEAKS (to 47 mN m, two spots 180 deg apart) ARE NOT
    # IN THIS, on purpose (user): the seam is fixable in printing. Running
    # friction only; the static was ~1.5x on the one breakaway sweep (no
    # load), not modelled. Measured on the first print -- a reprint moves it.
    # The bushing's SIDE load is in b implicitly: on the bench the weight
    # hung vertically off a 15 deg axis (side/axial = tan 15 = 0.27), and
    # the bike at rest has nearly the same ratio (0.88 / 3.19 N = 0.28).
    headset_friction_nm: {value: 0.00172, source: measured}      # N m, a
    headset_friction_per_n: {value: 0.00475, source: measured}   # N m per N, b
  ahrs:                                       # SYD Dynamics TM151
    # On the drive's tabs, USB up and back (v2 CAD). `pos` is the centre of
    # the housing (footprint centre, mid-height): where `ahrs_site` -- the
    # IMU sensors -- sits, and the point sim_ahrs.TM151_ACCEL_OFFSET_M is
    # measured from. `quat` is the TM151's OWN axes in the chassis frame
    # (datasheet: +x the pin header, +z out of the housing's top): +x down
    # and forward, +z up and forward -- pitched 45 deg nose-down about y.
    # The SITE stays on the chassis axes: on the bike the mount calibration
    # (config/ahrs_mount.yaml) rotates the readings into that frame, so
    # chassis-aligned is what the controllers see. The tilt reaches the sim
    # through the box and through where the accelerometer sits in the part
    # (sim_ahrs.tm151_to_site).
    pos: [0.0989, 0.0, 0.0842]
    quat: [0.92388, 0.0, 0.38268, 0.0]
    mass: {value: 0.019, source: datasheet}   # was 0.012 GUESS
    box_size: [0.040, 0.034, 0.0126]          # in its own axes: x along the 40
  payload:
    # Untethered running gear -- see docs/plans/untethered-setup.md, entries
