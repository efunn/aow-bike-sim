servos:
  # The 12 V datasheet column, i.e. the tethered bike. On a 3S pack (11.1 V
  # nominal, 9.9 V at cutoff) the servos have ~12 % less torque:
  #   XC430-W150   1.4 N m /  99 rpm at 11.1 V   (1.6 / 106 here)
  #   XC330-T181   0.76 N m / 104 rpm at 11.1 V  (0.80 / 113 here)
  # The sim stays a 12 V bike; training covers the range with
  # randomization.actuator_frac.
  xc430_w150:   # 2x, AOW drive (values at 12 V per datasheet)
    stall_torque: {value: 1.6, source: datasheet}
    stall_current: {value: 1.4, source: datasheet}
    no_load_rpm: {value: 106.0, source: datasheet}
    mass: {value: 0.065, source: datasheet}
    box_size: [0.034, 0.0285, 0.0465]   # D x W x H, axis along Y
    # placements: bike.frame_parts.servo_drive_left / _right
  xc330_t181:   # steering and righting (values at 12 V)
    # The motor line fitted to ROBOTIS's PERFORMANCE GRAPH (docs/robotis/,
    # 2026-11-04), not the rated stall torque (0.80 at 12 V): ROBOTIS's note
    # says the rating is momentary and real-world output is "closer to the
    # performance graph". The graph's output torque taken back through the
    # gearbox's running loss (0.15 x load + 0.0057, below) and fitted with
    # no-load held at 113 rpm (the bare shaft's 110-116 measured): 0.559,
    # within 0.02 N m from 0.08 to 0.36 N m, 0.03 at 0.38. The graph does
    # not state its voltage (the XC330's nominal is 11.1 V): read at 11.1 V
    # the same fit gives 0.635 (rms 0.031 against 0.017). The bike decides
    # for ~12 V: its lifts at full PWM run 17-19 rpm at ~640 mA on 11.6-11.8 V,
    # where the voltage-free current law below gives 0.44 N m of motor torque
    # and this line needs S 0.53-0.54 to match (0.635 would be 20 % over).
    # AGAINST it all: the X330 fixture (2026-09-26) read 0.62-0.69 N m per
    # unit duty, brief holds at low load; a lever and mass at 0.3-0.5 N m
    # would settle it.
    stall_torque: {value: 0.559, source: datasheet}
    # kt = stall_torque / stall_current sets the current a given load draws and
    # does not depend on pack voltage (used for the power budget in
    # docs/plans/untethered-setup.md and `self_righting.py lift`).
    stall_current: {value: 0.88, source: datasheet}
    no_load_rpm: {value: 113.0, source: datasheet}
    # Current-based position mode (5), the righting servo's: motor torque
    # k (|I| - I0). From the performance graph's current line (0.20-0.67 A),
    # its output torque taken back through the running gearbox loss, as for
    # stall_torque: within 0.015 N m to 0.62 A, 0.022 at 0.67 (2026-11-04).
    # Was the X330 fixture's 0.83 (I - 0.0165), fitted at 35-129 mA and
    # extrapolated to the lift's ~640 mA, where it gave 0.45 N m at the
    # output against the graph's ~0.37 (docs/plans/righting-servo-model.md).
    current_deadband: {value: 0.0444, source: datasheet}      # A
    current_torque_gain: {value: 0.736, source: datasheet}    # N m / A
    # Gearbox friction, both XC330s (righting crank and steer):
    # fraction x load + constant, load = the torque the gearbox passes on.
    # Static from mode 5's four loads, running from mode 3's four speed lines.
    # Applied by gearbox_friction.py.
    friction_static_fraction: {value: 0.51, source: measured}
    friction_static_nm: {value: 0.0051, source: measured}
    friction_running_fraction: {value: 0.15, source: measured}
    friction_running_nm: {value: 0.0057, source: measured}
    # Below this output speed the static pair applies. A modelling threshold:
    # loaded slides ran 30-40 deg/s once going.
    friction_stick_speed: {value: 0.05, source: model}      # rad/s
    mass: {value: 0.023, source: datasheet}
    box_size: [0.026, 0.020, 0.034]
    # placement: bike.frame_parts.servo_steer (the righting's: righting.module.servo_case)

actuators:
  # The IDEAL drive plant's servo, both gains at the input shafts (after
  # belt_ratio):
  #   force = drive_ki * integral(ctrl - w) dt - drive_kv * w
  # Only the ideal plant uses these (the LQR's design plant, the flick, pivot
  # and ball envs, policies exported without a `drivetrain_model:` record). The
  # default detailed plant replaces them with drivetrain_model.servo, fitted on
  # the bench.
  #
  # Neither is measured. drive_kv is the bare motor's droop, stall_torque /
  # no_load_speed / belt_ratio^2 = 1.6 / 11.098 / 9, which gives max force
  # stall_torque / belt_ratio and an input_armature / kv time constant of
  # 18.7 ms, the motor's own. drive_ki 0.6 is the Dynamixel X-series default
  # KVI/KVP ratio at an assumed 1 kHz firmware loop; Ti = kv / ki = 26.7 ms.
  drive_kv: 0.016016   # N m s/rad at the input shaft; see above
  drive_ki: 0.6   # N m/rad
  # The steering servo, at the steer joint (steering.gear_ratio 1.0, so the
  # joint is the servo shaft). The XC330 runs in extended position mode (4),
  # whose PID output is PWM duty, so it maps exactly onto MuJoCo's position
  # actuator:
  #   tau = [Kp * k3 * tau_stall] * err - [tau_stall / w_noload] * w
  # `steer_gains` are the firmware registers, written to the servo at startup
  # (BikeBus); the sim's kp is Position P Gain x steer_kp_per_unit, derived by
  # params.load_params as actuators.steer_kp. kv is the motor's back-EMF droop.
  #
  # The per-unit scale and steer_armature were fitted together to open-loop sine sweeps of the
  # steer XC330 at P 900, column and headset fitted, +-5 deg at 1-10 Hz
  # (analysis/servo/steer_response.py, traces/bench/steer_response_261017-*.json;
  # the sim side is analysis/policy/steer_pinned.py --sine --bare): within ~0.03
  # gain / 3 deg of the bench at every frequency. A second unit, bare, agreed
  # within 0.02. The fit, kp 2.3 at P 900, is 11 % above the derived
  # k3 x tau_stall = 2.877e-3 x 0.80 per unit (2.07 at P 900), unexplained.
  #
  # kv is held at the droop, 0.80 / 11.833, not fitted: the sweeps only fix
  # kp / kv, and the no-load speed fixes kv (a fitted 0.055 let a saturated
  # steer run at 14.5 rad/s against the 11.9 measured).
  #
  # Not modelled: below ~0.25 rad/s the bare servo holds within ~1 encoder
  # count with no droop or friction offset. On the bike the wheel's scrub and
  # backlash will set small motions; measure them on the assembled steering.
  steer_gains:
    Position P Gain: 900      # factory default for mode 4
    Position I Gain: 0
    Position D Gain: 0        # the back-EMF droop already damps the loop
  #
  # RESCALED 2026-11-04 with the XC330's stall torque (0.80 -> 0.559, the
  # performance graph): the sweeps fix kp / J and kv / J, not their scale, so
  # kp per unit, kv (the droop, 0.559 / 11.833) and the armature all moved by
  # 0.699. The bare servo's response is unchanged; against the tyre, headset
  # and gearbox frictions (absolute N m) it is weaker. Were 2.5556e-3, 0.0676
  # and 5.5e-4.
  steer_kp_per_unit: {value: 1.7857e-3, source: measured}   # N m/rad per P unit: 1.61 at P 900
  steer_kv: 0.0472
  # The XC330's rotor + gearbox inertia at the steer joint [kg m2], from the
  # same sweeps: ~13x the fork and wheel about the axis.
  steer_armature: {value: 3.843e-4, source: measured}
  # Where the torque limit sits. The firmware clips the duty, then the motor
  # subtracts its back-EMF:
  #   duty:  tau = clip(kp*err, +-stall) - kv*w   (the real servo, mode 4)
  #   total: tau = clip(kp*err - kv*w, +-stall)   (MuJoCo's native clip)
  # They differ once the P term saturates: `total` let the steer reach
  # 23.2 rad/s against an 11.8 no-load. `duty` builds a kp-only position
  # actuator plus kv as joint damping. `total` is kept so a pre-2026-09-21
  # policy's training plant can still be built.
  steer_clip: duty
  # Frame that computes a steer goal -> the servo's reference moving: 4.0 ms on
  # both XC330s in mode 4 (servo-measurements.yaml, `xc330_command_delay`),
  # frame-quantised, so the true value is in (2, 4] ms. MuJoCo's native
  # actuator delay.
  steer_command_delay_s: {value: 0.004, source: measured}

control:
  # What the bike's controllers read that is not a measurement. The analytic
  # controllers' settings (PD, LQR, its drive, flip, pivot) are
  # config/studies/analytic_control.yaml; the onboard ones config/onboard.yaml.
  # Both are merged in by params.load_params().
  rate_hz: 200          # controller update rate; zero-order hold between updates
  moves_dir: moves      # optimized maneuver files (moves/<name>.yaml); see optimize_flick.py
  # The always-on general policy teleop and the bike drive with, as
  # moves/<name>.{yaml,npz}; retired moves in moves/archive/ load by bare name.
  # `run_drive --general NAME` overrides it for one session. Changing it moves
  # neither digest. Why each pointer was chosen is in docs/status.md and the
  # DEVLOG.
  general_move: general_puffer_a40_v4_80M
  drive:
    # The speed cap teleop and the bike's command path clamp to.
    v_max: 1.2          # m/s; ~70% of the 1.7 no-load ceiling (torque margin)

# Free play at the wheels (build_model's WHEEL PLAY): each group a massless body
# with limited hinges between a part and what it carries. travel_mm is the
# TOTAL sideways travel at the ground, end to end, by hand; build_model turns it
# into a half-angle through the group's lever arm. In the default plant since
# 2026-10-31 (it was only in the RL configs and each export's own record, which
# replay still uses: a policy flies the play it trained on unless
# --wheel-play names another, e.g. this file).
wheel_play:
  front_axle:      # the front wheel on its axle: yaw + camber
    # 1.0 fitted 10-26; the axle nut 10-28 left "no obvious play, at most a
    # third" (user). Loosened again 10-31 for the axle drag, not re-measured.
    travel_mm: {value: 0.33, source: estimate}
    centring_stiffness: {value: 4.0, source: GUESS}     # N m/rad
    wall_timeconst_s: {value: 0.002, source: model}     # the ends' solref
  headset:         # steerer clearance: the fork tilts sideways
    travel_mm: {value: 0.5, source: estimate}           # 1.5 before the 10-28 shim
    centring_stiffness: {value: 4.0, source: GUESS}
    wall_timeconst_s: {value: 0.002, source: model}
  rear_axle:       # the omni wheel on its axle: yaw + camber
    travel_mm: {value: 2.5, source: measured}           # 10-26
    centring_stiffness: {value: 4.0, source: GUESS}
    wall_timeconst_s: {value: 0.002, source: model}
  rear_axle_lateral:   # the omni wheel sliding along its axle: a slide, N/m and N s/m
    travel_mm: {value: 1.0, source: measured}           # +-0.5 mm by hand, 10-29
    centring_stiffness: {value: 2000.0, source: GUESS}  # the hinges' 4 N m/rad at the ground
    damping: {value: 1.0, source: GUESS}
    wall_timeconst_s: {value: 0.002, source: model}

righting:
  # The bike's righting: `module`, the V2 four-bar with its blades, and
  # `rollcage`, its roof. The study mechanisms are
  # config/studies/righting_mechanisms.yaml.
  rollcage:
    # The v2 rollcage as fitted (cad.bike_v2.rollcage): two 270 deg rings,
    # outer radius 68.7 mm (the blades' widest at rest), axis 100 mm above the
    # rear axle, open 90 deg at the bottom, the rear ring's outboard face on
    # the rear axle's plane, the front's on the front axle's. The rings are
    # the contact (build_model._add_rollcage). The CAD's end caps and the
    # sheet between the rings will not be fitted (user, 11-03); until then the
    # sim carried rings, caps and sheet as one 212 g capsule, `roof`.
    radius: {value: 0.0687, source: design}
    height: {value: 0.100, source: design}       # its axis, above the rear axle
    mass:
      cages: {value: 0.0682, source: estimate}   # 2 x 34.1, the slicer's (user, 11-03), ASA
      screws: {value: 0.0048, source: measured}   # 4 x 6-32 + nut (one a side a ring), 1.2 g each (10-21)
    # Each ring's centroid [m], rear then front, from the CAD eval of 10-19
    # (traces/bike_v2_cad/mass_eval.txt), so before the hand finishing (71.5 ->
    # 77.5 cm3 each). It includes the bar and tongue into the rail, which the
    # drawn ring does not.
    centroid: [[0.00519, 0.00046, 0.11051], [0.19531, -0.00046, 0.11051]]
  module:
    # The V2 righting module, built by default: the diamond four-bar as
    # aow_sim.cad.righting draws it (one crankpin, one wing rod), the blades of
    # `blade_file` (V3 since 2026-10-14), and an XC330 in current-based position
    # mode. swing_linkage=False builds the wingless bike every export before
    # 2026-10-09 trained on.
    #
    # The geometry is not copied here: `linkage_cad` names the CAD's own config
    # and `blade_file` the blade outline, and params.resolve_righting_module
    # inlines both, so plant_digest moves when either file does.
    linkage_cad: {value: config/cad/righting_cad.yaml, source: design}
    blade_file: {value: config/linkage/blade_v3.yaml, source: design}   # V2 is config/linkage/righting_blade.yaml
    # The couplers' mid-plane on the wing rod, ahead of the rear axle (the CAD's).
    # Module-frame fore/aft positions below are relative to it.
    station_x: {value: 0.1205, source: design}
    # Masses, all estimates: CAD volumes (traces/righting_check.txt, 2026-10-07) as
    # printed parts (cad.servo_mount.printed_mass) and steel at 7.85 g/cm3.
    # Nothing weighed. `at`: the group's centroid in the module frame, mm --
    # [out (+ = the right wing's side), up from the wing rod, fore].
    crank:     # both half cranks, horn hub, steel crankpin, washer
      mass: {value: 0.0112, source: estimate}
    coupler:   # each
      mass: {value: 0.0023, source: estimate}
    # Each wing's body past its blade, as ONE point mass at `wing_hub.at`
    # (params.wing_hub_mass sums the four entries; build_model puts it there).
    # Split 11-03: the old single 14.9 g was the CAD of 10-07, with the CAD's
    # two ~1 g placeholder stubs, before the hand finishing.
    wing_hub:   # rocker + knuckle, printed: the CAD of 10-28 (traces/righting_check.txt)
      mass: {value: 0.00558, source: estimate}   # 2.78 + 2.80 g by cad.servo_mount.printed_mass
      at: [31.0, 17.1, -3.3]   # the 10-07 group's centroid, kept: the split moves it ~mm
    wing_pin:   # the steel rocker pin: 0.543 cm3 (the same CAD) x 7.85 g/cm3
      mass: {value: 0.00426, source: estimate}
    wing_stub:   # the slicer's, blade + stub 42.74 g less the blade 38.10 / 38.09 (user, 11-03)
      mass: {value: 0.00464, source: estimate}
    blade:   # each
      mass: {value: 0.0286, source: estimate}   # V2's; the blade file's own mass wins (V3: 38.8 g)
    # Fixed to the chassis, one entry per part from the v2 evals
    # (traces/bike_v2_cad/): `at` in the module frame (mm), `size` full extents
    # in the chassis frame [fore, across, up] (a cylinder: [radius, length]).
    fixed:     # printed parts at their CAD centroids; the steel wing rod a cylinder along the bike
      bulkhead: {mass: {value: 0.0054, source: estimate}, at: [0.0, 22.6, 18.5], size: [0.01, 0.0247, 0.0588]}
      bridge: {mass: {value: 0.0066, source: estimate}, at: [0.0, 53.6, 0.0], size: [0.047, 0.0344, 0.01]}
      lower_case: {mass: {value: 0.0116, source: estimate}, at: [0.0, 20.0, -24.7], size: [0.0307, 0.0247, 0.0588]}
      upper_case: {mass: {value: 0.0078, source: estimate}, at: [0.0, 19.0, -51.2], size: [0.0223, 0.0281, 0.051]}
      wing_rod: {mass: {value: 0.0104, source: estimate}, at: [0.0, 0.0, 0.0], size: [0.003, 0.047], type: cylinder}
    # The crank's XC330 case (its mass from servos.xc330_t181). `at` in the
    # module frame (mm); `size` in the chassis frame, shaft forward.
    servo_case:
      at: [0.0, 17.6, -44.2]
      size: [0.023, 0.020, 0.034]
    # LEAD BALLAST (6 mm lead), hung under that case (user, 11-03). In the
    # sim (the 1157 g model, before the weighing), 30 g here lowers the CoM enough to help BOTH get-ups (least Goal
    # Current to get up 580 -> 560, slow-ramp peak 0.498 -> 0.473 N m), and
    # each mm of CoM moved sideways shifts ~10 mA between the sides' lifts
    # (scratch study, 11-03): `out` toward the right (+) evens a heavy left.
    # mass 0 = not fitted: no geom, and plant_digest leaves a 0 g ballast
    # out, so the bike is unchanged until it is weighed and placed.
    ballast:
      mass: {value: 0.0, source: design}
      at: [0.0, -2.4, -44.2]      # [out, up from the rod, fore] mm: touching the case's underside
      size: [0.030, 0.018, 0.006]   # chassis frame [fore, across, up]
    # The crank servo; the four-bar's own `limits.torque_nm` caps it
    # (build_model._add_swing_linkage).
    servo: xc330_t181
    # The crank servo's firmware registers, current-based position mode (5),
    # written to it at startup (BikeBus) and read by the sim's servo model
    # (righting_servo.py). Factory P700/I0/D1400. D is the loop's only
    # damping: commanding current removes the back-EMF droop. I stays 0: an
    # integrator would wind up against the floor at the end of the stroke.
    #
    # params.load_params derives the native actuator's gains at the crank from
    # them (righting.module.servo_kp / servo_kv), with the PID's output read as
    # milliamps (k5 = (4096/2pi) / (256 x 1000) A per count-rad, 2.525e-3
    # measured) and the measured torque per amp (servos.xc330_t181
    # .current_torque_gain):
    #   servo_kp = P x k5 x k            = 1.479
    #   servo_kv = D x (16 k5 x 1 ms) x k = 0.0473
    # The D term is taken per 1 ms loop tick; a bare-shaft fit put the real
    # value at 0.25-0.7x that, so kv is right in order of magnitude only.
    gains:
      Position P Gain: 700
      Position I Gain: 0
      Position D Gain: 1400
    # The XC330's rotor + gearbox inertia at the crank, measured 2026-10-17: the
    # bare righting XC330's own sine sweep in mode 4, the same fit and value as
    # actuators.steer_armature. The crank is on the horn, so the rotor inertia is
    # the crank's. Without one the position actuator rang at 1200-1300 deg/s.
    crank_armature: {value: 5.5e-4, source: measured}
    # The linkage's own friction referred to the crank, on top of the XC330's
    # gearbox friction (righting only; the steer has its own headset term):
    #   f(theta) = linkage_friction_nm + linkage_friction_q2 * theta^2  [N m]
    # theta = crank travel from stow [rad].
    #
    # Measured 2026-10-17 on V2 as built: stubs only, no blades, unloaded
    # (analysis/mechanism/righting_sweep.py, traces/righting_sweep/). Present
    # Current -> crank torque by this file's motor and gearbox laws, half the
    # difference of the two directions so gravity cancels; ramps of 15-120 deg/s
    # at 28-37 C, rms 8 mN m. The rise toward the ends is the transmission angle
    # falling (73 deg at stow, 30 at 129). Not in it: a ~15 mN m bump at crank
    # -60, a ~20 % rise with temperature, and the bike's weight on the pins.
    # Re-measure on the assembled bike; a cold repeat read ~30 % higher near
    # stow (one run).
    linkage_friction_nm: {value: 0.051, source: measured}
    linkage_friction_q2: {value: 0.0147, source: measured}   # N m / rad^2
