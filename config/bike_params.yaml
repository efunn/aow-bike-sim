    battery:                                  # 3S 1300 mAh LiPo, on the drive's back face
      pos: [0.02917, 0.0, 0.09387]
      mass: {value: 0.076, source: measured}
      box_size: [0.022, 0.058, 0.030]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
