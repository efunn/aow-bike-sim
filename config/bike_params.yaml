# AOW bike model parameters — single source of truth for the MJCF builder.
#
# Units: meters, kilograms, degrees (suffix _deg), N·m, rpm. Coordinates:
# +X forward, +Y left, +Z up; wheel axles along Y.
#
# Measurable leaves are written as {value: ..., source: ...} where source is one of:
#   measured    — caliper/scale measurement of the physical part
#   tooth-count — exact ratio from counting gear/pulley teeth
#   datasheet   — from ROBOTIS / SYD Dynamics documentation
#   design      — a choice we make for the custom chassis (record intent, verify as-built)
#   GUESS       — placeholder to be replaced; plausible for a 1:6-scale bike
# Plain scalars are simulation/tuning knobs, not physical quantities.

sim:
  # 4.0e-4, was 2.0e-4 (2026-08-15). The old value was placeholder-validated in
  # 2026-07 and never revisited. The CONTACT tolerates far more: in
  # analysis/contact/contact_surrogates.py --study timestep, ride ripple, airborne
  # fraction, peak normal force and rest penetration are flat from 5e-5 through
  # 6e-4, and general_rl_smooth_stiff replays the whole 20-command eval grid at
  # 0.764 -> 0.767 -> 0.760 across 2e-4 / 4e-4 / 6e-4 at survival 1.00.
  #
  # 6e-4 IS NOT SAFE, and the RL eval cannot see why. What binds is the LQR's
  # finite-amplitude system ID, which fits one linear model per grid speed:
  #
  #   dt      worst fit R^2   where
  #   2e-4        0.9748      +0.25 m/s
  #   4e-4        0.9727      +0.25 m/s
  #   6e-4        0.9408      +0.80 m/s   <- test_gain_schedule fails (floor 0.95)
  #
  # The damage lands almost entirely on +0.80 m/s, which was already the worst
  # point in the schedule. 4e-4 leaves the fit indistinguishable from 2e-4 and
  # still roughly halves wall-clock; 6e-4 buys ~30% more and degrades the
  # reference baseline to do it, which is the wrong trade for a knob that buys
  # nothing physical. Revisit if the LQR is ever retired or re-identified
  # differently. 2e-3 falls outright in run_balance.
  #
  # WHAT IT INVALIDATED, all ACCEPTED: every policy in moves/ was trained at
  # 2e-4 and is now an artifact of a different plant (check_move_digest says so
  # on load); the deploy bundle was re-exported. Impact cases (righting
  # sequence, fall/rest attitudes, inverted drops, the flick/flip trajopt set)
  # were re-run rather than assumed -- docs/plans/aow-contact-approximations.md.
  timestep: 4.0e-4
  integrator: implicitfast
  cone: elliptic          # elliptic friction cones + Newton solver (MuJoCo default solver)
  impratio: 10.0
  # 64, was 32 (2026-08-15). Tessellation of revolved contact meshes (rollers,
  # front tire). At 32 the facet sagitta is 241 um on a 50 mm wheel, which is
  # the same scale as the contact deflections -- so the PERFECTLY ROUND front
  # tire was bouncing off its own polygon: 17.5% of a 0.5 m/s drive off the
  # ground at a 0.26 mm ride swing, against 0.2% / 0.064 mm at 64 segments.
  # That is pure numerics, unlike the rear wheel's 8-fold envelope ripple,
  # which is measured real geometry (omni-wheel-protocol.md §1) and does not
  # move with tessellation at all. Costs ~3% of step time; 128 costs 19% and
  # buys almost nothing on top.
  mesh_segments: 64
  condim: 4               # 3 = sliding only; 4 adds torsional friction at the contact patch
  # Contact [time constant s, damping ratio]. Was MuJoCo's default [0.02, 1]
  # by omission, which let the rollers sink ~2.2 mm (a fifth of the roller
  # radius) into the floor while holding station. Penetration scales with the
  # square of the time constant, so this is ~16x stiffer. Raise it back toward
  # 0.02 if the solver starts complaining rather than to soften a contact.
  # SHIPS AT DAMPING 1.0 -- critical, so it cannot bounce. That is known to be
  # wrong: contact-protocol.md P1 recorded the real wheel bouncing 2-3 times,
  # which implies dampratio ~0.30. 0.5 was tried (picked from teleop feel plus
  # the slowmo study, never measured) and reverted.
  #
  # THE FIT GETS WORSE AS THE CONTACT GETS MORE REALISTIC. Measured 2026-08-22,
  # worst channel over the nine-speed LQR schedule:
  #
  #     dampratio    0.3      0.5      1.0 (this)     2.0
  #     worst R^2   0.8148   0.9297     0.9412       0.9602
  #
  # Monotonic. So there is no setting that is both faithful and well-fitting,
  # and MIN_FIT_R2 was lowered 0.98 -> 0.93 to stop asking for one; see the
  # rationale on that constant in control/linearize.py. Do NOT raise the
  # damping to recover the number -- that buys it by making the simulator less
  # like the bike.
  #
  # Supersedes an earlier note here claiming 0.861 at dampratio 0.5, >=0.975 at
  # 1.0, and 0.9893 currently. All three predate the velocity-PI drive servo,
  # which moved the fit substantially; none of them reproduce.
  #
  # NEXT: measure the wheel's contact dynamics on the bench, then switch to the
  # NEGATIVE solref formulation -- MuJoCo reads a negative pair as direct
  # (-stiffness, -damping) rather than (timeconst, dampratio), which is the
  # form a real system ID produces. Both entries here become measurements at
  # that point and this whole comment is replaced.
  contact_solref: [0.005, 1.0]
  # (dmin, dmax, width, midpoint, power). MuJoCo's stock default, written down
  # explicitly because it was an INVISIBLE inherited choice: nothing in this
  # repo ever set it, so every result to date silently assumed it.
  #
  # It is not negligible, and dmin confounds BOTH bench tests in
  # docs/measurements/contact-protocol.md. Measured on this model:
  #   dmin  0.9 -> 0.5    sink at bike weight 0.375 -> 0.647 mm (2.3x), and
  #                       restitution 0.46 -> 0.56 at dampratio 0.3
  #   dmax  0.95 -> 0.999 sink at 44 N 1.946 -> 1.709 mm, restitution flat
  #   width 1e-4 -> 1e-2  sink at bike weight 0.278 -> 0.419 mm
  # So the joint (timeconst, dampratio) identification is really a THREE
  # parameter problem until dmin is pinned. The negative-solref convention
  # does NOT change that: (-k, -b) is the same contact as (timeconst,
  # dampratio) = (2/b, b / (2 sqrt k)), identical drops under three solimp
  # settings including dmin 0.177 (tests/test_drop_rig_sim.py, 2026-10-04).
  # The "6% instead of 2.3x" once quoted here for the same dmin sweep under
  # (-8000, -60) compared a different contact -- that pair is (0.033, 0.34) --
  # not a different form.
  #
  # `width` 1 mm is the same scale as the deflections being measured, which is
  # why the contact is nonlinear across exactly the measurement range: secant
  # stiffness runs 26.6 N/mm at bike weight down to 22.7 N/mm at 44 N. Pinning
  # dmin = dmax does NOT fix that -- it makes it worse (ratio 0.85 -> 0.63),
  # because the residual is geometric: faceted cones and a contact patch that
  # grows as the wheel sinks.
  contact_solimp: {value: [0.9, 0.95, 0.001, 0.5, 2.0], source: GUESS}
  friction_sliding: {value: 0.9, source: GUESS}      # wheel rubber on hard floor -> P0b pull test
  friction_torsional: {value: 0.005, source: GUESS}  # scales with contact patch size -> validation
  floor_size: 3.0

omni_wheel:
  outer_radius: {value: 0.0512, source: measured}   # ridge Ø102.35; envelope ripples ~0.3 mm below
  width: {value: 0.033, source: measured}
  n_axles: {value: 8, source: measured}         # 8 axles x 2 truncated cones = 16 rollers
  axle_mount_radius: {value: 0.040, source: measured}  # wheel axis -> roller axle axis
  axle_cant_deg: {value: 0.0, source: measured}    # axles are purely tangential
  roller:
    big_diameter: {value: 0.022, source: measured}   # large end of one truncated cone
    small_diameter: {value: 0.019, source: measured}
    length: {value: 0.0075, source: measured}        # one cone, along its axis
    pair_gap: {value: 0.010, source: measured}       # big end to big end; floats 8.5-10 mm (axial play)
    big_end_inward: true    # confirmed: big ends face each other across the gap
    pair_mass: {value: 0.004372, source: measured}   # 2 cones + roller axle w/ 20t gear
  hub:
    # Carrier lump: frames 25.0 + casing 37.3 + 8 planet axles 8.0
    #             + ring gear 2 (counter-spin inertia neglected) 4.57 + screws 0.76 [g]
    mass: {value: 0.07563, source: measured}
    body_radius: 0.038      # inertia/visual cylinder (non-contact)
    body_width: 0.020
  ring:
    mass: {value: 0.00457, source: measured}      # ring gear 1 only (input-A side gear)
    body_radius: 0.030
    body_width: 0.008

drivetrain:
  # TEARDOWN: the wheel is a bevel DIFFERENTIAL. Two side ("ring") gears mesh all
  # 8 planet axles mounted in the carrier (= hub). Input A/B = ring gear 1/2
  # shafts, belt-driven directly (toy's motor pinions discarded). Hence:
  #   hub (carrier) = (ring1_abs + ring2_abs)/2 ; model "ring" body = ring gear 1.
  # Kinematics (rad per rad, signed):  [hub; ring_abs] = [[mix_hub_a, mix_hub_b],
  #                                                       [mix_ring_a, mix_ring_b]] @ [input_a; input_b]
  mix_hub_a: {value: 0.5, source: tooth-count}
  mix_hub_b: {value: 0.5, source: tooth-count}
  mix_ring_a: {value: 1.0, source: tooth-count}
  mix_ring_b: {value: 0.0, source: tooth-count}
  # Roller axle spin per radian of ring-vs-hub relative rotation:
  # (ring 48 / planet bevel 12) * (planet bevel 12 / roller gear 20) = 2.4.
  # Sign flips if the wheel is mounted flipped — confirm at final assembly.
  k_roller: {value: 2.4, source: tooth-count}
  # Input shaft speed / servo speed (pulley tooth counts; >1 = wheel side faster).
  belt_ratio: {value: 3.0, source: design}
  # Input shafts are the two ring-gear shafts, coaxial with the rear axle, one
  # per side. Lateral offset of the visual pulley from the wheel centerline —
  # placeholder until the mount/pulley design is done.
  input_pulley_offset: {value: 0.025, source: design}
  # Reflected rotor+gearbox inertia seen at each input shaft (XC430 rotor through
  # 159.59:1 internal gearing, then /belt_ratio^2). The IDEAL plant's only:
  # on the default detailed plant DrivetrainSim replaces it with the MEASURED
  # drivetrain_model.servo.rotor_inertia / belt_ratio^2 = 2.44e-4. Kept at
  # 3.0e-4 as a modelling choice, like the four below: promoting 2.44e-4 here
  # sped the ideal drive loop (armature / kv 18.7 -> 15.2 ms) and moved the
  # LQR's design twin and every ideal-trained policy's plant (2026-10-02,
  # tried and reverted). Was GUESS.
  input_armature: {value: 3.0e-4, source: design}
  # The IDEAL plant's drive-train losses, its only ones. A modelling choice,
  # not a hardware claim, kept at their old values so the LQR's design twin
  # and every ideal-trained policy keep exactly their plant. On the default
  # DETAILED plant DrivetrainSim zeroes all four (2026-10-02): the servo's
  # measured friction and inertia are a coast fit of the whole wheel in the
  # air (analysis/servo/drivetrain_fit.py coast), hub bearing and geared rollers
  # included, so they cannot be measured apart from it; and a roller inside
  # its play is damped by drivetrain_model.roller_slop alone. Were GUESS.
  hub_joint_damping: {value: 1.0e-4, source: design}
  hub_joint_frictionloss: {value: 1.0e-3, source: design}
  roller_joint_damping: {value: 1.0e-6, source: design}
  roller_joint_frictionloss: {value: 1.0e-5, source: design}

# THE DETAILED DRIVETRAIN -- the default plant since 2026-10-02 (was the
# opt-in overlay config/drivetrain_model.yaml). Every `measured` number is a
# fit to the Station A captures under traces/drivetrain/ (rear assembly, hand
# held, wheel in the air, 2026-09-13); `python analysis/servo/drivetrain_fit.py`
# re-derives them. Reasoning and what is open: docs/plans/drivetrain-model.md.
#
#   servo        the XC430 firmware velocity loop and the motor behind it,
#                replacing actuators.drive_kv / drive_ki and input_armature
#   detent       the differential's tooth-pass resistance, every 7.5 deg of
#                ring-vs-hub
#   roller_slop  per-roller free play between the roller and the drive
#
# THE HOOK. servo and detent are applied by drivetrain_model.DrivetrainSim's
# pre_step before EVERY mj_step; a loop that steps physics without it gets
# drives that never move. drivetrain_model.attach_hooks gives a loop that and
# the XC330 frictions in one call. drivetrain_model.base_params strips this
# block: the IDEAL drive (drivetrain.input_armature + actuators.drive_kv/ki),
# which is what the LQR is designed on, and what the flick/pivot/ball envs and
# every policy exported without a `drivetrain_model:` record trained on.
drivetrain_model:
  # Physics steps per firmware update (sim knob). The velocity loop runs once
  # every N steps and holds its torque between; the frictions still run every
  # step. 1 = every 0.4 ms step.
  update_every: 1

  servo:
    enabled: true
    # FIRMWARE TABLE VALUES, i.e. what is written to the servo. Factory default.
    # The open decision in drivetrain-measurements.yaml (P 100/200/400, I 1920
    # or 3840) is a change HERE and nowhere else: the two scales below map any
    # table value onto the loop, which is the point of fitting them per unit.
    velocity_p_gain: 100        # Velocity P Gain(78)
    velocity_i_gain: 1920       # Velocity I Gain(76)
    #
    #   duty = Kp * (v_ref - LPF(w_meas)) + Ki * (integral(v_ref) - theta_meas)
    #   torque_servo = stall_torque * (clip(duty, +-1) - w / no_load_speed)
    #
    # Kp: 3.5-4.5e-4 per P unit across P 100/200/400 on the reversal and chirp
    # captures (the ones that load the P term). ROBOTIS's own conversion,
    # KVP/128 per 0.229 rpm per 885 PWM counts, is 3.68e-4.
    kp_per_unit: {value: 4.0e-4, source: measured}    # duty per rad/s, per P unit
    # Ki: 1.3-1.5e-3 per I unit on the steps (R^2 0.998), matching the hand-push
    # hold spring of 0.047 duty per servo degree (2.69 duty/rad at I 1920).
    # Twice ROBOTIS's conversion at a 1 kHz loop, so a 2 kHz loop is the likely
    # reading -- inferred, not verified.
    ki_per_unit: {value: 1.45e-3, source: measured}   # duty per rad, per I unit
    # Frame computing a command -> the servo's velocity reference moving.
    command_delay_s: {value: 0.004, source: measured}      # latency.velocity_trajectory_delay_ms
    # EFFECTIVE, not a register: the lag inside the loop (encoder differencing
    # plus filtering) that puts the ~20 Hz peak at P 400 and none at P 200. Fit
    # by closed-loop replay of the chirps; see the plan doc for what it misses.
    measurement_delay_s: {value: 0.004, source: measured}
    velocity_filter_s: {value: 0.012, source: measured}
    # Velocity Limit(44) = 460 x 0.229 rpm, read off both servos.
    velocity_limit_rad_s: {value: 11.03, source: datasheet}
    # AT THE SERVO SHAFT. Rotor + gearbox + belt, loaded: 2.3-2.8e-3 from the
    # PWM coast, 1.8-2.3e-3 from the P 400 chirps. The bare-shaft PWM tau_m of
    # 14 ms implies 2.0e-3, so the drivetrain adds little. Becomes
    # input_armature / belt_ratio^2.
    rotor_inertia: {value: 2.2e-3, source: measured}
    # Per servo, at the servo shaft, and the SAME in common and diff mode
    # (0.10-0.14 duty common, 0.10-0.13 diff, from the coast) -- so it sits at
    # the input shafts, not in the hub or the rollers. Servo B's side is ~25 %
    # stiffer in every capture; one value here, the asymmetry is outstanding.
    # ~60x the hub_joint_frictionloss GUESS. Applied per input shaft as a
    # STICKING friction (a stiff spring to an anchor that slides past the
    # limit), not as a joint frictionloss: MuJoCo's soft friction constraint
    # creeps on these joints and gives no static floor, and without one the
    # detent below never stalls a 1 % creep at all.
    coulomb_friction: {value: 0.15, source: measured}   # N.m
    # Sim knobs for that stick, at the input shaft: N.m/rad and N.m.s/rad.
    # 250 holds to ~2e-4 rad and keeps omega*dt ~0.4 on the rotor inertia.
    friction_stick_stiffness: 250.0
    friction_stick_damping: 0.2

  detent:
    enabled: true
    # A friction BUMP on ring-vs-hub, once per tooth. Friction and not a
    # conservative hill, because at the 1 % creep the extra push sits at the same
    # phase whichever way the drive is pushed: 0.09-0.12 duty above its floor in
    # the direction-split fold (drivetrain_fit.py detent). At 3 % the fold shows
    # little of either (a ~0.02 duty ripple). A quasi-static torque ramp would
    # settle the shape.
    period_deg: {value: 7.5, source: tooth-count}   # ring-vs-hub, input shaft
    width_deg: {value: 2.5, source: measured}       # raised cosine, full width
    # Peak extra friction on ring_spin, N.m. ~0.09 duty per servo above the
    # ~0.12 baseline at the wall (breakaway 0.19-0.24 duty); x stall torque /
    # belt, x2 for the two servos a diff move pushes with.
    friction: {value: 0.096, source: measured}
    # Phase is drawn per episode where there is an rng (training, the eval
    # env), else this. Nothing has measured where the wall sits.
    phase_deg: 0.0
    # Elasto-plastic stick, sim knobs: the spring to the sticking point on
    # ring-vs-hub [N.m/rad], and its damping [N.m.s/rad]. 1000 holds a stuck
    # detent to ~1e-4 rad and sits at omega*dt ~0.4 on the input shafts; much
    # stiffer and the explicit step goes unstable.
    stick_stiffness: 1000.0
    stick_damping: 1.0

  roller_slop:
    enabled: true
    # Per roller, roller-angle units, about k_roller * ring angle. The rigid
    # equality coupling is replaced by a tendon with a weak centring spring and
    # hard limits at the ends of the play.
    half_play_deg: {value: 7.8, source: measured}      # 15.6 deg p-p by hand
    # "A roller often springs back to the middle of its play -- not every time"
    # (roller_slop.hand_release). Nothing measures the size. At 1e-3 the spring
    # is 1.4e-4 N.m at the wall, against ~0.05 N.m of ground torque on a loaded
    # roller: a dead zone under load, a centring spring in the air.
    centring_stiffness: {value: 1.0e-3, source: GUESS}  # N.m/rad
    # CRITICAL against the roller's own spin inertia (2.31e-7 kg m2 in the
    # compiled model, plus the joint's 1e-6 damping): 2 sqrt(k J) = 3.0e-5.
    # By hand 2026-09-14, a flicked roller of any size, or one held at the end of
    # its play and let go, returns to centre with no visible overshoot
    # (roller_slop.hand_flick). At the old 2e-6 the sim rang for ~200 ms.
    # tests/test_drivetrain_model.py pins the ratio, so a roller mass change
    # that detunes it goes red.
    damping: {value: 2.9e-5, source: GUESS}             # N.m.s/rad
    # How hard the ends of the play are. 0.001 holds the play to within ~1.5
    # deg under a 20 rad/s dithered diff; MuJoCo's default 0.02 let rollers
    # overshoot by 50 deg. Must stay >= 2 x sim.timestep.
    wall_timeconst_s: 0.001

bike:
  # THE V2 BIKE AS BUILT (2026-10-19): wheelbase, rake and every placement
  # below are read off the v2 CAD (cad.bike_v2, commit 6a73da8), positions
  # from one Onshape eval of its bodies' centroids
  # (traces/bike_v2_cad/mass_eval.txt). CAD bike frame -> this frame:
  # x = CAD y, y = -CAD x, z = CAD z (both origin on the rear axle).
  wheelbase: {value: 0.2005, source: design}   # the CAD's; was 0.200
  # 20, was 15 (2026-10-19): the CAD's since 10-19. analysis/policy/steer_wobble.py
  # (10-18): forward wobble roughly halves by 20 deg, the hold wobble grows.
  rake_deg: {value: 20.0, source: design}      # steering axis tilt back from vertical
  fork_offset: {value: 0.0, source: design}  # perpendicular distance steer axis -> front axle
  chassis:
    # THE RESIDUAL: what no entry below names -- the cables and fasteners.
    # Weighed by item 2026-10-21 (user), times the count on the bike:
    #   5 JST servo cables x 5 g = 25, 2 USB 6" x 8 g = 16,
    #   17 x 6-32 screw + nut at 1.2 g (10 weighed 12 g) = 20.4.
    # NOT in it: 5 x 4-40 and 4 x M2 screw + nut (not weighed, a few g),
    # and the rollcage's 4 and the wings' 4 6-32 (not fitted yet).
    # Was 0.030 GUESS (fasteners, cables); 0.45 GUESS for the whole frame +
    # wiring before the frame existed.
    # The bike as weighed 2026-10-21 -- no blades, battery or rollcage --
    # read 772 g; this model reads 791 for the same bike, with the printed
    # parts still CAD estimates (wing hubs carry their stubs, ~11 g, not
    # fitted).
    mass: {value: 0.061, source: measured}
    # SPREAD over the frame parts in proportion to their mass (screws sit in
    # the printed parts, cables run between the servos and the Pi), so it
    # draws as nothing of its own. false: its own box, below -- which stays
    # either way, massless and invisible when spread, as the older studies'
    # contact envelope.
    spread: true
    box_size: [0.20, 0.04, 0.10]         # inertia primitive (full extents): the rails' span
    com_pos: [0.10, 0.0, 0.08]           # chassis-frame position of that primitive (origin = rear axle)
  # EVERY RIGID PART ON THE CHASSIS. `mass` (or `servo:`, the mass from
  # `servos:`) and its `geoms`, each a MuJoCo box or cylinder carrying
  # `share` of the mass (default: an equal split): `pos` [m], `size` full
  # extents [x, y, z] for a box, [radius, length] for a cylinder (its axis
  # the local z), `quat` (w x y z, optional) its axes in the chassis frame.
  # To fold in a weighing, change `mass` only.
  #
  # The shapes come from one Onshape eval (traces/bike_v2_cad/shape_eval.txt,
  # 2026-10-19): each part's tight box in the bike, drive (45 deg) or
  # steering (20 deg) frame, whichever is smallest, CENTRED ON THE PART'S
  # CENTROID so the mass sits where the CAD's does. A thin part (a rail
  # slice, the Pi carrier, the power holder) keeps its outline and takes the
  # thickness that holds its volume. The side rails are their CAD outline
  # pieces extruded (type: prism, `outline` [x, z] in the side view, `across`
  # [y0, y1], an exact-inertia mesh), mass by area; the pulleys discs; the
  # belts their two straight runs. They shape the inertia (a printed part is
  # a shell, a box solid: together the boxes are ~5 % of the bike's) and
  # show where every gram is. Not a picture of the parts.
  #
  # Printed parts: `mass` is cad.servo_mount.printed_mass (0.9 skin over the
  # surface, 15 % infill, ASA 1.07) from the CAD's volume and area -- GUESS
  # until weighed; the batch of the six printed below plus the Pi spacers
  # reads 88.2 g against the slicer's 81 (traces/weigh_v2_printed.txt).
  #
  # Nothing that moves is here: the input pulleys' turning inertia is in
  # drivetrain.input_armature (fitted), the steering's turning half in
  # fork_mass, the righting's in righting.module.
  frame_parts:
    servo_drive_left:      # XC430 "A", horn on the left
      servo: xc430_w150
      geoms:
        - {type: box, pos: [0.0768, -0.0, 0.0567], size: [0.0465, 0.034, 0.0285], quat: [0.92388, 0.0, -0.38268, 0.0]}
    servo_drive_right:      # XC430 "B", beside A across the drive
      servo: xc430_w150
      geoms:
        - {type: box, pos: [0.0567, 0.0, 0.0768], size: [0.0465, 0.034, 0.0285], quat: [0.92388, 0.0, -0.38268, 0.0]}
    drive_case_left:      # the left side rail: its CAD outline pieces (cad.drive.rail_layout), extruded across the plate (x 16..20.6 mm), mass by area
      mass: {value: 0.0207, source: GUESS}
      geoms:
        - {type: prism, share: 0.3431, across: [0.0160, 0.0206],   # outline
           outline: [[0.08256, 0.04190], [0.08600, 0.03860], [0.15000, 0.03860], [0.15554, 0.05632], [0.16635, 0.06025], [0.18500, 0.06704], [0.18500, 0.07480], [0.19950, 0.07480], [0.19950, 0.08350], [0.17900, 0.08350], [0.16206, 0.07204], [0.15000, 0.07160], [0.10511, 0.06304], [0.10440, 0.06375]]}
        - {type: prism, share: 0.0541, across: [0.0160, 0.0206],   # rear arm
