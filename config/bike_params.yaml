    cables:      # 5 JST servo cables x 5 g + 2 short USB cables x 8 g, weighed 2026-10-21
      # "Distributed but high" (user, 11-03): mostly over the drive, up by the
      # Pi and U2D2 they run to, so a band under the rings' tops, not a point.
      # The placement is an estimate; the mass is weighed. It takes none of the
      # residual (the fasteners) that the other frame parts share.
      mass: {value: 0.041, source: measured}
      residual: false
      geoms:
        - {type: box, pos: [0.100, 0.0, 0.105], size: [0.120, 0.030, 0.020]}
  # The fork and front wheel weighed 86 g together (2026-09-30). The fork is
  # its CAD estimate, the wheel the rest (rounded).
  fork_mass: {value: 0.025, source: estimate}   # steerer + fork, without the wheel
  front_wheel:
    # The wheel from the original bike, measured 2026-10-05.
    radius: {value: 0.05125, source: measured}   # 102.5 mm diameter
    width: {value: 0.024, source: measured}
    shoulder_radius: {value: 0.007, source: measured}
    # The real tread is a 10 mm flat, modelled as a shallow crown so the contact
    # moves smoothly with lean (docs/plans/mujoco-modeling-decisions.md).
    crown_radius: {value: 0.080, source: model}
    mass: {value: 0.060, source: estimate}
    # Dry friction on the wheel's spin [N m] (build_model: front_spin's
    # frictionloss, the same holding it and rolling, load-independent): the
    # fork faces rubbing the hub since the 10-28 axle nut. Wheel in the air,
    # weight on a string at 30 mm: 100 g (0.03) as first tightened, 50 g after
    # loosening 10-31. Tied to wheel_play.front_axle: tightening trades play for
    # drag, and not predictably (user). Standing 90 deg snaps fall on left
    # turns at 0.03 and hold at 0.015, as on the bike (physical-bike-tests.md 11).
    axle_friction_nm: {value: 0.015, source: measured}
  steering:
    gear_ratio: {value: 1.0, source: design}  # servo rotation per steer rotation; range is continuous 360°+
    # Headset friction (the printed bushing and thrust face), on top of the
    # XC330's gearbox friction: a + b x |T|, T the axial load through the thrust
    # face [N] (the `headset_force` sensor in the sim). Applied by
    # gearbox_friction.attach_steer.
    #
    # From the first print's friction maps (steering-design.md, 2026-09-30):
    # running friction over four loads, 86-368 g along a 15 deg axis, less the
    # gearbox's own line. The printed seams' peaks (to 47 mN m, two spots 180 deg
    # apart) are left out on purpose: the seam is fixable in printing. Running
    # friction only; the static was ~1.5x on one unloaded sweep. A reprint moves
    # it.
    headset_friction_nm: {value: 0.00172, source: measured}      # N m, a
    headset_friction_per_n: {value: 0.00475, source: measured}   # N m per N, b
  ahrs:                                       # SYD Dynamics TM151
    # On the drive's tabs, USB up and back (v2 CAD). `pos` is the centre of the
    # housing, where `ahrs_site` sits. `quat` is the TM151's own axes in the
    # chassis frame (+x the pin header, +z out of the top): pitched 45 deg
    # nose-down about y. The site stays on the chassis axes, because on the bike
    # config/ahrs_mount.yaml rotates the readings into that frame; the tilt
    # reaches the sim through where the accelerometer sits in the part
    # (sim_ahrs.tm151_to_site).
    pos: [0.0989, 0.0, 0.0842]
    quat: [0.92388, 0.0, 0.38268, 0.0]
    mass: {value: 0.019, source: datasheet}
    box_size: [0.040, 0.034, 0.0126]          # in its own axes: x along the 40
  payload:
