      # The CAD's box centre [0.12035, 0, 0.11215] moved 10 mm along the board
      # toward its upper end, where its USB / Ethernet block and the heavier
      # part are (user, 11-03): the box's long axis is up and back. The 10 mm
      # is an estimate (a ~15 g port block ~35 mm off centre on a 50 g board).
      pos: [0.11328, 0.0, 0.11922]
      mass: {value: 0.050, source: datasheet}   # approx.; Pi + U2D2 + carrier weighed 71 g together (model 71.6)
      box_size: [0.056, 0.020, 0.089]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
    u2d2:                                     # ROBOTIS U2D2, under the Pi
      pos: [0.11494, 0.0, 0.08807]
      mass: {value: 0.009, source: measured}  # case only (bike_params_cad, 2026-08)
      box_size: [0.018, 0.0149, 0.048]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
    power_board:                              # the PCB with its components + the power switch
      pos: [0.0440, 0.0274, 0.1094]
      # Weighed 2026-10-19. Its printed holder is frame_parts.power_holder.
      mass: {value: 0.016, source: measured}
