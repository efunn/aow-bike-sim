# AOW bike model parameters — single source of truth for the MJCF builder.
#
# Units: meters, kilograms, degrees (suffix _deg), N·m, rpm. Coordinates:
# +X forward, +Y left, +Z up; wheel axles along Y.
#
# Measurable leaves are written as {value: ..., source: ...} where source is one of:
#   measured    — caliper/scale measurement of the physical part
#   tooth-count — exact ratio from counting gear/pulley teeth
#   datasheet   — from ROBOTIS / SYD Dynamics documentation
#   design      — a choice we make for the custom chassis (record intent, verify as-built)
#   GUESS       — placeholder to be replaced; plausible for a 1:6-scale bike
# Plain scalars are simulation/tuning knobs, not physical quantities.

sim:
  timestep: 2.0e-4
  integrator: implicitfast
  cone: elliptic          # elliptic friction cones + Newton solver (MuJoCo default solver)
  impratio: 10.0
  mesh_segments: 32       # tessellation of revolved contact meshes (rollers, tire)
  condim: 4               # 3 = sliding only; 4 adds torsional friction at the contact patch
  # Contact [time constant s, damping ratio]. Was MuJoCo's default [0.02, 1]
  # by omission, which let the rollers sink ~2.2 mm (a fifth of the roller
  # radius) into the floor while holding station. Penetration scales with the
  # square of the time constant, so this is ~16x stiffer. Raise it back toward
  # 0.02 if the solver starts complaining rather than to soften a contact.
  contact_solref: [0.005, 1.0]
  friction_sliding: {value: 0.9, source: GUESS}      # TPU on hard floor -> incline slide test
  friction_torsional: {value: 0.005, source: GUESS}  # scales with contact patch size -> validation
  floor_size: 3.0

omni_wheel:
  outer_radius: {value: 0.0512, source: measured}   # ridge Ø102.35; envelope ripples ~0.3 mm below
  width: {value: 0.033, source: measured}
  n_axles: {value: 8, source: measured}         # 8 axles x 2 truncated cones = 16 rollers
  axle_mount_radius: {value: 0.040, source: measured}  # wheel axis -> roller axle axis
  axle_cant_deg: {value: 0.0, source: measured}    # axles are purely tangential
  roller:
    big_diameter: {value: 0.022, source: measured}   # large end of one truncated cone
    small_diameter: {value: 0.019, source: measured}
    length: {value: 0.0075, source: measured}        # one cone, along its axis
    pair_gap: {value: 0.010, source: measured}       # big end to big end; floats 8.5-10 mm (axial play)
    big_end_inward: true    # confirmed: big ends face each other across the gap
    pair_mass: {value: 0.004372, source: measured}   # 2 cones + roller axle w/ 20t gear
  hub:
    # Carrier lump: frames 25.0 + casing 37.3 + 8 planet axles 8.0
    #             + ring gear 2 (counter-spin inertia neglected) 4.57 + screws 0.76 [g]
    mass: {value: 0.07563, source: measured}
    body_radius: 0.038      # inertia/visual cylinder (non-contact)
    body_width: 0.020
  ring:
    mass: {value: 0.00457, source: measured}      # ring gear 1 only (input-A side gear)
    body_radius: 0.030
    body_width: 0.008

drivetrain:
  # TEARDOWN: the wheel is a bevel DIFFERENTIAL. Two side ("ring") gears mesh all
  # 8 planet axles mounted in the carrier (= hub). Input A/B = ring gear 1/2
  # shafts, belt-driven directly (toy's motor pinions discarded). Hence:
  #   hub (carrier) = (ring1_abs + ring2_abs)/2 ; model "ring" body = ring gear 1.
  # Kinematics (rad per rad, signed):  [hub; ring_abs] = [[mix_hub_a, mix_hub_b],
  #                                                       [mix_ring_a, mix_ring_b]] @ [input_a; input_b]
  mix_hub_a: {value: 0.5, source: tooth-count}
  mix_hub_b: {value: 0.5, source: tooth-count}
  mix_ring_a: {value: 1.0, source: tooth-count}
  mix_ring_b: {value: 0.0, source: tooth-count}
  # Roller axle spin per radian of ring-vs-hub relative rotation:
  # (ring 48 / planet bevel 12) * (planet bevel 12 / roller gear 20) = 2.4.
  # Sign flips if the wheel is mounted flipped — confirm at final assembly.
  k_roller: {value: 2.4, source: tooth-count}
  # Input shaft speed / servo speed (pulley tooth counts; >1 = wheel side faster).
  belt_ratio: {value: 3.0, source: design}
  # Input shafts are the two ring-gear shafts, coaxial with the rear axle, one
  # per side. Lateral offset of the visual pulley from the wheel centerline —
  # placeholder until the mount/pulley design is done.
  input_pulley_offset: {value: 0.025, source: design}
  # Reflected rotor+gearbox inertia seen at each input shaft (XC430 rotor through
  # 159.59:1 internal gearing, then /belt_ratio^2). -> spin-down / step-response tests.
  input_armature: {value: 3.0e-4, source: GUESS}
  hub_joint_damping: {value: 1.0e-4, source: GUESS}        # -> driven-wheel spin-down test
  hub_joint_frictionloss: {value: 1.0e-3, source: GUESS}
  roller_joint_damping: {value: 1.0e-6, source: GUESS}     # -> roller flick spin-down test
  roller_joint_frictionloss: {value: 1.0e-5, source: GUESS}

bike:
  wheelbase: {value: 0.20, source: design}
  rake_deg: {value: 15.0, source: design}      # steering axis tilt back from vertical
  fork_offset: {value: 0.0, source: design}  # perpendicular distance steer axis -> front axle
  chassis:
    mass: {value: 0.45, source: GUESS}   # frame + electronics + wiring, excluding servos/wheels/AHRS
    box_size: [0.16, 0.04, 0.05]         # inertia primitive (full extents)
    com_pos: [0.09, 0.0, 0.10]           # chassis-frame position of that primitive (origin = rear axle)
  fork_mass: {value: 0.025, source: GUESS}   # steerer + fork, excluding front wheel
  front_wheel:
    radius: {value: 0.050, source: design}
    width: {value: 0.028, source: design}
    crown_radius: {value: 0.014, source: design}  # tire cross-section crown
    mass: {value: 0.060, source: GUESS}
  steering:
    gear_ratio: {value: 1.0, source: design}  # servo rotation per steer rotation; range is continuous 360°+
  ahrs:                                       # SYD Dynamics TM151
    pos: [0.05, 0.0, 0.13]
    mass: {value: 0.012, source: GUESS}
    box_size: [0.030, 0.030, 0.012]
  payload:
    # Untethered running gear — see docs/plans/untethered-setup.md. Kept
    # SEPARATE from chassis.mass (which is frame + wiring only) so the two are
    # independently identifiable: the payload is a known, weighable set of
    # parts, while the chassis mass stays a GUESS until the frame is built.
    # Omitted by build_model(payload=False) to recover the tethered bike.
    #
    # ~190 g on an 825 g bike (+23%). Placement is NOT critical for balance:
    # across the plausible mounting envelope the CoM height only moves
    # 0.117-0.131 m and the fall time constant 1/sqrt(g/h) only 0.109-0.116 s.
    # What matters is (a) staying on the centerline — a lateral offset is a
    # standing roll bias the controller must trim out continuously, and (b)
    # staying near the rear axle, since yaw inertia is what the pivot and
    # flick moves fight. Positions below are a plausible layout, not a design.
    battery:                                  # 3S 1300 mAh LiPo, slung under
      pos: [0.09, 0.0, 0.055]                 #   the frame between the wheels
      mass: {value: 0.115, source: GUESS}     # -> weigh the actual pack
      box_size: [0.072, 0.035, 0.026]
    electronics:                              # Pi Zero 2 W + U2D2 + buck + wiring
      pos: [0.09, 0.0, 0.105]
      mass: {value: 0.076, source: GUESS}     # -> weigh the actual stack
      box_size: [0.065, 0.030, 0.025]

servos:
  # NOTE: the values below are the 12 V datasheet column, i.e. the TETHERED
  # bike on its 12 V brick. Untethered on 3S the pack averages 11.1 V and sags
  # to 9.9 V at cutoff, so the real numbers are the 11.1 V column or worse:
  #   XC430-W150   1.4 N.m /  99 rpm   (vs 1.6 / 106 here)
  #   XC330-T181   0.76 N.m / 104 rpm  (vs 0.80 / 113 here)
  # That is ~12% less torque, compounding with the +23% payload mass for a
  # ~30% authority reduction. Do not "fix" it by editing these values — the
  # sim is a 12 V bike by definition; instead let randomization.actuator_frac
  # cover the range during training. See docs/plans/untethered-setup.md.
  xc430_w150:   # 2x, AOW drive (values at 12 V per datasheet)
    stall_torque: {value: 1.6, source: datasheet}
    stall_current: {value: 1.4, source: datasheet}
    no_load_rpm: {value: 106.0, source: datasheet}
    mass: {value: 0.065, source: datasheet}
    box_size: [0.034, 0.0285, 0.0465]   # D x W x H, axis along Y
    pos_left: [0.045, 0.030, 0.075]     # chassis-frame positions of the two drive servos
    pos_right: [0.045, -0.030, 0.075]
  xc330_t181:   # steering (values at 12 V per datasheet)
    stall_torque: {value: 0.80, source: datasheet}
    # Torque constant kt = stall_torque / stall_current is what actually sets
    # the current a given LOAD draws, and kt does not depend on pack voltage --
    # so a torque number from the sim converts to amps directly. See the power
    # budget in docs/plans/untethered-setup.md, and `self_righting.py lift`,
    # which uses it to price the righting stroke against the pack.
    stall_current: {value: 0.88, source: datasheet}
    no_load_rpm: {value: 113.0, source: datasheet}
    mass: {value: 0.023, source: datasheet}
    box_size: [0.026, 0.020, 0.034]
    pos: [0.16, 0.0, 0.11]

actuators:
  drive_kv: 0.5        # velocity-servo gain at the input shafts (placeholder for Dynamixel velocity PI)
  steer_kp: 2.0        # position-servo gains at the steer joint
  steer_kv: 0.05

control:
  # Balance controller settings (tuning knobs, not measurements).
  rate_hz: 200          # controller update rate; zero-order hold between updates
  moves_dir: moves      # optimized maneuver files (moves/<name>.yaml); see optimize_flick.py
  general_move: general_rl   # which always-on policy teleop drives with, as
                        #   moves/<name>.{yaml,npz}. Point it at a second
                        #   export (e.g. general_rl_prev) to A/B two trained
                        #   policies without renaming files; `run_drive
                        #   --general NAME` overrides it for one session.
  pd:                   # PD cascade (rear crawl only, steer held straight)
    roll_kp: 6.0        # lateral contact velocity [m/s] per rad of roll
    roll_kd: 1.2        # ... per rad/s of roll rate
    y_kp: 0.35          # roll setpoint [rad] per meter of lateral drift
    y_kd: 0.12          # ... per m/s of lateral velocity
    max_roll_setpoint_deg: 3.0
    x_kp: 8.0           # common-mode input [rad/s] per meter of fore/aft drift
  lqr:                  # weights for the DLQR on the identified lateral model
    q_ypos: 3.0
    q_yvel: 0.2
    q_roll: 60.0
    q_roll_rate: 6.0
    q_yaw: 8.0          # LIGHT-ish: heading swings are intrinsic to crawl recovery;
    q_yaw_rate: 12.0    #   damp rotation (rate) over position. Heavy q_yaw (>~15)
    q_steer: 0.5        #   rings against the steer clamp; 8/12 also tracks pivots.
    r_drive: 0.05       # balance of authority vs. saturation margin on pushes
    r_steer: 6.0
    steer_limit_deg: 15.0   # keep steering inside the identified linear region
  drive:                # line/circle driving on the gain-scheduled LQR
    v_max: 1.2          # m/s; ~70% of the 1.7 no-load ceiling (torque margin)
    accel: 1.5          # m/s^2 speed-profile limit; harness sweep finds true max
    speed_grid: [0.0, 0.25, 0.5, 0.8, 1.2]   # mirrored to negatives at design
    speed_kp: 4.0       # common-mode speed loop gain [rad/s per m/s]
    steer_ff_gain: 1.0  # kinematic steer feedforward scale (circle mode)
    lean_ff: 0.85       # centripetal lean feedforward; <1 because the crowned
                        #   tire's contact shifts into the turn (ideal formula over-leans)
    ki_lat: 0.05        # slow integral lean-trim on cross-track error [rad/(m s)];
    int_limit_deg: 5.0  #   mops residual radius bias; higher values hunt
    yaw_slew: 1.5       # rad/s heading slew for low-speed (arc-mode) turns
    yaw_accel: 4.0      # rad/s^2 slew ramp (trapezoid, like the pivot profile)
    # At-speed sharp turns (feedforward-carried, circle-mode structure):
    steer_ff_max_deg: 45.0   # feedforward steer ceiling; feedback stays +-steer_limit around it
    turn_rate_margin: 0.7    # fraction of the kinematic ceiling v*tan(ff_max)/L used
    yaw_slew_sharp: 3.0      # rad/s absolute ceiling for at-speed turns
    reverse_turn_scale: 1.0  # extra cap factor for v < 0 (tune down if reverse validates worse)
    # Reverse keep-out band: cruise diverges in [-0.88,-0.78] (slow caster/
    # weave coalescence; no gain choice stabilizes it at our authority), and
    # *turning* is unreliable across (-1.15,-0.72) — only the identified grid
    # speeds outside it turn cleanly. Speed targets inside snap to the edges;
    # transiting during ramps is fine. Location depends on steering stiffness
    # -> recalibrate on hardware; stage-2 turning-equilibrium ID would shrink it.
    reverse_avoid_band: [-1.2, -0.72]
  flip:                 # 180-degree swap-ends about the midline (standstill<->standstill)
    # Realization: pre-steer the front to ~90 deg (frees it to roll laterally so
    # the bike can rotate about the midline, not the front contact), hold while
    # the rear crawls the spin, then unwind. See the decisions doc: exact
    # center-spin is a delta=90 kinematic singularity, so this bulges out to
    # ~1 wheelbase mid-spin and the hub loop reels the center back by the end.
    # Tight-throughout (<=0.5 L) needs trajectory optimization (deferred).
    yaw_accel: 4.0      # rad/s^2 yaw-rate trapezoid ramp
    yaw_rate: 1.0       # rad/s cruise yaw rate (higher = faster, looser)
    pre_steer_time: 0.7 # s to wind the front to hold_deg before spinning
    hold_deg: 90.0      # front angle held during the spin (frees the front)
    steer_rate: 8.0     # rad/s cap on the scripted steer slew
    hub_kp: 12.0        # longitudinal center-error loop [rad/s per m] (re-centers)
  pivot:                # crawl pivot about the front contact
    yaw_rate: 1.5       # rad/s cruise (crawl ceiling ~4 rad/s; balance-limited)
    yaw_accel: 4.0      # rad/s^2 profile ramp
    lean_ff: 1.0        # centripetal lean feedforward gain (0 disables)
    ff_gain: 1.0        # crawl feedforward scale (vs. kinematic)

testbed:
  # Wheel-only system-ID rig: AOW + input shafts on a stand fixed to the world.
  stand_clearance: 0.02   # axle height = outer_radius + this; >0 spins freely in air, 0 touches floor

training_wheels:
  # Optional outriggers for development/tests (not a physical part).
  half_span: 0.10       # lateral distance from chassis centerline
  radius: 0.008
  pos_x: 0.06           # forward of rear axle
  clearance: 0.002      # gap above floor when upright, so they never carry standing load

righting:
  # Self-righting study (build_model(..., righting=True)); see
  # docs/plans/self-righting.md. NOTHING HERE IS BUILT YET -- this block exists
  # so that falls can be simulated and candidate geometry compared. Every
  # dimension is `design` in the "record the intent" sense, not the "we chose
  # this" sense.
  #
  # righting=True does two things regardless of the sub-blocks:
  #   1. makes the chassis lumps (frame box, servos, AHRS, payload) COLLIDABLE,
  #      so a fall comes to rest on the parts that would really touch the floor
  #      instead of sinking through them, and
  #   2. adds whatever of `bumper` / `arm` is present below.
  #
  # TWO ALTERNATIVE MECHANISMS live here, `arm` and `wings`, and they are never
  # built into the same model: build_model(righting=True) gives the single arm,
  # build_model(righting=True, wings=True) swaps it for the wing pair. Keeping
  # them exclusive is not tidiness -- the arm's mass and geometry would pollute
  # every wing torque and rest-attitude reading, and the whole point of the
  # tools in analysis/self_righting.py is that the two sets of numbers are
  # comparable. `bumper` is shared by both.
  #
  # Frame for z: metres above the REAR AXLE, like every other chassis-frame
  # position in this file (the axle sits 51.2 mm off the floor when upright).
  bumper:
    # Side geometry that sets the resting attitude: a short capsule pad per
    # side, sitting just proud of the drive servo it protects.
    #
    # The counter-intuitive result from `self_righting.py profile --sweep` and
    # `rest`: the bare bike ALREADY settles on its side at 90.2 deg roll /
    # 10.3 deg pitch with zero spread over every fall tried, and every wide or
    # tall outrigger made that WORSE, not better. Rails at 60-75 mm half-span
    # and 100-130 mm height give the inverted bike a stable stance and it ends
    # up on its back roughly a quarter of the time (rest spread 65-115 deg).
    # A tall narrow rail is a fulcrum, not a stop.
    #
    # So the pad is deliberately minimal: barely outboard of the drive servo
    # (whose outer face is at y = 44.25 mm) and only as long as the servo, so
    # it takes the load the servo case is currently taking without changing
    # the energy landscape that already works. Measured spread over the same
    # eight falls: 0.0 deg, resting at 99.6 deg roll / 10.2 deg pitch, and
    # independent of the steer angle at the moment of the fall.
    half_span: {value: 0.046, source: design}   # pad axis; servo face is at 0.04425
    height: {value: 0.050, source: design}      # pad axis height above the rear axle
    x_start: {value: 0.026, source: design}     # spans the drive servos (x = 0.045)
    x_end: {value: 0.064, source: design}
    radius: {value: 0.006, source: design}
    mass: {value: 0.010, source: design}        # per side
  arm:
    # The righting arm: ONE extra XC330-T181 swinging a single arm through
    # +-180 deg about a fore/aft axis, so the same arm reaches the floor on
    # either side (that is what makes one servo enough for a symmetric
    # mechanism). Angle convention: 0 = stowed pointing straight up; the hinge
    # axis is body +X, so POSITIVE rotates the arm toward -Y (the bike's
    # right) -- the same handedness as roll, which is why the arm swings with
    # sign(roll) to reach the floor the bike is lying on.
    pivot: {value: [0.09, 0.0, 0.030], source: design}   # chassis-frame hinge
    length: {value: 0.080, source: design}      # pivot -> foot centre
    radius: {value: 0.005, source: design}
    foot_radius: {value: 0.010, source: design}
    mass: {value: 0.020, source: design}        # arm + foot
    servo_mass: {value: 0.023, source: datasheet}   # the extra XC330-T181
    stow_deg: {value: 0.0, source: design}
    # Reduction between servo and arm. `self_righting.py lift --sweep` says the
    # stroke needs 0.65-0.75 N.m AT THE ARM for every geometry that gets all
    # the way up, against an XC330-T181 that is 0.80 N.m at 12 V, 0.76 at the
    # 3S nominal 11.1 V and ~0.66 at the 9.9 V cutoff. Direct drive is
    # therefore a coin flip on a half-empty pack. Nothing about the stroke
    # wants speed -- two seconds is fine -- so the fix is a reduction, and 3:1
    # is the same ratio the drive belts already use. Set to 1.0 to price
    # direct drive.
    gear_ratio: {value: 3.0, source: design}
    # Position-servo gains for the arm (tuning knobs, not measurements). Much
    # stiffer than the steer actuator's 2.0 on purpose: the whole point of the
    # torque study is to see the actuator hit its 0.80 N.m forcerange, and a
    # soft gain would report "not enough gain" as "not enough torque".
    servo_kp: 30.0
    servo_kv: 1.0
  wings:
    # The ALTERNATIVE to `arm`: a mirrored pair of wings, one per side, driven
    # by ONE servo through a gear train (meshed gears at the two pivots with a
    # reversal on one side, so the pair counter-rotates and deploys
    # symmetrically). Both wings swing down-and-outward together; whichever one
    # is on the fallen side plants and levers the bike up.
    #
    # The gear train is NOT modelled. All it contributes to the dynamics is
    # (a) the inversion, as a joint equality theta_left = mirror * theta_right,
    # and (b) the reduction, as gear_ratio. See docs/plans/self-righting.md.
    #
    # Angle convention, same as `arm`: hinge axis is body +X, so POSITIVE
    # rotates toward -Y (the bike's right). The right wing deploys at +d and
    # the left at -d, i.e. both swing outboard and down. 0 = stowed, folded up
    # alongside the chassis.
    #
    # Three things this buys over the single arm, and one risk:
    #   + the stroke is ONE fixed direction, so the mechanism never has to know
    #     which side it fell on (the arm swings with sign(roll));
    #   + it folds flat inside the chassis instead of standing through it;
    #   + the far wing may catch the overshoot the arm has to be stopped to
    #     avoid (see the arm's "must stop at hand-off" note above);
    #   - ...or it may plant EARLY and wedge the bike short of upright, outside
    #     the +-12 deg hand-off window. That is what `lift --wings --sweep` and
    #     `sequence --wings` exist to answer.
    pivot: {value: [0.075, 0.035, 0.0], source: design}  # [x, |y|, z]; mirrored in y
    # pivot HEIGHT is the parameter this design turns on, and -0.020 (20 mm
    # below the rear axle = 31 mm off the floor) is what `lift --wings --sweep`
    # settles on. Three things fight over it, and the third is the one that
    # actually decides:
    #
    #   packaging  A low pivot ought to stow lower. It does NOT, because a low
    #     pivot also needs a LONGER leg to reach the floor, and the extra length
    #     eats the gain exactly: z = -30/105 mm and z = -20/95 mm both stow at
    #     153 mm. Below that the wing has to grow faster than the pivot drops
    #     and the stowed height starts climbing again.
    #   torque  Also flat across the working band (0.57 N.m at both), because
    #     the same trade runs backwards: a lower pivot shortens the moment arm
    #     it pushes on, and the longer leg needed to fix that costs it back.
    #   riding-lean clearance  THE BINDING CONSTRAINT. The stowed wing is the
    #     lowest outboard thing on the bike after the wheels, so it decides the
    #     roll angle at which something other than a tyre touches down. At
    #     z = -30 that is 27 deg -- INSIDE the recoverable set (up to 30.9 deg,
    #     analysis/no_return.py), so a lean the policy could still save would
    #     drag a wing on the floor. z = -20 puts it at 40 deg, clear of both the
    #     recoverable set and any riding lean.
    #
    # So the floor on pivot height is set by lean clearance, not by torque or
    # packaging -- `profile --wings` reports it as `first non-wheel contact`.
    #
    # x = 0.045 is the drive-servo station (same as the bumper pads);
    # |y| = 0.035 is INBOARD of the servo outer face at 44.25 mm, so the stowed
    # pair is narrower than the side geometry that is already known to give a
    # 0.0 deg rest spread.
    #
    # Each wing is a dogleg, as sketched: a short crank off the pivot, then the
    # long leg to the foot. Rigid -- one body, no second joint. The crank is
    # what lets the leg fold flat ALONGSIDE the chassis at stow while still
    # clearing the gear.
    #
    # crank_deg is measured from +Z and cranks OUTBOARD. It is NOT a free knob
    # to trade against torque, for two reasons, and ~90 deg is close to forced:
    #
    #   1. The crank exists to carry the leg past the RIM OF ITS OWN GEAR. The
    #      leg has to land on the floor, not on the disc it is bolted to, so
    #      the outboard reach (crank_length * sin(crank_deg)) must exceed
    #      disc_radius. Cranking inboard shortens that reach by sin and the
    #      mechanism starts standing on its gear. build_model.wing_fit()
    #      reports it as `leg_stands_on_gear`; the physics will NOT catch it,
    #      because the discs are drawn non-colliding.
    #   2. The drive servos occupy |y| = 15.75..44.25 mm, so an INBOARD crank
    #      parks the stowed leg straight through them -- also invisible to the
    #      simulation, since the wings collide only with the floor.
    #
    # The angle is somewhat notional anyway: the real part will integrate the
    # crank into the gear itself, so what this parameter actually encodes is
    # WHERE THE LEG LANDS relative to the pivot, not a physical bend.
    #
    # Note the coupling this creates: disc_radius grows with gear_ratio, so a
    # bigger reduction demands a longer crank, which widens the stance, which
    # is what part 2's rest sweep punishes. Reduction and landing behaviour are
    # not independent.
    crank_length: {value: 0.025, source: design}   # pivot -> elbow
    crank_deg: {value: 90.0, source: design}       # from +Z, positive = OUTBOARD
    # Leg length is what buys BOTH reach and a graceful landing. Too short and
    # the stroke stalls around 90 deg of roll -- and it is REACH that fails,
    # not torque (those rows peak at ~0.35 N.m, half the budget), so adding
    # servo would not have fixed it. Too short ALSO lands badly: at 95 mm with
    # this 90 deg crank the bike ended on its back in 2 of 8 falls, because the
    # stowed wing became a fulcrum. 105 mm fixes both (spread 0.6 deg).
    #
    # The real wing will be wider and curved so it rolls onto its side
    # gracefully; this straight capsule is the rough-physics stand-in.
    length: {value: 0.105, source: design}         # elbow -> foot
    radius: {value: 0.005, source: design}
    foot_radius: {value: 0.010, source: design}
    mass: {value: 0.020, source: design}           # PER WING
    servo_mass: {value: 0.023, source: datasheet}  # the extra XC330-T181
    gearbox_mass: {value: 0.015, source: design}   # the gear train itself
    stow_deg: {value: 0.0, source: design}
    deploy_deg: {value: 105.0, source: design}     # hard stop; joint range is +-this
    # Reduction between servo and wing. 3:1 is the arm's number and the drive
    # belts'. NOTE the consequence the sketch already anticipated: a stow ->
    # deploy stroke of 135 deg at 3:1 is 405 deg AT THE SERVO, so this needs
    # EXTENDED POSITION (multi-turn) mode, not the 0-360 single-turn mode. The
    # analysis reports servo turns explicitly rather than assuming it.
    #
    # The ratio is ALSO a fit constraint, and that is the surprising part --
    # see build_model.wing_fit(). One central pinion meshing both wing gears
    # fixes the centre distance at the pivot half-span, so
    #     r_pinion = half_span / (1 + ratio),  r_disc = half_span - r_pinion
    # and both radii follow from the ratio alone. It runs the wrong way from
    # intuition: a BIGGER reduction shrinks the PINION rather than growing the
    # disc without limit, and the pinion is the 3D-printed part with a floor on
    # how small its teeth can be. `min_pinion_radius` is that floor, and the
    # disc separately cannot exceed the pivot's height above the floor without
    # grounding out. `lift --wings --sweep` reports both ceilings.
    gear_ratio: {value: 3.0, source: design}
    min_pinion_radius: {value: 0.006, source: GUESS}  # smallest printable pitch
                                                      #   radius on the XC330
                                                      #   side -> print a test
    gear_width: {value: 0.006, source: design}        # face width; visual only
    mirror: {value: -1.0, source: design}          # theta_left = mirror * theta_right
    # Position-servo gains, same reasoning as the arm's: stiff on purpose, so
    # the torque study reads a forcerange limit and not a gain limit.
    servo_kp: 30.0
    servo_kv: 1.0

hockey:
  # Ball-shot move extras (build_model(..., hockey=True)); see
  # docs/plans/ball-shot-move.md. Physical dims are GUESS placeholders to refine.
  stick:                # thin translucent ABS panel, one per side of the chassis
    length: 0.11        # x-extent (chassis frame): ~center-x back over the rear wheel
    thickness: 0.004    # ABS panel
    height: 0.03
    pos: [0.04, 0.045, 0.00]   # per-side; y is mirrored L/R, z gives ground clearance
    mass: 0.02
  ball:                 # road (street) hockey ball
    radius: {value: 0.0335, source: GUESS}   # street-hockey ball ~Ø67 mm
    mass:   {value: 0.06,   source: GUESS}    # ~60 g no-bounce ball
    start:  [0.50, -0.15]     # bike-frame start [x fwd, y]; front-right (y<0), mirrorable
    friction_sliding: 0.4     # ball on floor
