servos:
  # NOTE: the values below are the 12 V datasheet column, i.e. the TETHERED
  # bike on its 12 V brick. Untethered on 3S the pack averages 11.1 V and sags
  # to 9.9 V at cutoff, so the real numbers are the 11.1 V column or worse:
  #   XC430-W150   1.4 N.m /  99 rpm   (vs 1.6 / 106 here)
  #   XC330-T181   0.76 N.m / 104 rpm  (vs 0.80 / 113 here)
  # That is ~12% less torque, compounding with the +23% payload mass for a
  # ~30% authority reduction. Do not "fix" it by editing these values — the
  # sim is a 12 V bike by definition; instead let randomization.actuator_frac
  # cover the range during training. See docs/plans/untethered-setup.md.
  xc430_w150:   # 2x, AOW drive (values at 12 V per datasheet)
    stall_torque: {value: 1.6, source: datasheet}
    stall_current: {value: 1.4, source: datasheet}
    no_load_rpm: {value: 106.0, source: datasheet}
    mass: {value: 0.065, source: datasheet}
    box_size: [0.034, 0.0285, 0.0465]   # D x W x H, axis along Y
    # placements: bike.frame_parts.servo_drive_left / _right
  xc330_t181:   # steering (values at 12 V per datasheet)
    # KEPT AT THE DATASHEET, but the bench says it may be as low as ~0.6.
    # X330 fixture, id 103, mode 3 at the steer's own gains (2026-09-26,
    # docs/plans/pre-assembly-bench-checklist.md): every estimate of the stall
    # torque per unit duty came out 0.62-0.69 N m -- friction-cancelling
    # lift/lower pairs gave 0.69 (34 g) and 0.62 (137 g), a joint fit 0.62,
    # the static lines 0.66 --
    # while the torque-speed SHAPE (stall / kv ~ 12 rad/s under load), the
    # no-load speed and the firmware's P scaling (2.849e-3, config 2.877e-3)
    # all check out. The lever rig cannot separate friction from torque any
    # better; measure it in place once the steering is on a bike test rig.
    stall_torque: {value: 0.80, source: datasheet}
    # Torque constant kt = stall_torque / stall_current is what actually sets
    # the current a given LOAD draws, and kt does not depend on pack voltage --
    # so a torque number from the sim converts to amps directly. See the power
    # budget in docs/plans/untethered-setup.md, and `self_righting.py lift`,
    # which uses it to price the righting stroke against the pack.
    stall_current: {value: 0.88, source: datasheet}
    no_load_rpm: {value: 113.0, source: datasheet}
    # CURRENT-BASED POSITION MODE (5), the righting servo's: motor torque
    # k (|I| - I0) above a firmware drive edge, as the X330 fixture measured it
    # (docs/plans/righting-servo-model.md). I0 from the PWM-edge sweep; k from
    # the lift and fall lines over four loads, 8-59 mN m, 35-129 mA, IF
    # friction is equal both ways. One 102 mN m point lifted 17 mA below the
    # line, so k is if anything low above ~130 mA; nothing is measured past
    # ~200 mA. (The datasheet's kt, stall_torque / stall_current, is 0.91.)
    current_deadband: {value: 0.0165, source: measured}      # A
    current_torque_gain: {value: 0.83, source: measured}     # N m / A
    # GEARBOX FRICTION, both XC330s (righting crank and steer), as
    # `fraction x load + constant`, load = the torque the gearbox passes on.
    # Static from mode 5's four loads (mode 3 gave 0.53 and 7.0 mN m); running
    # from mode 3's four speed lines. gearbox_friction.py applies it.
    friction_static_fraction: {value: 0.51, source: measured}
    friction_static_nm: {value: 0.0051, source: measured}
    friction_running_fraction: {value: 0.15, source: measured}
    friction_running_nm: {value: 0.0057, source: measured}
    # Below this output speed the static pair applies. A modelling threshold,
    # not a measurement: loaded slides ran 30-40 deg/s once going.
    friction_stick_speed: {value: 0.05, source: design}      # rad/s
    mass: {value: 0.023, source: datasheet}
    box_size: [0.026, 0.020, 0.034]
    # placement: bike.frame_parts.servo_steer (the righting's: righting.module.servo_case)

actuators:
  # Drive velocity servo, both gains AT THE INPUT SHAFTS (i.e. after
  # belt_ratio, so divide a servo-output measurement by belt_ratio^2):
  #
  #   force = drive_ki * integral(ctrl - w) dt  -  drive_kv * w
  #
  # drive_kv on its own is a bare-motor droop line, and the derived value is
  # stall_torque / no_load_speed / belt_ratio^2 = 1.6 / 11.098 / 9 = 0.016016.
  # At that value the affine actuator reproduces the whole torque-speed line
  # by itself (max force at max command = 0.5333 = stall_torque / belt_ratio
  # exactly), and the bandwidth comes with it for free: input_armature / kv =
  # 18.7 ms, which IS the motor's own electromechanical time constant. The
  # "31x too stiff" and "31x too fast" defects in
  # docs/plans/aow-contact-approximations.md section 6b are one number, not two --
  # a separate drive_tau knob would double-count and is deliberately absent.
  #
  # drive_ki is the firmware's integral term, and it is what holds position
  # against back-drive; drive_kv alone is open-loop voltage control and the
  # bike cannot hold station on it.
  #
  # BOTH ARE STILL THE PLACEHOLDER PLANT. 0.5 / 0.0 is P-only and 31x
  # over-capable, and every general_rl* policy has learned to use capability
  # the hardware does not have. Do not promote the derived numbers by guess:
  # docs/measurements/servo-protocol.md section 4 measures the real stiffness
  # and the real integral time, and section 6 maps them onto the model form.
  # Best guesses if you want to explore first: kv 0.016016, ki 0.6 (Dynamixel
  # X-series default KVI/KVP at a 1 kHz loop) to 0.855 (Ti = tau_m).
  # ARMED 2026-08-21. kv is the derived bare-motor droop, not a measurement --
  # and it is a LOWER bound, because firmware KVP makes the real loop stiffer.
  # ki 0.6 is the Dynamixel X-series default KVI/KVP ratio at an assumed 1 kHz
  # firmware loop; the assumed loop period is the shakiest link in it, and
  # servo-protocol.md §4's settling_time_s measures Ti (= kv/ki) directly.
  # Both are `GUESS` in spirit; replace them with §4, do not refine by feel.
  drive_kv: 0.016016   # was 0.5 (placeholder). = stall_torque/no_load/belt^2
  drive_ki: 0.6        # was 0.0 (P-only). Ti = kv/ki = 26.7 ms
  # Steering position servo, at the steer joint (steering.gear_ratio is 1.0,
  # so the joint IS the servo shaft). The XC330 runs here in EXTENDED POSITION
  # mode (4), whose PID output is PWM duty -- which makes the whole actuator an
  # exact affine map onto MuJoCo's position actuator:
  #
  #   tau = duty*tau_stall - (tau_stall/w_noload)*w
  #       = [Kp * k3 * tau_stall] * err  -  [tau_stall/w_noload] * w
  #
  # so kp is a firmware gain and kv is the motor's own back-EMF droop. Unlike
  # the righting servo's kv, NOTHING here is inferred.
  #
  # kv 0.0676, was 0.05 (2026-09-16). 0.05 was a GUESS in spirit and the
  # derived value is stall_torque/no_load_speed = 0.80/11.833. This is the
  # same droop line drive_kv carries for the XC430s, and for the same reason.
  #
  # kp was LEFT AT 2.0 until the servo was characterised on the bench: the
  # derived value at the factory Position P Gain of 900 is
  # 900 * 2.877e-3 * 0.80 = 2.07. Characterised 2026-10-17, below.
  # kp 2.3 AND steer_armature 5.5e-4, MEASURED 2026-10-17 as a pair: an
  # open-loop sine sweep of the steer XC330 at P 900, steering column and
  # headset installed (no fork or wheel, hanging), +-5 deg at 1-10 Hz
  # (analysis/servo/steer_response.py, traces/bench/steer_response_261017-175708.json),
  # fitted in the sim by the same protocol (analysis/policy/steer_pinned.py --sine
  # --bare --steer-kp K --armature J): within ~0.03 gain / 3 deg of the bench
  # at every frequency, where kp 2.0 with no armature gave 0.66 / -63 deg at
  # 5 Hz (bench 0.81 / -69). The bench holds its gain longer and loses phase
  # faster than the old model: a stiffer loop plus rotor inertia, which the
  # steer never carried.
  #
  # kv IS HELD at the droop, NOT fitted. A first fit moved kv instead (0.055,
  # kp 2.0, same quality) and failed test_steer_cannot_outrun_its_motor: a
  # saturated steer then runs at stall/kv = 14.5 rad/s, against the 11.9
  # measured by free spin. Small-signal sweeps fix only kp/kv (~36) and the
  # inertia; the no-load speed fixes kv. kp 2.3 is 11 % above the derived
  # 900 * 2.877e-3 * 0.80 = 2.07 -- inside the stall-torque and P-divisor
  # uncertainty, unexplained.
  #
  # CONFIRMED on a second unit, bare (the righting XC330, id 104, off its
  # module, swept in mode 4; traces/bench/steer_response_261017-190803.json):
  # at +-5 deg within 0.02 of the steer-with-column run at every frequency, so
  # the column adds nothing measurable and units agree. Same fit, kp 2.3 /
  # 5.5e-4 (err 0.032; kp 2.0 best 0.102).
  # CONFIRMED by constant-speed ramps on the same bare unit
  # (traces/bench/steer_ramps_261017-192117.json): above 0.45 rad/s the steady
  # lag is 2.50 mrad + 37.4 ms x w -- ~8 ms of read/write transport plus this
  # kv/kp (29.4 ms), and kp x 2.50 mrad = 5.75 mN m, the running friction.
  # BELOW ~0.25 rad/s THE SERVO IS NOT MODELLED, deliberately: there it holds
  # its error within ~1 encoder count (1.53 mrad) with no droop and no
  # friction offset, which by this arithmetic it should not be able to do,
  # and +-1 deg sweeps show the same (0.99 / -4 deg at 1 Hz, model -26). It is
  # a one-count effect on a bare servo; on the bike the wheel's scrub and the
  # horn-to-wheel backlash will set small motions instead. A speed-scaled
  # droop + friction reproduces it (steer_pinned.TwoRegime, a prototype);
  # measure small motions on the assembled, loaded steering before using it.
  steer_kp: {value: 2.3, source: measured}
  steer_kv: 0.0676
  # The XC330's rotor + gearbox inertia at the steer joint [kg m2]: ~13x the
  # whole fork + wheel about the axis (4.1e-5 in the model). Was 0 (absent).
  steer_armature: {value: 5.5e-4, source: measured}
  # WHERE THE TORQUE LIMIT SITS, which the affine map above does not say. The
  # firmware clips the DUTY, then the motor subtracts its back-EMF:
  #   duty: tau = clip(kp*err, +-stall) - kv*w      (mode 4, the real servo)
  #   total: tau = clip(kp*err - kv*w, +-stall)      (MuJoCo's native clip)
  # They agree until the P term saturates. Past it, `total` lets the steer
  # outrun the motor: at the 45 deg lead bound it held 23.2 rad/s against an
  # 11.8 no-load, which is the unwind regime of control/steer.py's rock test.
  # `duty` builds it as a kp-only position actuator plus kv as joint damping,
  # native MuJoCo, no per-step hook. `total` is kept so a pre-2026-09-21
  # policy's training plant can still be built. Moves plant_digest, on purpose.
  steer_clip: duty
  # Frame that computes a steer goal -> the servo's own reference moving:
  # 4.0 ms on both XC330s in mode 4 (servo-measurements.yaml,
  # `xc330_command_delay`), the XC430's method, bus and landing included.
  # FRAME-QUANTISED -- the true value lies in (2, 4] ms -- and the same figure
  # the XC430 overlay carries. Built as MuJoCo's native actuator delay, so no
  # per-step hook; mj_resetData clears the history.
  steer_command_delay_s: {value: 0.004, source: measured}

control:
  # What the bike's controllers read that is not a measurement. The analytic
  # controllers' settings (PD, LQR, its drive, flip, pivot) are
  # config/studies/analytic_control.yaml; the onboard ones config/onboard.yaml.
  # Both are merged in by params.load_params().
  rate_hz: 200          # controller update rate; zero-order hold between updates
  moves_dir: moves      # optimized maneuver files (moves/<name>.yaml); see optimize_flick.py
  # general_rl_smooth_diff_pi since 2026-08-25. general_rl DOES NOT REVERSE,
  # which is why this pointer was flagged as needing a change for four status
  # snapshots. It was never the one-line fix it was called: params_digest used
  # to hash the whole file, so editing a policy NAME invalidated the deploy
  # bundle and every trained export. After the plant/design split it moves
  # neither digest, and this is finally free to change.
  #
  # 11M steps against the 4e-4 timestep and the velocity-PI servo. Better on
  # track (0.832 vs 0.763) and vel_err (0.123 vs 0.291), and speed_ratio_rev
  # 0.992 -- it actually reverses. WORSE on heading error, 26.9 deg against
  # 2.5, on an eval grid that also changed. Not a free upgrade; if heading
  # accuracy matters more than reverse for some job, general_rl is still there.
  #
  # Same obs/act contract as general_rl: obs_pitch/obs_wings/act_wings all off,
  # 50 Hz, `full` action space, v_max 1.2. A drop-in.
  #
  # 2026-08-28: REPOINTED to general_rl_odo_ahrs. The pointer now tracks the
  # BIKE rather than the simulator, which is the decision that had been open
  # for five snapshots. general_rl_smooth_diff_pi is trained on MuJoCo truth
  # and does not survive the sensors the bike will actually have -- 0.20 of the
  # eval grid with a TM151 attitude, 0.15 with the onboard velocity estimate,
  # against 1.00 on truth. general_rl_odo_ahrs trained against both and holds
  # 1.00 (0.95 at the measured tau).
  #
  # smooth_diff_pi is NOT retired: it is the CEILING REFERENCE, 0.808 / 1.00 on
  # truth, which is what "how much is on the table if the sensing were perfect"
  # costs to know. Keep the number, retire the pointer. `--general
  # general_rl_smooth_diff_pi` still gets it for one session.
  #
  # It moves NEITHER digest (measured) and moves nothing in the test suite
  # (measured, 23/210 both ways).
  #
  # 2026-09-14: REPOINTED to general_rl_cmd_curriculum2b, the command-family
  # curriculum line. It was chosen on 2026-09-11 and never landed: the session
  # making the edit stopped on a digest scare, and only teleop's `--general`
  # default moved, to seed 0 (curriculum2) instead. Sensor-trained like
  # odo_ahrs (odometry counts + TM151 at tau 0.19), plus obs_pitch.
  # docs/plans/seed-sweep-and-personalities.md: personality1, bit-identical to
  # it, is the best of 12 seeds on every behaviour axis -- drives forward and
  # reverse, finishes every heading command, holds station -- while `_score`
  # ranks it 8th, because the score cannot see direction.
  #
  # Moves NEITHER digest that anything checks, measured: plant_digest stays
  # e1ec36bfa670217e, design_digest 2db6c647ff3a2d59. Only the legacy
  # whole-file params_digest moves (e1c0d88 -> 76e36770), and deploy/bundle.npz
  # is judged on the two above -- hw.state.load_bundle accepts it unchanged.
  #
  # 2026-10-16: REPOINTED to general_puffer_fixes_72M, the GPU-trained MinGRU
  # policy, and the first default trained on today's plant (plant_digest
  # bc66ca20; general_rl_smooth_temporal was 9953690d). Sensor-trained
  # (tm151_filter, odometry counts) on the detailed drivetrain. Retired moves
  # live in moves/archive/ and still load by bare name.
  general_move: general_puffer_fixes_72M    # which always-on policy teleop drives with, as
                        #   moves/<name>.{yaml,npz}. Point it at a second
                        #   export (e.g. general_rl_prev) to A/B two trained
                        #   policies without renaming files; `run_drive
                        #   --general NAME` overrides it for one session.
  drive:
    # The speed cap teleop and the bike's command path clamp to (the
    # analytic controllers' other drive settings: config/studies/).
    v_max: 1.2          # m/s; ~70% of the 1.7 no-load ceiling (torque margin)

righting:
  # THE BIKE'S RIGHTING: `module`, the V2 diamond four-bar with its blades,
  # and `rollcage`, its roof. The older study mechanisms (roof, bumpers,
  # arm, wing pairs) are config/studies/righting_mechanisms.yaml.
  rollcage:
    # THE V2 BIKE'S ROOF (2026-10-19), built in place of `roof` whenever the
    # righting module is (the default bike); `roof` (config/studies/) stays
    # for the older studies, whose wings it is derived around. Same contact geom
    # (`roof`), same job.
    #
    # It models two rollcage rings (cad.bike_v2.rollcage: 270 deg, outer
    # radius 68.7 = the blades' widest at rest, axis 100 mm above the rear
    # axle, at the two ends), their elliptical half-dome caps (50 deep, tips
    # at x -50 and +250.5) and the flexible sheet between them, as ONE
    # CAPSULE: the rings' radius, its hemispherical tips put on the caps'.
    # Where that is off: 2.6 mm inside the rings at their own stations (a
    # hemisphere is fuller than the 50-deep caps everywhere else), and closed
    # across the rings' 90 deg opening at the bottom -- which faces the floor
    # only while the wheels carry the bike.
    radius: {value: 0.0687, source: design}
    height: {value: 0.100, source: design}       # its axis, above the rear axle
    x_start: {value: 0.0187, source: design}     # -0.050 + radius
    x_end: {value: 0.1818, source: design}       # 0.2505 - radius
    # A SHELL's inertia (MuJoCo's shell inertia), not a solid's: the mass is
    # all out at the radius, which the roll inertia feels.
    mass:
      cages: {value: 0.0685, source: GUESS}   # 2 x 34.3, CAD printed estimate
      caps: {value: 0.1085, source: GUESS}    # 2 x 54.2, CAD printed estimate
      # The caps will be lighter (user, 2026-10-21): their design is not
      # done. Left at the CAD's until it is.
      # Not in the CAD. 0.5 mm polycarbonate over 270 deg of the groove's
      # 66.2 radius, ~185 long: 35 g. Material and thickness both assumed.
      sheet: {value: 0.035, source: GUESS}
  module:
    # V2, THE RIGHTING MODULE THE BIKE IS BUILT WITH: the diamond four-bar as
    # aow_sim.cad.righting draws it (one crankpin, one wing rod), the blades of
    # `blade_file` -- V3 since 2026-10-14 (user: "v3 wing should also be the
    # default now for teleop and training"; the CAD already drew it), V2's
    # config/linkage/righting_blade.yaml before -- the XC330 in current-based
    # position mode. build_model builds it
    # unless asked for another mechanism (or swing_linkage=False, the wingless
    # bike every export before 2026-10-09 trained on).
    #
    # The geometry is NOT copied here. `linkage_cad` names the CAD's own config,
    # whose `linkage.config` at `linkage.scale` is the four-bar, and
    # params.resolve_righting_module inlines it and the blade outline into the
    # loaded params -- so plant_digest moves when either file does, and the sim
    # and the CAD cannot drift apart.
    linkage_cad: {value: config/cad/righting_cad.yaml, source: design}
    blade_file: {value: config/linkage/blade_v3.yaml, source: design}   # V3; V2 is config/linkage/righting_blade.yaml
    # The couplers' mid-plane on the wing rod, ahead of the rear axle: the
    # CAD's (the sim's wheelbase is the CAD's 200.5 since 2026-10-19).
    # Module-frame fore/aft positions below are relative to it.
    station_x: {value: 0.1205, source: design}
    # MASSES, all GUESS: printed parts at 1.07 g/cm3, 2 perimeters / 15 %
    # infill (cad.servo_mount.printed_mass), steel at 7.85, from the CAD
    # check's per-part volumes (traces/righting_check.txt, 2026-10-07);
    # UNCALIBRATED, nothing printed. `at`: the group's centroid in the module
    # frame, mm -- [out (+ = the right wing's side), up from the wing rod,
    # fore] -- from the CAD sections, ignoring holes. Weigh the parts.
    crank:     # both half cranks, horn hub, steel crankpin, washer
      mass: {value: 0.0112, source: GUESS}
    coupler:   # each
      mass: {value: 0.0023, source: GUESS}
    wing_hub:  # each: rocker + knuckle + printed stub + steel rocker pin
      mass: {value: 0.0149, source: GUESS}
      at: [31.0, 17.1, -3.3]
    blade:     # each, from its outline x span (660 mm2 x 82 mm), 2 perim / 15 %
      mass: {value: 0.0286, source: GUESS}
    # FIXED to the chassis, so not a moving mass: since 2026-10-19 one entry
    # per part from the v2 evals (traces/bike_v2_cad/), `at` in the module
    # frame like the groups above (mm), `size` full extents in the chassis
    # frame [fore, across, up] (a cylinder: [radius, length]); the XC330 is
    # `servo_case`. Was one 64.1 g box 19 mm behind the rod, the servo in it
    # -- the servo sits 44 mm behind it.
    fixed:     # printed parts at their CAD centroids; the steel wing rod a cylinder along the bike
      bulkhead: {mass: {value: 0.0054, source: GUESS}, at: [0.0, 22.6, 18.5], size: [0.01, 0.0247, 0.0588]}
      bridge: {mass: {value: 0.0066, source: GUESS}, at: [0.0, 53.6, 0.0], size: [0.047, 0.0344, 0.01]}
      lower_case: {mass: {value: 0.0116, source: GUESS}, at: [0.0, 20.0, -24.7], size: [0.0307, 0.0247, 0.0588]}
      upper_case: {mass: {value: 0.0078, source: GUESS}, at: [0.0, 19.0, -51.2], size: [0.0223, 0.0281, 0.051]}
      wing_rod: {mass: {value: 0.0104, source: GUESS}, at: [0.0, 0.0, 0.0], size: [0.003, 0.047], type: cylinder}
    # The crank's XC330 case, mass from servos.xc330_t181 (datasheet).
    # Module frame like `at` above (mm); `size` chassis-frame, shaft fore.
    servo_case:
      at: [0.0, 17.6, -44.2]
      size: [0.023, 0.020, 0.034]
    # The crank servo: the four-bar's own `limits.torque_nm` caps it, as for
    # every swing-linkage config (build_model._add_swing_linkage).
    servo: xc330_t181
    # Its position gains AT THE CRANK (N = 1: the servo drives the crank
    # directly), the XC330's own firmware gains as the study arm's
    # derivation gives them (k = 0.83; config/studies/righting_mechanisms.yaml,
    # righting.arm). They and onboard.yaml's `righting` registers must move
    # together, or the bike and the sim run different servos.
    servo_kp: 1.48
    servo_kv: 0.0473
    # The XC330's rotor + gearbox inertia seen at the crank. Nothing in the
    # model carried one, and V2's crank alone is 2.5e-6 kg m2 (the wings reach
    # it only through the loop's soft constraints), so the bare position
    # actuator rang at 1200-1300 deg/s holding any angle but stow. >= 1e-5
    # stops that; the value is the ORDER of the XC430's measured 2.2e-3 at its
    # shaft (drivetrain_model.servo.rotor_inertia), for the smaller motor.
    # Effect on the firmware model's full-rate stroke (0 -> 110 deg, bike held):
    # 1e-4 0.183 s, 1e-3 0.194 s, 2e-3 0.210 s. Dies at: a crank coast-down,
    # as drivetrain_fit.py coast did the XC430.
    # MEASURED 2026-10-17 (was 1e-3, GUESS): the bare righting XC330's own
    # sine sweep in mode 4, fitted as actuators.steer_armature (same servo
    # model, same value -- see the note there). The crank is on the horn, so
    # the rotor inertia IS the crank's.
    crank_armature: {value: 5.5e-4, source: measured}
    # THE LINKAGE'S OWN FRICTION, referred to the crank, ON TOP OF the XC330's
    # gearbox friction (servos.xc330_t181, which the crank already carries):
    #     f(theta) = linkage_friction_nm + linkage_friction_q2 * theta^2  [N m]
    # theta = crank travel from stow [rad]. RIGHTING ONLY -- the steer is a
    # different joint with its own headset term and does not see this.
    #
    # Measured 2026-10-17, V2 as built: stubs only, no blades, unloaded,
    # clamped so nothing touches, horn screwed (analysis/mechanism/righting_sweep.py,
    # traces/righting_sweep/). Present Current -> crank torque by this file's
    # own laws: motor 0.83 x (I - 16.5 mA), less running gearbox friction
    # 0.15 x load + 5.7 mN m; the half-difference of the two directions, so
    # gravity and offsets cancel. Pooled over ramps of 15-120 deg/s at 28-37 C:
    # rms 8 mN m against 19 for a constant; no trend with speed (one 240 deg/s
    # run read +21 mN m, unexplained). Breakaway needs no separate curve: this
    # plus the gearbox's STATIC law predicts 115 / 181 / 232 mA at 0 / 90 /
    # 120 deg against 110-130 / 160-230 / 160-250 measured.
    #
    # The rise toward the ends is both wings' transmission angle falling
    # together (73 deg at stow, 30 at 129: they share crankpin and rod, so the
    # two are equal). NOT in the curve: a ~15 mN m bump at crank -60 (the right
    # wing's folded toggle; the left's at +60 shows none -- a joint on that
    # side), friction rising ~20 % with temperature over the session, and
    # whatever the bike's weight adds to the pin loads (unloaded here).
    # Re-measure after the full assembly; a cold repeat after a 5 min break-in
    # read ~30 % HIGHER near stow (one run, after a re-assembly).
    linkage_friction_nm: {value: 0.051, source: measured}
    linkage_friction_q2: {value: 0.0147, source: measured}   # N m / rad^2
