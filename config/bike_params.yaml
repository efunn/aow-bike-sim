# The AOW bike in its current form: everything that trains and renders it.
# The onboard settings are config/onboard.yaml; the analytic controllers,
# never-built righting mechanisms, test rigs and the ball move are
# config/studies/. params.load_params() merges both in.
#
# Units: metres, kilograms, degrees (suffix _deg), N m, rpm. Chassis frame:
# origin on the rear axle, +X forward, +Y left, +Z up; wheel axles along Y.
#
# Measurable values are written {value: ..., source: ...}, source one of:
#   measured    -- measured on the part (scale, caliper, bench fit)
#   tooth-count -- an exact ratio from counting teeth
#   datasheet   -- from ROBOTIS / SYD Dynamics documentation
#   design      -- a choice for the custom chassis, usually from the CAD
#   estimate    -- computed indirectly (a CAD volume as printed, a difference
#                  of weighings), not measured on the part itself
#   model       -- a modelling choice standing in for physics the model does
#                  not represent; not a property of the bike
#   GUESS       -- an unknown physical value, a placeholder to be replaced
# Plain scalars are simulation or tuning knobs, not physical quantities.

sim:
  # 4e-4 s since 2026-08-15 (was 2e-4). The contact is insensitive to it: ride
  # ripple, airborne fraction, peak normal force and rest penetration are flat
  # from 5e-5 to 6e-4 s (analysis/contact/contact_surrogates.py --study
  # timestep). 6e-4 dropped the LQR's system-ID fit below its test floor, which
  # is why it stopped at 4e-4; 2e-3 falls over.
  timestep: 4.0e-4
  integrator: implicitfast
  cone: elliptic          # elliptic friction cones + Newton solver (MuJoCo default solver)
  impratio: 10.0
  # Facets per revolved contact mesh (rollers, front tyre). At 32 the facet sag
  # (241 um) matched the contact deflection and the round front tyre bounced off
  # its own polygon (17.5 % of a 0.5 m/s drive airborne); at 64 it is 0.2 %.
  # 64 costs ~3 % of step time, 128 costs 19 % for nothing more.
  mesh_segments: 64
  condim: 4               # 3 = sliding only; 4 adds torsional friction at the contact patch
  # [time constant s, damping ratio]. The time constant is 4x shorter than
  # MuJoCo's default 0.02, which let the rollers sink ~2.2 mm. The damping
  # ratio 1.0 is known to be too high: the real wheel bounced 2-3 times on the
  # bench (docs/measurements/contact-protocol.md P1), which implies ~0.3. 0.5
  # was tried and reverted. Note the naming trap: damping ratio enters only the
  # stiffness term, so lowering it makes the contact STIFFER. To be replaced by
  # a bench fit.
  contact_solref: [0.005, 1.0]
  # (dmin, dmax, width, midpoint, power): MuJoCo's default, written out because
  # the result depends on it. Measured on this model:
  #   dmin  0.9 -> 0.5     sink at bike weight 0.375 -> 0.647 mm
  #   dmax  0.95 -> 0.999  sink at 44 N 1.946 -> 1.709 mm
  #   width 1e-4 -> 1e-2   sink at bike weight 0.278 -> 0.419 mm
  # so a bench fit of solref has to pin dmin too. The contact is also nonlinear
  # over the measured range (26.6 N/mm at bike weight, 22.7 at 44 N), from the
  # faceted cones and a patch that grows as the wheel sinks.
  contact_solimp: {value: [0.9, 0.95, 0.001, 0.5, 2.0], source: GUESS}
  friction_sliding: {value: 0.9, source: GUESS}      # wheel rubber on hard floor -> P0b pull test
  friction_torsional: {value: 0.005, source: GUESS}  # scales with contact patch size -> validation
  floor_size: 3.0

omni_wheel:
  outer_radius: {value: 0.0512, source: measured}   # ridge Ø102.35; envelope ripples ~0.3 mm below
  width: {value: 0.033, source: measured}
  n_axles: {value: 8, source: measured}         # 8 axles x 2 truncated cones = 16 rollers
  axle_mount_radius: {value: 0.040, source: measured}  # wheel axis -> roller axle axis
  axle_cant_deg: {value: 0.0, source: measured}    # axles are purely tangential
  roller:
    big_diameter: {value: 0.022, source: measured}   # large end of one truncated cone
    small_diameter: {value: 0.019, source: measured}
    length: {value: 0.0075, source: measured}        # one cone, along its axis
    pair_gap: {value: 0.010, source: measured}       # big end to big end; floats 8.5-10 mm (axial play)
    big_end_inward: true    # confirmed: big ends face each other across the gap
    pair_mass: {value: 0.004372, source: measured}   # 2 cones + roller axle w/ 20t gear
  hub:
    # Carrier lump: frames 25.0 + casing 37.3 + 8 planet axles 8.0
    #             + ring gear 2 (counter-spin inertia neglected) 4.57 + screws 0.76 [g]
    mass: {value: 0.07563, source: measured}
    body_radius: 0.038      # inertia/visual cylinder (non-contact)
    body_width: 0.020
  ring:
    mass: {value: 0.00457, source: measured}      # ring gear 1 only (input-A side gear)
    body_radius: 0.030
    body_width: 0.008

drivetrain:
  # The wheel is a bevel differential: two side ("ring") gears mesh the 8 planet
  # axles, which are mounted in the carrier (the hub). Inputs A and B are the two
  # ring-gear shafts, belt-driven. So hub = (ring1 + ring2) / 2, and the model's
  # "ring" body is ring gear 1:
  #   [hub; ring_abs] = [[mix_hub_a, mix_hub_b], [mix_ring_a, mix_ring_b]] @ [input_a; input_b]
  mix_hub_a: {value: 0.5, source: tooth-count}
  mix_hub_b: {value: 0.5, source: tooth-count}
  mix_ring_a: {value: 1.0, source: tooth-count}
  mix_ring_b: {value: 0.0, source: tooth-count}
  # Roller axle spin per radian of ring-vs-hub rotation:
  # (ring 48 / planet bevel 12) * (planet bevel 12 / roller gear 20) = 2.4.
  k_roller: {value: 2.4, source: tooth-count}
  # Input shaft speed / servo speed, from the pulley tooth counts.
  belt_ratio: {value: 3.0, source: design}
  # Where the input-shaft bodies sit either side of the wheel (5 g each, no
  # contact). Not the real pulleys: those are bike.frame_parts.drive_pulley_*.
  input_pulley_offset: {value: 0.025, source: design}
  # Rotor + gearbox inertia seen at each input shaft, for the IDEAL drive plant
  # only (the LQR's design plant, the flick/pivot/ball envs). The default
  # detailed plant replaces it with drivetrain_model.servo.rotor_inertia.
  # Kept at 3.0e-4 so those plants stay as they were trained.
  input_armature: {value: 3.0e-4, source: model}
  # The ideal plant's drivetrain losses, kept for the same reason. The detailed
  # plant zeroes all four: its servo friction and inertia are a fit of the whole
  # wheel coasting in the air, hub bearing and rollers included, and a roller
  # inside its play is damped by drivetrain_model.roller_slop.
  hub_joint_damping: {value: 1.0e-4, source: model}
  hub_joint_frictionloss: {value: 1.0e-3, source: model}
  roller_joint_damping: {value: 1.0e-6, source: model}
  roller_joint_frictionloss: {value: 1.0e-5, source: model}

# The detailed drivetrain, the default plant since 2026-10-02. The `measured`
# values are fits to the bench captures in traces/drivetrain/ (rear assembly,
# wheel in the air, 2026-09-13); analysis/servo/drivetrain_fit.py re-derives
# them, and docs/plans/drivetrain-model.md has the reasoning.
#
#   servo        the XC430's firmware velocity loop and motor; replaces
#                actuators.drive_kv / drive_ki and drivetrain.input_armature
#   detent       the differential's resistance once per tooth (7.5 deg)
#   roller_slop  each roller's free play against the drive
#
# servo and detent are applied by drivetrain_model.DrivetrainSim.pre_step
# before every mj_step; a loop that skips it gets drives that never move
# (drivetrain_model.attach_hooks sets that up with the XC330 frictions).
# drivetrain_model.base_params strips this block to give the ideal plant.
drivetrain_model:
  # Physics steps per firmware update (sim knob). 1 = every 0.4 ms step; the
  # frictions run every step regardless.
  update_every: 1

  servo:
    enabled: true
    # Firmware register values, i.e. what is written to the servo: the factory
    # defaults. Changing the firmware gains is a change here only; the two scales
    # below map any register value onto the loop.
    velocity_p_gain: 100        # Velocity P Gain(78)
    velocity_i_gain: 1920       # Velocity I Gain(76)
    #
    #   duty = Kp * (v_ref - LPF(w_meas)) + Ki * (integral(v_ref) - theta_meas)
    #   torque_servo = stall_torque * (clip(duty, +-1) - w / no_load_speed)
    #
    # Kp: 3.5-4.5e-4 per P unit across P 100/200/400 on the reversal and chirp
    # captures (the ones that load the P term). ROBOTIS's own conversion,
    # KVP/128 per 0.229 rpm per 885 PWM counts, is 3.68e-4.
    kp_per_unit: {value: 4.0e-4, source: measured}    # duty per rad/s, per P unit
    # Ki: 1.3-1.5e-3 per I unit on the steps (R^2 0.998), matching the hand-push
    # hold spring of 0.047 duty per servo degree (2.69 duty/rad at I 1920).
    # Twice ROBOTIS's conversion at a 1 kHz loop, so a 2 kHz loop is the likely
    # reading -- inferred, not verified.
    ki_per_unit: {value: 1.45e-3, source: measured}   # duty per rad, per I unit
    # Frame computing a command -> the servo's velocity reference moving.
    command_delay_s: {value: 0.004, source: measured}      # latency.velocity_trajectory_delay_ms
    # Effective, not a register: the lag inside the loop (encoder differencing
    # plus filtering) that puts the ~20 Hz peak at P 400 and none at P 200. Fit
    # by closed-loop replay of the chirps; see the plan doc for what it misses.
    measurement_delay_s: {value: 0.004, source: measured}
    velocity_filter_s: {value: 0.012, source: measured}
    # Velocity Limit(44) = 460 x 0.229 rpm, read off both servos.
    velocity_limit_rad_s: {value: 11.03, source: datasheet}
    # At the servo shaft [kg m2], rotor + gearbox + belt, loaded: 2.3-2.8e-3
    # from the PWM coast, 1.8-2.3e-3 from the P 400 chirps; the bare shaft's
    # 14 ms time constant implies 2.0e-3. Seen at the input shaft as
    # rotor_inertia / belt_ratio^2.
    rotor_inertia: {value: 2.2e-3, source: measured}
    # Per servo, at the servo shaft, and the same in common and differential mode
    # (0.10-0.14 duty), so it sits at the input shafts. Servo B's side reads ~25 %
    # higher in every capture; one value here. Applied as a sticking friction (a
    # stiff spring to an anchor that slides past the limit), because MuJoCo's
    # joint frictionloss creeps and has no static floor.
    coulomb_friction: {value: 0.15, source: measured}   # N.m
    # Sim knobs for that stick, at the input shaft: N.m/rad and N.m.s/rad.
    # 250 holds to ~2e-4 rad and keeps omega*dt ~0.4 on the rotor inertia.
    friction_stick_stiffness: 250.0
    friction_stick_damping: 0.2

  detent:
    enabled: true
    # A friction bump on ring-vs-hub, once per tooth: friction rather than a
    # conservative hill, because at 1 % creep the extra push sits at the same
    # phase in both directions (drivetrain_fit.py detent).
    period_deg: {value: 7.5, source: tooth-count}   # ring-vs-hub, input shaft
    width_deg: {value: 2.5, source: measured}       # raised cosine, full width
    # Peak extra friction on ring_spin [N m]: ~0.09 duty per servo above the
    # ~0.12 baseline, times stall torque / belt ratio, times 2 servos.
    friction: {value: 0.096, source: measured}
    # Phase is drawn per episode where there is an rng (training, the eval
    # env), else this. Nothing has measured where the wall sits.
    phase_deg: 0.0
    # Elasto-plastic stick, sim knobs: the spring to the sticking point on
    # ring-vs-hub [N.m/rad], and its damping [N.m.s/rad]. 1000 holds a stuck
    # detent to ~1e-4 rad and sits at omega*dt ~0.4 on the input shafts; much
    # stiffer and the explicit step goes unstable.
    stick_stiffness: 1000.0
    stick_damping: 1.0

  roller_slop:
    enabled: true
    # Per roller, in roller-angle units. The rigid roller coupling is replaced by
    # a tendon with a weak centring spring and hard limits at the ends of the play.
    half_play_deg: {value: 7.8, source: measured}      # 15.6 deg p-p by hand
    # A roller often springs back to the middle of its play by hand, not every
    # time; nothing has measured the spring. At 1e-3 it is a dead zone under load
    # (1.4e-4 N m at the wall against ~0.05 N m of ground torque).
    centring_stiffness: {value: 1.0e-3, source: GUESS}  # N.m/rad
    # Critical damping against the roller's spin inertia (2.31e-7 kg m2):
    # 2 sqrt(k J) = 3.0e-5. By hand, a flicked roller returns to centre with no
    # visible overshoot. tests/test_drivetrain_model.py pins the ratio.
    damping: {value: 2.9e-5, source: model}             # N.m.s/rad
    # How hard the ends of the play are: 0.001 holds them to ~1.5 deg under a
    # 20 rad/s dithered diff. Must stay >= 2 x sim.timestep.
    wall_timeconst_s: 0.001

bike:
  # The v2 bike as built (2026-10-19): wheelbase, rake and every placement are
  # read off the v2 CAD (cad.bike_v2), positions from one Onshape eval of its
  # bodies' centroids (traces/bike_v2_cad/mass_eval.txt).
  # CAD frame -> this frame: x = CAD y, y = -CAD x, z = CAD z.
  wheelbase: {value: 0.2005, source: design}   # the CAD's
  # analysis/policy/steer_wobble.py: forward wobble roughly halves going from
  # 15 to 20 deg; the standing wobble grows.
  rake_deg: {value: 20.0, source: design}      # steering axis tilt back from vertical
  fork_offset: {value: 0.0, source: design}  # perpendicular distance steer axis -> front axle
  chassis:
    # The residual: everything no entry below names, i.e. cables and fasteners.
    # Weighed by item 2026-10-21, times the count on the bike:
    #   5 JST servo cables x 5 g = 25, 2 USB 6" cables x 8 g = 16,
    #   17 6-32 screws + nuts x 1.2 g = 20.4.
    # Not in it: the 4-40 and M2 screws (not weighed, a few g), and the
    # rollcage's and wings' 6-32s (not fitted yet).
    # Check: the bike without blades, battery or rollcage weighed 772 g; the model
    # reads 791 g for the same bike. About 11 g of that is the wing hubs' stubs
    # (in the CAD, not on the bike); the rest is presumably the printed parts,
    # still CAD estimates.
    mass: {value: 0.061, source: measured}
    # true: spread over the frame parts in proportion to their mass, so it draws
    # as nothing of its own. false: its own box below. The box stays either way
    # (massless when spread) as the older studies' contact envelope.
    spread: true
    box_size: [0.20, 0.04, 0.10]         # inertia primitive (full extents): the rails' span
    com_pos: [0.10, 0.0, 0.08]           # chassis-frame position of that primitive (origin = rear axle)
  # Every rigid part on the chassis: `mass` (or `servo:`, taking the mass from
  # `servos:`) and its `geoms`, each a box, cylinder or prism carrying `share` of
  # the mass (default: an equal split). `pos` [m]; `size` full extents
  # [x, y, z] for a box, [radius, length] for a cylinder (axis along its local
  # z); `quat` (w x y z, optional) its axes in the chassis frame. To fold in a
  # weighing, change `mass` only.
  #
  # Shapes are from one Onshape eval (traces/bike_v2_cad/shape_eval.txt): each
  # part's tight box in the bike, drive (45 deg) or steering (20 deg) frame,
  # centred on the part's centroid. The side rails are their CAD outlines
  # extruded (prism: `outline` [x, z] in the side view, `across` [y0, y1]).
  # They set the inertia; they are not a picture of the parts.
  #
  # Printed parts' masses are CAD estimates (cad.servo_mount.printed_mass:
  # 0.9 mm skin, 15 % infill, ASA 1.07 g/cm3), estimates until weighed. For the six
  # below plus the Pi spacers the estimate is 88.2 g against the slicer's 81
  # (traces/weigh_v2_printed.txt, which has a column for the scale).
  #
  # Nothing that moves is here: the pulleys' spin is drivetrain.input_armature,
  # the steering's moving half fork_mass, the righting's righting.module.
  frame_parts:
    servo_drive_left:      # XC430 "A", horn on the left
      servo: xc430_w150
      geoms:
        - {type: box, pos: [0.0768, -0.0, 0.0567], size: [0.0465, 0.034, 0.0285], quat: [0.92388, 0.0, -0.38268, 0.0]}
    servo_drive_right:      # XC430 "B", beside A across the drive
      servo: xc430_w150
      geoms:
        - {type: box, pos: [0.0567, 0.0, 0.0768], size: [0.0465, 0.034, 0.0285], quat: [0.92388, 0.0, -0.38268, 0.0]}
    drive_case_left:      # the left side rail: its CAD outline pieces (cad.drive.rail_layout), extruded across the plate (x 16..20.6 mm), mass by area
      mass: {value: 0.0207, source: estimate}
      geoms:
        - {type: prism, share: 0.3431, across: [0.0160, 0.0206],   # outline
           outline: [[0.08256, 0.04190], [0.08600, 0.03860], [0.15000, 0.03860], [0.15554, 0.05632], [0.16635, 0.06025], [0.18500, 0.06704], [0.18500, 0.07480], [0.19950, 0.07480], [0.19950, 0.08350], [0.17900, 0.08350], [0.16206, 0.07204], [0.15000, 0.07160], [0.10511, 0.06304], [0.10440, 0.06375]]}
        - {type: prism, share: 0.0541, across: [0.0160, 0.0206],   # rear arm
           outline: [[0.02924, 0.06204], [0.01550, 0.06704], [0.01550, 0.07480], [0.00100, 0.07480], [0.00100, 0.08350], [0.02150, 0.08350], [0.03223, 0.07430], [0.02924, 0.07131]]}
        - {type: prism, share: 0.5219, across: [0.0160, 0.0206],   # case side
           outline: [[0.04741, 0.02924], [0.07131, 0.02924], [0.10511, 0.06304], [0.06304, 0.10511], [0.02924, 0.07131], [0.02924, 0.04741]]}
        - {type: prism, share: 0.0615, across: [0.0160, 0.0206],   # front ear
           outline: [[0.06993, 0.09821], [0.09192, 0.12021], [0.08238, 0.12975], [0.06038, 0.10776]]}
        - {type: prism, share: 0.0194, across: [0.0160, 0.0206],   # back ear
           outline: [[0.02471, 0.06679], [0.03285, 0.07492], [0.02471, 0.08305], [0.01658, 0.07492]]}
    drive_case_right:      # the right side rail: its CAD outline pieces (cad.drive.rail_layout), extruded across the plate (x 16..20.6 mm), mass by area
      mass: {value: 0.0195, source: estimate}
      geoms:
        - {type: prism, share: 0.3733, across: [-0.0206, -0.0160],   # outline
           outline: [[0.08256, 0.04190], [0.08600, 0.03860], [0.15000, 0.03860], [0.15554, 0.05632], [0.16635, 0.06025], [0.18500, 0.06704], [0.18500, 0.07480], [0.19950, 0.07480], [0.19950, 0.08350], [0.17900, 0.08350], [0.16206, 0.07204], [0.15000, 0.07160], [0.10511, 0.06304], [0.10440, 0.06375]]}
        - {type: prism, share: 0.0588, across: [-0.0206, -0.0160],   # rear arm
           outline: [[0.02924, 0.06204], [0.01550, 0.06704], [0.01550, 0.07480], [0.00100, 0.07480], [0.00100, 0.08350], [0.02150, 0.08350], [0.03223, 0.07430], [0.02924, 0.07131]]}
        - {type: prism, share: 0.5679, across: [-0.0206, -0.0160],   # case side
           outline: [[0.04741, 0.02924], [0.07131, 0.02924], [0.10511, 0.06304], [0.06304, 0.10511], [0.02924, 0.07131], [0.02924, 0.04741]]}
    drive_chainstay_left:
      mass: {value: 0.0063, source: estimate}
      geoms:
        - {type: box, pos: [0.0235, 0.0323, 0.0235], size: [0.077, 0.0217, 0.019], quat: [0.92388, 0.0, -0.38268, 0.0]}
    drive_chainstay_right:
      mass: {value: 0.0063, source: estimate}
      geoms:
        - {type: box, pos: [0.0235, -0.0323, 0.0235], size: [0.077, 0.0217, 0.019], quat: [0.92388, 0.0, -0.38268, 0.0]}
    drive_pulley_left:      # the servo's pulley, a disc across the bike: its MASS (its spin is in input_armature)
      mass: {value: 0.0198, source: estimate}
      geoms:
        - {type: cylinder, pos: [0.0853, 0.0276, 0.0652], size: [0.0372, 0.0172], quat: [0.70711, -0.70711, 0.0, 0.0]}
    drive_belt_left:      # GT2 belt as its two straight runs (wraps left out: CoM ~18 mm back of the CAD belt's)
      mass: {value: 0.015, source: measured}   # one belt weighed 2026-10-21
      geoms:
        - {type: box, pos: [0.0244, 0.0277, 0.0477], size: [0.1047, 0.009, 0.0015], quat: [0.90549, 0.0, -0.42437, 0.0], share: 0.5}
        - {type: box, pos: [0.0525, 0.0277, 0.011], size: [0.1047, 0.009, 0.0015], quat: [0.97719, 0.0, -0.21236, 0.0], share: 0.5}
    drive_pulley_right:      # the servo's pulley, a disc across the bike: its MASS (its spin is in input_armature)
      mass: {value: 0.0198, source: estimate}
      geoms:
        - {type: cylinder, pos: [0.0652, -0.0276, 0.0853], size: [0.0372, 0.0172], quat: [0.70711, -0.70711, 0.0, 0.0]}
    drive_belt_right:      # GT2 belt as its two straight runs (wraps left out: CoM ~18 mm back of the CAD belt's)
      mass: {value: 0.015, source: measured}   # one belt weighed 2026-10-21
      geoms:
        - {type: box, pos: [0.011, -0.0277, 0.0525], size: [0.1047, 0.009, 0.0015], quat: [0.84114, 0.0, -0.54082, 0.0], share: 0.5}
        - {type: box, pos: [0.0477, -0.0277, 0.0244], size: [0.1047, 0.009, 0.0015], quat: [0.94035, 0.0, -0.3402, 0.0], share: 0.5}
    servo_steer:      # XC330, shaft down the steering axis, case out the front
      servo: xc330_t181
      geoms:
        - {type: box, pos: [0.1697, -0.0, 0.1067], size: [0.034, 0.02, 0.023], quat: [0.98481, 0.0, -0.17365, 0.0]}
    steer_case_lower:      # the steering's STATIC half (cad.steering stages)
      mass: {value: 0.0121, source: estimate}
      geoms:
        - {type: box, pos: [0.1752, -0.0, 0.084], size: [0.0499, 0.0344, 0.0425], quat: [0.98481, 0.0, -0.17365, 0.0]}
    steer_case_upper:
      mass: {value: 0.0079, source: estimate}
      geoms:
        - {type: box, pos: [0.1685, 0.0, 0.1136], size: [0.0516, 0.0281, 0.0223], quat: [0.98481, 0.0, -0.17365, 0.0]}
    pi_carrier:      # a plate over the drive's front face; with its four printed spacers (0.3 g)
      mass: {value: 0.0126, source: estimate}
      geoms:
        - {type: box, pos: [0.1138, 0.0007, 0.0998], size: [0.0022, 0.056, 0.0953], quat: [0.92388, 0.0, -0.38268, 0.0]}
    power_holder:      # a panel on the left, between the battery and the rail
      mass: {value: 0.0077, source: estimate}
      geoms:
        - {type: box, pos: [0.0349, 0.0149, 0.1045], size: [0.0677, 0.0033, 0.0455], quat: [0.92388, 0.0, -0.38268, 0.0]}
  # The fork and front wheel weighed 86 g together (2026-09-30). The fork is
  # its CAD estimate, the wheel the rest (rounded).
  fork_mass: {value: 0.025, source: estimate}   # steerer + fork, without the wheel
  front_wheel:
    # The wheel from the original bike, measured 2026-10-05.
    radius: {value: 0.05125, source: measured}   # 102.5 mm diameter
    width: {value: 0.024, source: measured}
    shoulder_radius: {value: 0.007, source: measured}
    # The real tread is a 10 mm flat, modelled as a shallow crown so the contact
    # moves smoothly with lean (docs/plans/mujoco-modeling-decisions.md).
    crown_radius: {value: 0.080, source: model}
    mass: {value: 0.060, source: estimate}
  steering:
    gear_ratio: {value: 1.0, source: design}  # servo rotation per steer rotation; range is continuous 360°+
    # Headset friction (the printed bushing and thrust face), on top of the
    # XC330's gearbox friction: a + b x |T|, T the axial load through the thrust
    # face [N] (the `headset_force` sensor in the sim). Applied by
    # gearbox_friction.attach_steer.
    #
    # From the first print's friction maps (steering-design.md, 2026-09-30):
    # running friction over four loads, 86-368 g along a 15 deg axis, less the
    # gearbox's own line. The printed seams' peaks (to 47 mN m, two spots 180 deg
    # apart) are left out on purpose: the seam is fixable in printing. Running
    # friction only; the static was ~1.5x on one unloaded sweep. A reprint moves
    # it.
    headset_friction_nm: {value: 0.00172, source: measured}      # N m, a
    headset_friction_per_n: {value: 0.00475, source: measured}   # N m per N, b
  ahrs:                                       # SYD Dynamics TM151
    # On the drive's tabs, USB up and back (v2 CAD). `pos` is the centre of the
    # housing, where `ahrs_site` sits. `quat` is the TM151's own axes in the
    # chassis frame (+x the pin header, +z out of the top): pitched 45 deg
    # nose-down about y. The site stays on the chassis axes, because on the bike
    # config/ahrs_mount.yaml rotates the readings into that frame; the tilt
    # reaches the sim through where the accelerometer sits in the part
    # (sim_ahrs.tm151_to_site).
    pos: [0.0989, 0.0, 0.0842]
    quat: [0.92388, 0.0, 0.38268, 0.0]
    mass: {value: 0.019, source: datasheet}
    box_size: [0.040, 0.034, 0.0126]          # in its own axes: x along the 40
  payload:
    # The untethered running gear (docs/plans/untethered-setup.md), entries as in
    # frame_parts. build_model(payload=False) leaves it out (the tethered bike).
    # Placements are the v2 CAD's, all in the drive frame (quat: box x across the
    # bike, y up the belt, z up and back). The power board and its holder sit left
    # of the centreline, a standing roll bias the policy trims out.
    battery:                                  # 3S 1300 mAh LiPo, on the drive's back face
      pos: [0.02917, 0.0, 0.09387]
      mass: {value: 0.076, source: measured}
      box_size: [0.022, 0.058, 0.030]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
    pi:                                       # Raspberry Pi 3B+, the stand-in
      pos: [0.12035, 0.0, 0.11215]
      mass: {value: 0.050, source: datasheet}   # approx.; Pi + U2D2 + carrier weighed 71 g together (model 71.6)
      box_size: [0.056, 0.020, 0.089]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
    u2d2:                                     # ROBOTIS U2D2, under the Pi
      pos: [0.11494, 0.0, 0.08807]
      mass: {value: 0.009, source: measured}  # case only (bike_params_cad, 2026-08)
      box_size: [0.018, 0.0149, 0.048]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]
    power_board:                              # the PCB with its components + the power switch
      pos: [0.0440, 0.0274, 0.1094]
      # Weighed 2026-10-19. Its printed holder is frame_parts.power_holder.
      mass: {value: 0.016, source: measured}
      box_size: [0.0126, 0.0265, 0.025]
      quat: [0.65328, 0.2706, -0.2706, -0.65328]

servos:
  # The 12 V datasheet column, i.e. the tethered bike. On a 3S pack (11.1 V
  # nominal, 9.9 V at cutoff) the servos have ~12 % less torque:
  #   XC430-W150   1.4 N m /  99 rpm at 11.1 V   (1.6 / 106 here)
  #   XC330-T181   0.76 N m / 104 rpm at 11.1 V  (0.80 / 113 here)
  # The sim stays a 12 V bike; training covers the range with
  # randomization.actuator_frac.
  xc430_w150:   # 2x, AOW drive (values at 12 V per datasheet)
    stall_torque: {value: 1.6, source: datasheet}
    stall_current: {value: 1.4, source: datasheet}
    no_load_rpm: {value: 106.0, source: datasheet}
    mass: {value: 0.065, source: datasheet}
    box_size: [0.034, 0.0285, 0.0465]   # D x W x H, axis along Y
    # placements: bike.frame_parts.servo_drive_left / _right
  xc330_t181:   # steering (values at 12 V per datasheet)
    # Kept at the datasheet, though the X330 fixture (2026-09-26,
    # docs/plans/pre-assembly-bench-checklist.md) put the stall torque per unit
    # duty at 0.62-0.69 N m in every estimate, while the torque-speed shape,
    # no-load speed and P scaling all matched. The lever rig cannot separate
    # friction from torque; measure it in place on the bike.
    stall_torque: {value: 0.80, source: datasheet}
    # kt = stall_torque / stall_current sets the current a given load draws and
    # does not depend on pack voltage (used for the power budget in
    # docs/plans/untethered-setup.md and `self_righting.py lift`).
    stall_current: {value: 0.88, source: datasheet}
    no_load_rpm: {value: 113.0, source: datasheet}
    # Current-based position mode (5), the righting servo's: motor torque
    # k (|I| - I0) above a firmware deadband, from the X330 fixture
    # (docs/plans/righting-servo-model.md). Fitted over 8-59 mN m / 35-129 mA;
    # nothing is measured past ~200 mA. (The datasheet's kt is 0.91.)
    current_deadband: {value: 0.0165, source: measured}      # A
    current_torque_gain: {value: 0.83, source: measured}     # N m / A
    # Gearbox friction, both XC330s (righting crank and steer):
    # fraction x load + constant, load = the torque the gearbox passes on.
    # Static from mode 5's four loads, running from mode 3's four speed lines.
    # Applied by gearbox_friction.py.
    friction_static_fraction: {value: 0.51, source: measured}
    friction_static_nm: {value: 0.0051, source: measured}
    friction_running_fraction: {value: 0.15, source: measured}
    friction_running_nm: {value: 0.0057, source: measured}
    # Below this output speed the static pair applies. A modelling threshold:
    # loaded slides ran 30-40 deg/s once going.
    friction_stick_speed: {value: 0.05, source: model}      # rad/s
    mass: {value: 0.023, source: datasheet}
    box_size: [0.026, 0.020, 0.034]
    # placement: bike.frame_parts.servo_steer (the righting's: righting.module.servo_case)

actuators:
  # The IDEAL drive plant's servo, both gains at the input shafts (after
  # belt_ratio):
  #   force = drive_ki * integral(ctrl - w) dt - drive_kv * w
  # Only the ideal plant uses these (the LQR's design plant, the flick, pivot
  # and ball envs, policies exported without a `drivetrain_model:` record). The
  # default detailed plant replaces them with drivetrain_model.servo, fitted on
  # the bench.
  #
  # Neither is measured. drive_kv is the bare motor's droop, stall_torque /
  # no_load_speed / belt_ratio^2 = 1.6 / 11.098 / 9, which gives max force
  # stall_torque / belt_ratio and an input_armature / kv time constant of
  # 18.7 ms, the motor's own. drive_ki 0.6 is the Dynamixel X-series default
  # KVI/KVP ratio at an assumed 1 kHz firmware loop; Ti = kv / ki = 26.7 ms.
  drive_kv: 0.016016   # N m s/rad at the input shaft; see above
  drive_ki: 0.6   # N m/rad
  # The steering servo, at the steer joint (steering.gear_ratio 1.0, so the
  # joint is the servo shaft). The XC330 runs in extended position mode (4),
  # whose PID output is PWM duty, so it maps exactly onto MuJoCo's position
  # actuator:
  #   tau = [Kp * k3 * tau_stall] * err - [tau_stall / w_noload] * w
  # `steer_gains` are the firmware registers, written to the servo at startup
  # (BikeBus); the sim's kp is Position P Gain x steer_kp_per_unit, derived by
  # params.load_params as actuators.steer_kp. kv is the motor's back-EMF droop.
  #
  # The per-unit scale and steer_armature were fitted together to open-loop sine sweeps of the
  # steer XC330 at P 900, column and headset fitted, +-5 deg at 1-10 Hz
  # (analysis/servo/steer_response.py, traces/bench/steer_response_261017-*.json;
  # the sim side is analysis/policy/steer_pinned.py --sine --bare): within ~0.03
  # gain / 3 deg of the bench at every frequency. A second unit, bare, agreed
  # within 0.02. The fit, kp 2.3 at P 900, is 11 % above the derived
  # k3 x tau_stall = 2.877e-3 x 0.80 per unit (2.07 at P 900), unexplained.
  #
  # kv is held at the droop, 0.80 / 11.833, not fitted: the sweeps only fix
  # kp / kv, and the no-load speed fixes kv (a fitted 0.055 let a saturated
  # steer run at 14.5 rad/s against the 11.9 measured).
  #
  # Not modelled: below ~0.25 rad/s the bare servo holds within ~1 encoder
  # count with no droop or friction offset. On the bike the wheel's scrub and
  # backlash will set small motions; measure them on the assembled steering.
  steer_gains:
    Position P Gain: 900      # factory default for mode 4
    Position I Gain: 0
    Position D Gain: 0        # the back-EMF droop already damps the loop
  steer_kp_per_unit: {value: 2.5556e-3, source: measured}   # N m/rad per P unit: 2.3 at P 900
  steer_kv: 0.0676
  # The XC330's rotor + gearbox inertia at the steer joint [kg m2], from the
  # same sweeps: ~13x the fork and wheel about the axis.
  steer_armature: {value: 5.5e-4, source: measured}
  # Where the torque limit sits. The firmware clips the duty, then the motor
  # subtracts its back-EMF:
  #   duty:  tau = clip(kp*err, +-stall) - kv*w   (the real servo, mode 4)
  #   total: tau = clip(kp*err - kv*w, +-stall)   (MuJoCo's native clip)
  # They differ once the P term saturates: `total` let the steer reach
  # 23.2 rad/s against an 11.8 no-load. `duty` builds a kp-only position
  # actuator plus kv as joint damping. `total` is kept so a pre-2026-09-21
  # policy's training plant can still be built.
  steer_clip: duty
  # Frame that computes a steer goal -> the servo's reference moving: 4.0 ms on
  # both XC330s in mode 4 (servo-measurements.yaml, `xc330_command_delay`),
  # frame-quantised, so the true value is in (2, 4] ms. MuJoCo's native
  # actuator delay.
  steer_command_delay_s: {value: 0.004, source: measured}

control:
  # What the bike's controllers read that is not a measurement. The analytic
  # controllers' settings (PD, LQR, its drive, flip, pivot) are
  # config/studies/analytic_control.yaml; the onboard ones config/onboard.yaml.
  # Both are merged in by params.load_params().
  rate_hz: 200          # controller update rate; zero-order hold between updates
  moves_dir: moves      # optimized maneuver files (moves/<name>.yaml); see optimize_flick.py
  # The always-on general policy teleop and the bike drive with, as
  # moves/<name>.{yaml,npz}; retired moves in moves/archive/ load by bare name.
  # `run_drive --general NAME` overrides it for one session. Changing it moves
  # neither digest. Why each pointer was chosen is in docs/status.md and the
  # DEVLOG.
  general_move: general_puffer_fixes_72M
  drive:
    # The speed cap teleop and the bike's command path clamp to.
    v_max: 1.2          # m/s; ~70% of the 1.7 no-load ceiling (torque margin)

righting:
  # The bike's righting: `module`, the V2 four-bar with its blades, and
  # `rollcage`, its roof. The study mechanisms are
  # config/studies/righting_mechanisms.yaml.
  rollcage:
    # The v2 rollcage (cad.bike_v2.rollcage): two 270 deg rings, outer radius
    # 68.7 mm (the blades' widest at rest), axis 100 mm above the rear axle, with
    # elliptical half-dome caps (50 deep, tips at x -50 and +250.5 mm) and a
    # flexible sheet between them, modelled as one capsule. It sits 2.6 mm inside
    # the rings at their own stations, and is closed across the rings' 90 deg
    # opening at the bottom, which faces the floor only while the wheels carry
    # the bike. The contact geom is named `roof`.
    radius: {value: 0.0687, source: design}
    height: {value: 0.100, source: design}       # its axis, above the rear axle
    x_start: {value: 0.0187, source: design}     # -0.050 + radius
    x_end: {value: 0.1818, source: design}       # 0.2505 - radius
    # A shell's inertia, not a solid's: the mass sits at the radius.
    mass:
      cages: {value: 0.0685, source: estimate}   # 2 x 34.3, CAD printed estimate
      caps: {value: 0.1085, source: estimate}    # 2 x 54.2, CAD printed estimate
      # The caps will be lighter once designed (2026-10-21); the CAD's until then.
      # The sheet is not in the CAD: 0.5 mm polycarbonate over 270 deg of a 66.2
      # radius, ~185 long. Material and thickness both assumed.
      sheet: {value: 0.035, source: GUESS}
  module:
    # The V2 righting module, built by default: the diamond four-bar as
    # aow_sim.cad.righting draws it (one crankpin, one wing rod), the blades of
    # `blade_file` (V3 since 2026-10-14), and an XC330 in current-based position
    # mode. swing_linkage=False builds the wingless bike every export before
    # 2026-10-09 trained on.
    #
    # The geometry is not copied here: `linkage_cad` names the CAD's own config
    # and `blade_file` the blade outline, and params.resolve_righting_module
    # inlines both, so plant_digest moves when either file does.
    linkage_cad: {value: config/cad/righting_cad.yaml, source: design}
    blade_file: {value: config/linkage/blade_v3.yaml, source: design}   # V2 is config/linkage/righting_blade.yaml
    # The couplers' mid-plane on the wing rod, ahead of the rear axle (the CAD's).
    # Module-frame fore/aft positions below are relative to it.
    station_x: {value: 0.1205, source: design}
    # Masses, all estimates: CAD volumes (traces/righting_check.txt, 2026-10-07) as
    # printed parts (cad.servo_mount.printed_mass) and steel at 7.85 g/cm3.
    # Nothing weighed. `at`: the group's centroid in the module frame, mm --
    # [out (+ = the right wing's side), up from the wing rod, fore].
    crank:     # both half cranks, horn hub, steel crankpin, washer
      mass: {value: 0.0112, source: estimate}
    coupler:   # each
      mass: {value: 0.0023, source: estimate}
    wing_hub:   # each: rocker + knuckle + 2 printed stubs + steel rocker pin
      mass: {value: 0.0149, source: estimate}
      at: [31.0, 17.1, -3.3]
    blade:   # each
      mass: {value: 0.0286, source: estimate}   # V2's; the blade file's own mass wins (V3: 38.8 g)
    # Fixed to the chassis, one entry per part from the v2 evals
    # (traces/bike_v2_cad/): `at` in the module frame (mm), `size` full extents
    # in the chassis frame [fore, across, up] (a cylinder: [radius, length]).
    fixed:     # printed parts at their CAD centroids; the steel wing rod a cylinder along the bike
      bulkhead: {mass: {value: 0.0054, source: estimate}, at: [0.0, 22.6, 18.5], size: [0.01, 0.0247, 0.0588]}
      bridge: {mass: {value: 0.0066, source: estimate}, at: [0.0, 53.6, 0.0], size: [0.047, 0.0344, 0.01]}
      lower_case: {mass: {value: 0.0116, source: estimate}, at: [0.0, 20.0, -24.7], size: [0.0307, 0.0247, 0.0588]}
      upper_case: {mass: {value: 0.0078, source: estimate}, at: [0.0, 19.0, -51.2], size: [0.0223, 0.0281, 0.051]}
      wing_rod: {mass: {value: 0.0104, source: estimate}, at: [0.0, 0.0, 0.0], size: [0.003, 0.047], type: cylinder}
    # The crank's XC330 case (its mass from servos.xc330_t181). `at` in the
    # module frame (mm); `size` in the chassis frame, shaft forward.
    servo_case:
      at: [0.0, 17.6, -44.2]
      size: [0.023, 0.020, 0.034]
    # The crank servo; the four-bar's own `limits.torque_nm` caps it
    # (build_model._add_swing_linkage).
    servo: xc330_t181
    # The crank servo's firmware registers, current-based position mode (5),
    # written to it at startup (BikeBus) and read by the sim's servo model
    # (righting_servo.py). Factory P700/I0/D1400. D is the loop's only
    # damping: commanding current removes the back-EMF droop. I stays 0: an
    # integrator would wind up against the floor at the end of the stroke.
    #
    # params.load_params derives the native actuator's gains at the crank from
    # them (righting.module.servo_kp / servo_kv), with the PID's output read as
    # milliamps (k5 = (4096/2pi) / (256 x 1000) A per count-rad, 2.525e-3
    # measured) and the measured torque per amp (servos.xc330_t181
    # .current_torque_gain):
    #   servo_kp = P x k5 x k            = 1.479
    #   servo_kv = D x (16 k5 x 1 ms) x k = 0.0473
    # The D term is taken per 1 ms loop tick; a bare-shaft fit put the real
    # value at 0.25-0.7x that, so kv is right in order of magnitude only.
    gains:
      Position P Gain: 700
      Position I Gain: 0
      Position D Gain: 1400
    # The XC330's rotor + gearbox inertia at the crank, measured 2026-10-17: the
    # bare righting XC330's own sine sweep in mode 4, the same fit and value as
    # actuators.steer_armature. The crank is on the horn, so the rotor inertia is
    # the crank's. Without one the position actuator rang at 1200-1300 deg/s.
    crank_armature: {value: 5.5e-4, source: measured}
    # The linkage's own friction referred to the crank, on top of the XC330's
    # gearbox friction (righting only; the steer has its own headset term):
    #   f(theta) = linkage_friction_nm + linkage_friction_q2 * theta^2  [N m]
    # theta = crank travel from stow [rad].
    #
    # Measured 2026-10-17 on V2 as built: stubs only, no blades, unloaded
    # (analysis/mechanism/righting_sweep.py, traces/righting_sweep/). Present
    # Current -> crank torque by this file's motor and gearbox laws, half the
    # difference of the two directions so gravity cancels; ramps of 15-120 deg/s
    # at 28-37 C, rms 8 mN m. The rise toward the ends is the transmission angle
    # falling (73 deg at stow, 30 at 129). Not in it: a ~15 mN m bump at crank
    # -60, a ~20 % rise with temperature, and the bike's weight on the pins.
    # Re-measure on the assembled bike; a cold repeat read ~30 % higher near
    # stow (one run).
    linkage_friction_nm: {value: 0.051, source: measured}
    linkage_friction_q2: {value: 0.0147, source: measured}   # N m / rad^2
