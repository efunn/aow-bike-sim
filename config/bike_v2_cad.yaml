# aow-bike-whole-v2: the modules placed, the electronics free-floating, NO
# chassis yet (user, 2026-10-11; docs/plans/aow-bike-whole-v2.md). Read by
# aow_sim.cad_bike_v2. Millimetres, BIKE FRAME: origin on the rear axle, +Y
# forward, +X right, +Z up (the floor at -51.2).
#
# CAD ONLY, as v1 (config/bike_cad.yaml): nothing here reaches the sim.
#
# Modules, each from its own generator and config, built fresh every time:
#   drive     cad_drive, the fixture mock OFF
#   steering  cad_steering --v2 (servo out the front, no mount plate)
#   righting  cad_righting, wing.blade outline (the V3 blade); its floor
#             mock and chassis-plate placeholder are left out here

placement:
  # The wing rod's station ahead of the rear axle (its height is the
  # module's: rod 41.2 off the floor). v1's last fit, carried over as the
  # starting point; --check says whether it still clears the drive now the
  # blade is V3 and the drive has lost its fixture tabs.
  righting_y: {value: 120.5, source: design (v1's fit, 2026-10-07)}
  # The front axle ahead of the rod. 80 (2026-10-11 pm), was 86: the
  # blades are now CENTRED ON THE WHEELBASE (user; righting_cad.yaml
  # wing.blade_y), so their front ends sit 20.75 ahead of the rod, not 41,
  # and no longer bind against the front tyre's steer sweep. 80 is v1's
  # front (the righting's front bulkhead 5 from the straight front wheel),
  # and it puts mid-wheelbase exactly on blade_y's centre. layout() refuses
  # a wheelbase the blades are not centred on, and says the span to use.
  front: {value: 80.0, source: design (v1's front; centres the blades)}
  wing_margin: {value: 2.0, source: design}

# THE ELECTRONICS, free to move (user: "can reposition these to find the
# best layout, then design case/routing around it"). Each is a box `size`
# [x, y, z] about `at`, its centre, in `frame`:
#   bike  -- the bike frame
#   drive -- the drive module's frame: origin on the rear axle, Y along the
#            belt (up the drive's 45 deg), Z across it; its +Z face looks
#            up and back, its front face (the skirt's wall, y 118.9) up and
#            forward
#   steer -- the steering module's frame: origin on the front axle, Z up the
#            raked steering axis, Y forward (the servo's side)
# `rx` turns the box about its own X axis, deg, before placing it. The Pi
# is drawn in detail (`pi:` below) in its box's frame instead of as a box.
# `mass` in grams where known.
#
# Where each is, and why (2026-10-11, user's second review):
#   battery  on the drive's back, between the pulleys, on the case sides;
#            NOTHING on it: "battery needs to be able to come in and out
#            easily" (user)
#   AHRS     flat on the drive's front face, between the servos (user:
#            "looks good"), slid to the face's lower part to make room for
#   power    (2026-10-16 night) on the power carrier beside the battery,
#            outboard of the left rail: `power:` below
#   Pi       parallel to the face, past the pulleys' rims, on the Pi
#            carrier's plate (`pi_carrier:`)
#   U2D2     under the Pi, between the drive pulleys (user, 2026-10-16)
components:
  battery:
    size: {value: [22.0, 58.0, 30.0], source: measured (58 x 30 x 22)}
    frame: {value: drive, source: design}
    # where it was (2026-10-11), on the case sides + 1; no tray (user: "just
    # a panel"), the straps through the holder's slits hold it
    at: {value: [0.0, 87.0, 45.75], source: design}
    mass: {value: 76.0, source: measured}
  ahrs:
    size: {value: [34.0, 12.6, 40.0], source: datasheet}
    frame: {value: drive, source: design}
    # ON ITS TABS (2026-10-16): the board's back face on the case sides' AHRS
    # tabs (cad_drive `ahrs:`, drive y 122.0), its lower edge on the face's
    # (-29.75); cad_bike_v2 refuses it anywhere else
    at: {value: [0.0, 128.6953, -9.75], source: design (= the drive's AHRS tabs)}
    mass: {value: null, source: GUESS (not weighed)}
  # power: the power board and the switch are drawn from `power:` below
  # (cad_power), in the bike frame, no longer as an envelope here
  pi:
    size: {value: [56.0, 20.0, 89.0], source: datasheet (the box the detail sits in; the ports 2 proud of the board's end)}
    frame: {value: drive, source: design}
    # ON THE PI CARRIER (2026-10-16 night; cad_pi_carrier refuses it
    # anywhere else): parallel to the front face as before, 2 further out
    # (was (0, 161, 0)) for the carrier's plate under it
    at: {value: [0.0, 163.0, 0.0], source: design (= pi_carrier)}
    mass: {value: 50.0, source: datasheet (approx.)}
  u2d2:
    size: {value: [18.0, 14.9, 48.0], source: measured (18 x 48 x 14.9)}
    frame: {value: drive, source: design}
    # UNDER THE PI, on its carrier (user: "the U2D2 underneath (skinnier,
    # fits between the drive pulleys)"): drive frame, its 48 along the
    # face (USB up, JSTs facing the drive at its lower end), its 14.9 out
    # of it, between the plate and the AHRS's housing.
    # Was steer frame (0, -22, 100), then parked behind the steering's rear
    # screw.
    at: {value: [0.0, 143.55, -23.25], source: design (= pi_carrier)}
    mass: {value: null, source: GUESS (not weighed)}

# The Pi 3B+ in detail, in its box's frame (x across, y the board's normal,
# z along it): the board with its four M2.5 holes, the USB + Ethernet block
# and the GPIO header, on the +y face. Numbers as v1's (bike_cad.yaml
# electronics.pi), USB/Ethernet end at +z (up the drive's slope, user
# 2026-10-05), the holes hole_inset from the other end.
pi:
  board: {value: [56.0, 85.0, 1.4], source: datasheet}       # x, along z, thick
  board_y: {value: -6.7, source: design}                     # its mid-plane in the box (box -10 + 2.6 of pins + 0.7)
  board_z: {value: -2.0, source: design}                     # its centre along the box: the ports' 2 at +z inside it
  holes: {value: [49.0, 58.0], source: datasheet}
  hole_inset: {value: 3.5, source: datasheet}
  hole_dia: {value: 2.75, source: datasheet}
  usb_block: {value: [53.0, 17.5, 16.0], source: datasheet}  # x, along z, height; ports 2 proud of the board's end
  gpio: {value: [5.0, 51.0, 8.5], source: datasheet}         # x, along z, height; 1 in from the +x edge, 7 from the hole end

# THE BATTERY / ELECTRONICS / SWITCH HOLDER (aow-bike-whole-v2-complete.md,
# "Electronics/battery/switch"; user, 2026-10-16 night: "instead of a case,
# it's just a panel (printed -X) with an overhang panel that goes around
# the XT30 connector and allows the power switch to be panel installed").
# ONE printed part on the LEFT, between the battery and the left rail, its
# +X face on the bed: the board on standoffs outboard of it, the shelf over
# the board's top edge (round the XT30, the switch in it), two 6-32 into the
# left rail fore and aft of the board, one strap round the battery. Slides
# in from the back + top (the drive's -Z; user, 2026-10-16 night: "so it
# can be removed independently from the pi+u2d2 carrier"). Read by
# aow_sim.cad_power, drawn by cad_bike_v2. DRIVE frame (x across, y along
# the belt, z off the case sides' top edges), mm.
power:
  # ---- the joints, house 6-32 turned round: the flat head in the rail's
  # outer face (|x| 20.6), the nut in the panel, the panel's ridge in the
  # rail's groove, open along the drive's +Z (the slide). Both on the LEFT
  # rail's ears only: AFT on the back ear in the rear arm's corner (drive
  # rail.carrier_joint; user: "rear ear can move further back ... inside
  # the arm"), FORE on the front ear (rail.carrier_front_joint); bike (y,
  # z), cad_power refuses them off the rail's.
  joints: {value: [[24.7134, 74.918], [69.2965, 107.4802]], source: design (user; = rail.carrier_joint, carrier_front_joint)}
  # The panel is only battery to rail (|x| 11.3..16), so each nut sits a
  # wall past the joint plane and a wall short of the battery side. The
  # screws CUT to length (user: "I can shorten the 6-32 screws"), the tip at
  # the nut's far face.
  nut_wall: {value: 1.0, source: design}
  screw_length: {value: 8.0, source: design (6-32 flat head cut down; user)}
  lug_wall: {value: 1.0, source: design}       # round the nuts' corners
  ridge: {value: [3.0, 7.0], source: design}   # toward the drive's -Z (closed), +Z of each head
  clearance: {value: 0.3, source: design}      # the panel's face off the battery's side
  # the panel's top over the board's front (the shelf's front end) drops
  # to front_top ahead of it, over the fore joint
  front_top: {value: 36.0, source: design}
  # THE STRAP (user, 2026-10-16 night: "should go near the power switch ...
  # literally go above and below the battery directly"): one, round the
  # battery: over its top and through a slit in the panel just over it,
  # under its bottom (the 2.25 between it and servo B's face, inside the
  # skirts) and out through a notch in the panel's bottom edge, then up the
  # panel's outer face, inside the switch's body. Drive y start, length,
  # width (the slit's and notch's height). Its start just ahead of the rear
  # arm at the case's top edge (76.2) + 0.5. It overlaps the wire gap
  # (86.9..97.5) by 9.8: the servo B wires come up under it. The strap
  # itself is the user's call (placeholder: 3/4 in).
  strap: {value: [76.7, 20.0, 3.0], source: design (3/4 in strap + 1)}
  # the shelf's two gussets (user: "a couple gussets so it's not fully
  # cantilevered (should just barely fit around the new strap holes)"):
  # thick (along y), tall at the panel; aft of the strap and the switch, and
  # ahead of the strap over the board's top edge
  gussets: {value: [1.6, 6.5], source: design}
  # the servo B wires come up through the left case side's top edge (drive
  # y 86.9..97.5) under the panel's bottom, and run forward under the
  # battery (user): a notch, past the gap's ends, up from the case's top
  wire_notch: {value: [0.5, 5.0], source: design}
  # ---- the power breakout board (user's build, 2026-10-16): perfboard on a
  # 0.1" grid, seen from the LEFT, front to the left in the drawing; the
  # components outboard (-x), the solder side in on standoffs.
  # BESIDE THE BATTERY, over the drive's back-top, SQUARE TO THE DRIVE (user:
  # "xt30 pointing up and back, other plugs point up and forward"): its top
  # edge the drive's +z, its front edge +y.
  board:
    size: {value: [26.5, 25.0, 1.6], source: measured (w along y, h, standard 1.6)}
    # the rear-bottom corner, DRIVE (y, z): its bottom cable_gap off the case
    # sides' top edge (user: "not fully slammed against the drive case"; the
    # servo cable goes under the battery, forward); far enough forward that
    # the switch aft of it clears the aft screw's head in side view
    # (y 95.2: the aft standoff 0.5 ahead of the strap's run; was 91)
    corner: {value: [95.2, 33.75], source: design}
    cable_gap: {value: 4.0, source: design}
    # the solder face 0.5 outboard of the rail's outer face (20.6)
    solder_x: {value: 21.1, source: design}
    standoff_dia: {value: 6.0, source: design}
    pitch: {value: 2.54, source: datasheet (0.1 in)}
    # from the rear-bottom corner (cut on the grid), in pitches: the screws
    # over grid point (2, 2) and 6 up
    holes: {value: [[2, 2], [2, 8]], source: measured (user; ~5 in, next 15.24 up)}
    hole_dia: {value: 2.9, source: GUESS (4-40 clearance)}
    pilot_dia: {value: 2.3, source: GUESS (4-40 self-tapping into the print)}
    components: {value: 11.0, source: measured (user; the regulator, tallest)}
    # XT30 out the top: on the three middle top pins of nine, half a pitch to
    # the rear; flush with the board's back face, 5.5 thick, 11 over the
    # board's top edge
    xt30: {value: [10.2, 5.5, 11.0, 3.0], source: measured (user; length along the edge GUESS, datasheet ~10)}  # along y, thick, above, below the top edge
    xt30_pin: {value: 4.5, source: measured (user; pin 5 of 9 less half a pitch)}  # centre, pitches from the rear edge
    xt30_clearance: {value: 0.3, source: design}   # round it, through the shelf
    # out the front: 5 V on the bottom two pins, the 3-pin JST on the 4th-6th
    front_rows: {value: [[1, 2], [4, 6]], source: measured (user)}
    header: {value: [5.0, 8.5], source: GUESS}    # along y from the front edge, height off the board
    plug_keepout: {value: [14.0, 16.0], source: GUESS (the front plugs' length, the XT30 plug's above)}
  # The power switch (v1's, bike_cad.yaml electronics.switch, user
  # 2026-09-30): 13 x 19.2-19.6 cutout, panel 0.75-3, 18.5 behind it. AFT of
  # the board (drive -y), panel-mounted in the shelf, its bezel's top flush
  # with the XT30's (user); the cutout's 13 across (x), 19.4 along y.
  switch:
    cutout: {value: [13.0, 19.4], source: measured}
    panel: {value: 2.0, source: design}
    depth: {value: 18.5, source: measured}
    bezel: {value: [15.0, 21.5, 2.0], source: GUESS}   # across, along y, proud
    gap: {value: 1.5, source: design}     # cutout to the board's rear edge (across, it is centred on the XT30)
    margin: {value: 1.5, source: design}  # shelf round the cutouts
    # its body's inner face off the panel's outer face: the strap runs up
    # between them (across, it was centred on the XT30, 1.35 off the panel)
    strap_room: {value: 2.5, source: design (a 2 mm strap + 0.5)}

# THE PI + U2D2 CARRIER, an OUTLINE (aow-bike-whole-v2-complete.md, "Pi +
# U2D2 carrier"): self-contained, not attached yet (user: undecided; likely
# a mounting arm shared with one more power-carrier side screw near the left
# drive pulley). Read by aow_sim.cad_pi_carrier. DRIVE frame, mm.
pi_carrier:
  plate_y0: {value: 151.0, source: design}     # its inner face, drive y: past the pulleys' rims (143.6)
  plate: {value: 2.0, source: design}
  margin: {value: 1.0, source: design}         # round the Pi's board and its standoffs
  pi_z: {value: 0.0, source: design}           # the Pi's box centre along the face
  pi_standoff: {value: [2.6, 5.5], source: GUESS (height under the board, dia)}
  pi_pilot_dia: {value: 2.2, source: GUESS (M2.5 self-tapping into the print)}
  # slid DOWN-FORWARD along the face (user, 2026-10-16 night: "over the
  # AHRS; the JST plug will sit in front of the AHRS (fully cleared)") until
  # its JSTs' keep-out, facing the drive at its lower end, is 0.5 past the
  # AHRS envelope's lower end (-29.75). Was 27.1 (slid up-back: the wrong
  # way). "If it seems too far, the AHRS could also move up-back" (user).
  u2d2_z: {value: -23.25, source: design}
  # the U2D2's cradle: two cheeks at mid-length (wall, depth, length); its
  # ends and the connectors there left open (which long side has its
  # connectors is not in this config yet)
  cradle: {value: [1.6, 5.0, 16.0], source: design}
  cradle_clearance: {value: 0.3, source: design}

