# THE STYLE BIT, 2026-10-17: rl_general_v3.yaml plus one command entry
# (docs/plans/wishlist.md, "pivots"; general_spec.wheel_err). Diff the two
# files; the changes are only these:
#
#   env.obs_style: true       obs 17 -> 20: style, sin/cos wheel_err
#   env.style_p: 0.5          drawn with every command, on with p 0.5 x the
#                             curriculum difficulty -- ACTIVE only at a zero
#                             speed command (a hold or an in-place turn)
#   reward.w_style: 0.75      while active: + w_style x exp(-(e/sigma)^2),
#   reward.sigma_style_deg 25 e the front wheel's world heading minus where
#                             it was when the bit came on (mod 360)
#
# WHY ONLY AT ZERO SPEED. The front wheel rolls only along its own heading,
# so sustained travel goes along it: a held wheel and a velocity command
# along another line cannot both be met (90 deg + forward is impossible,
# not hard). At a hold or an in-place turn everything asked is possible.
#
# WHY AN ANGLE. A rate ("a still wheel") costs at most w_style a step, so
# its price grows with how LONG the wheel moves, not how far: one fast
# steered flick paid ~0.6 s of it and nothing after. The angle charges a
# steered turn for as long as the wheel stays turned.
#
# THE NUMBERS, chosen against the rest of the reward, not swept:
#   w_style 0.75 < w_head 1.0   so the bit never outbids the turn itself:
#                               refusing to turn keeps the style term and
#                               loses up to 1.0 a step of heading
#   the margin                  steered spins reach heading in 0.5-0.9 s
#                               (+-90) and 1.5-1.9 s (the big turns; move
#                               metrics, fixes_72M and v3_s1) of a 2-6 s
#                               command, leaving ~150 steps. A steered spin
#                               then forfeits ~110 (0.75 x 150); a pivot 1 s
#                               slower loses ~50 of heading. At 0.5 the gap
#                               was ~25, which a few percent of fall risk on
#                               a new move erases (a fall is 50 + the rest of
#                               the episode)
#   sigma 25 deg                as sigma_psi: "held" as tight as "on heading"
#   style_p 0.5                 even on/off among the eligible commands; at
#                               difficulty 1 ~10 % of all commands are
#                               in-place turns with the bit on
#   a bonus, not a penalty      a penalty-only reward makes falling early
#                               rational (see below)
#
# Baseline, bit off (2026-10-17, tm151_filter tau 2.0, eval seeds): no
# current policy pivots. On all five in-place spins the front wheel turns
# 0.92-1.05 deg per deg of chassis yaw (fixes_72M, fixes_52M, seed1_72M,
# v3_s0, v3_s1; per_command --summary).
#
# --- rl_general_v3.yaml from here, its own header kept ---
#
# THE NEXT GENERAL RUN, 2026-10-14: rl_general_smooth_temporal.yaml (the
# teleop pointer's recipe) on TODAY'S PLANT, five seeds, one setting. Diff the
# two files; the changes are only these:
#
#   env.righting_rigid: true     the V3 module's mass, inertia and contacts,
#                                welded at stow, no crank servo (~12 % less
#                                per update on the box). Teleop and the bike
#                                fly it jointed, held at stow by its servo.
#   init_roll_deg 2 -> 10        the current pointer (trained at +-2) already
#                                catches 0-12 deg from rest, 13/14 at 12-16,
#                                6/10 at 16-20, 0/41 past 20 (one probe, 4 s
#                                hold, the V3 bike, 2026-10-14). 10 (user):
#                                inside what it already catches.
#   init_yaw_deg, init_pos_m,    0. Yaw and position did nothing (the obs and
#   init_vel                     commands are relative to the start); velocity
#                                was +-5 cm/s and +-3 deg/s on all six axes, a
#                                jolt the stationary bike never gets.
#   disturb_prob 0               the random 0-2 N, 20 ms sideways pushes off.
#
# The plant moved under it since the pointer trained (10-01, 9953690d): the
# measured front wheel (10-05), the righting module (V2 10-09, V3 10-14),
# no ball (10-13), the AHRS at tm151_filter. plant_digest bc66ca20.
#
# Drive-side friction / drive supply randomisation: deliberately NOT here yet,
# pending a look in teleop (`--drive-friction 0.16:0.21`).
#
# Five seeds: config/queue_general_v3.txt.

algo:
  smooth: {bound: 0.1, temporal: 0.04}   # src/aow_sim/smooth_ppo.py
  algorithm: PPO
  total_timesteps: 20000000   # a general controller is a bigger task than a
                              #   single move; expect to need the full budget
  n_envs: 32    # was 8
  learning_rate: 3.0e-4
  n_steps: 512 # was 2048  -> 32 x 512 = 16384, unchanged
  batch_size: 1024
  n_epochs: 10
  # gamma at 50 Hz: 1/(1-g) = 100 steps = 2.0 s of lookahead, which matches
  # the timescale of a heading change. THE MOVES' 0.99 AT 200 Hz IS ONLY
  # 0.5 s — far too myopic here; they get away with it because their reward
  # is a dense per-step yaw-progress term rather than setpoint tracking.
  # If control_rate_hz is raised back to 200, gamma must go to ~0.998.
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005        # ball_rl's lesson: 0.0 collapsed exploration
  net_arch: [128, 128]
  seed: 0                # the queue passes --seed 0..4
  eval_every: 1000000     # BestByScore cadence [timesteps]

env:
  # The detailed drivetrain (XC430 firmware loop, the 7.5 deg diff detent,
  # roller slop) at P 100, as rl_general_drivetrain_p100.yaml -- but
  # WITHOUT that file's actuator_frac 0.0: battery-voltage strength
  # randomization stays at this config's 0.15. The detent phase is
  # re-drawn on every reset (drivetrain_model.DrivetrainSim.reset).
  drivetrain_model: true
  righting_rigid: true   # the module's mass without its dynamics (see header)
  servo_gains: [100, 1920]
  action_space: full
  # 50 Hz, not the moves' 200 Hz: standard for locomotion RL, and it makes a
  # 2.5 s maneuver 125 steps instead of 500 — far better credit assignment.
  # Replay is ZOH at this rate, so the controller holds each action 4 physics
  # ticks longer than a move does.
  # The one change from rl_general_smooth_diff.yaml.
  obs_odometry: true
  odometry_mode: front   # what the Pi runs today; `blend` is the experiment
  # The two changes from rl_general_odo.yaml.
  odometry_encoder: counts   # 4096 counts/rev, differenced, 25 ms RateFilter
  # The steer RATE (obs[5]) the way the Pi forms it: steer servo counts,
  # differenced per 100 Hz tick, the same RateFilter -- ~8 ms the exact joint
  # velocity does not have. `joint` (absent) is what every policy before
  # 2026-10-17 trained on; the bench sawed the steer at 5.2 Hz flying one of
  # them on the Pi's signal (analysis/policy/steer_pinned.py, sim_odometry.SimSteerRate).
  steer_rate_encoder: counts
  ahrs_level: tm151_filter   # the TM151 as its own fusion filter (c6d37b3 weighting); was tm151 to 10-09
  ahrs_tau_s: 2.0            # the level's own: the filter has its 0.19 built in; this only times its 0.1 deg residual
  obs_pitch: true            # in the state; no w_pitch penalty this run.
  obs_style: true            # THE STYLE BIT (see the header)
  style_p: 0.5               # P(on) per command = style_p x difficulty; zero speed only
  control_rate_hz: 50
  max_episode_s: 15.0    # long: the policy must hold a command, not finish one
  v_max: 1.2             # matches control.drive.v_max in bike_params.yaml
  v_lat_frac: 0.0        # DROPPED -- see rl_general_smooth_base.yaml's header. Crab stays in the eval.
  p_v_zero: 0.2          # unread under cmd_families; the families own the mix
  resample_s: [2.0, 6.0] # >= one discount horizon (2.0 s at gamma .99, 50 Hz)

  # The command mix, explicit. Weights are shares of whatever `hold` leaves,
  # each ramped in linearly over its own [onset, full] window; before any has
  # opened, hold takes everything. Resulting mix, measured:
  #
  #     d      hold  in-place  straight  moving turn     mean|v|  mean|step|
  #   0.00     40.0%      0.0%     60.0%         0.0%    0.22 m/s        --
  #   0.20     25.4%     15.1%     59.5%         0.0%    0.33 m/s    30 deg
  #   0.50     13.9%     23.0%     35.2%        27.9%    0.51 m/s    64 deg
  #   1.00     10.0%     20.2%     30.1%        39.7%    0.81 m/s   120 deg
  #
  # against the eval grid's 6 / 31 / 19 / 44. Close, and deliberately not
  # equal: the grid is a DISCRIMINATOR chosen to separate policies, not a
  # model of what an operator does.
  cmd_families:
    hold_min: 0.10       # floor, reached as d -> 1
    hold_max: 0.40       # SHARE AT d=0. Arm 1 used 1.0 -- see rl_general_smooth_base.yaml's header.
    hold_decay: 3.0      # p_hold = min + (max-min)*(1-d)^decay
    # full <= onset means "open at full weight from step 0": there must be a
    # forward/reverse command in the mix before the gate can be cleared.
    straight:      {onset: 0.00, full: 0.00, weight: 1.5}
    turn_in_place: {onset: 0.05, full: 0.45, weight: 1.0}
    moving_turn:   {onset: 0.20, full: 0.70, weight: 2.0}
  cmd_v_lo: 0.1          # [m/s] floor on a non-zero speed command
  cmd_step_lo_deg: 10.0  # floor on a non-zero heading step
  cmd_v_exponent: 1.0    # density ~ |x|^k on [lo, hi]; 1.0 = linear
  cmd_step_exponent: 1.0
  ball_prob: 0.0         # fraction of episodes with a ball parked nearby --
                         #   contact robustness only, NO ball reward.
                         #   0.0 builds NO ball and NO hockey-stick panels
                         #   (2 x 20 g on the chassis): the model every eval,
                         #   teleop and the bike use. >0 builds both into
                         #   EVERY episode, the ball parked far off when not
                         #   placed -- a floor contact and 6 dof each step
                         #   (~4% of an env step, measured 2026-10-13).
  ball_place_radius: 0.5 # ball dropped within this radius of the start pose
  action_bounds:
    steer_rate_max: 8.0
    hub_max: 1.4         # v_max 1.2 + margin (moves cap at 0.6-0.72 because
                         #   they are standstill maneuvers)
    diff_max: 40.0

curriculum:              # the repo's first; a single scalar scaling the
  enabled: true          #   command sampling ranges in _sample_command
  start: 0.0             # 0, not 0.15: difficulty 0 is now a PURE HOLD stage
                         #   rather than a slow-and-gentle one
  step: 0.02             # advance per episode that clears advance_score
  advance_score: 0.6     # mean of (vel + heading) tracking rewards, in [0,1]

reward:
  # Bounded-POSITIVE tracking + alive bonus. Over a 15 s episode a
  # penalty-only reward (the moves' form) makes falling early strictly
  # rational; this removes that incentive.
  w_vel: 1.5             # x exp(-|v_cmd - v|^2 / sigma_v^2)
  w_head: 1.0            # x exp(-(psi_err/sigma_psi)^2)
  w_alive: 0.5
  sigma_v: 0.35          # [m/s] tracking tolerance scale
  sigma_psi_deg: 25.0    # heading tolerance scale
  w_upright: 0.5
  w_effort: 0.001
  # [steer_rate, hub, diff]. One number here would price all three alike
  # (the historical form); the list is what lets `diff` be asked a separate
  # question -- see rl_general_smooth_base.yaml's header. All three equal == the scalar form exactly.
  w_smooth: [0.05, 0.05, 0.25]
  penalty_fall: 50.0
  w_style: 0.75          # while the style bit is active (see the header)
  sigma_style_deg: 25.0  # front wheel's heading error from its latch
  fall_roll_deg: 60

randomization:           # as rl_flick/rl_pivot
  enabled: true
  init_roll_deg: 10.0    # was 2.0; see the header
  init_yaw_deg: 0.0      # was 5.0: invisible to the policy
  init_pos_m: 0.0        # was 0.02: invisible to the policy
  init_vel: 0.0          # was 0.05 on every qvel axis: a jolt from rest
  mass_frac: 0.15        # was 0.1. The as-built payload mass (battery + Pi +
                         #   U2D2 + buck, ~190 g of a 1.02 kg bike) is a GUESS
                         #   until the thing is weighed, and it is a bigger
                         #   share of the total than anything else unmeasured.
  friction_frac: 0.2
  # Supply voltage. The model's servo numbers are the 12 V datasheet column,
  # but a 3S pack spans 12.6 V (full) to 9.9 V (cutoff) -> ~0.83-1.05x nominal
  # strength. 0.15 covers that window with margin. Scales ctrlrange AND
  # forcerange from a single draw (speed and torque both go with voltage) --
  # see control/randomize.py. Untethered transfer depends on this.
  actuator_frac: 0.15
  disturb_force_N: 2.0
  disturb_prob: 0.0      # was 0.01: pushes off for now
