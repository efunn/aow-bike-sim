  # Goal current for CURRENT-BASED POSITION MODE, as the torque it corresponds
  # to at the servo. The only throttle on the stroke -- there is no commanded
  # trajectory -- so it is the most consequential number in this file.
  #
  # It is a WINDOW, not a minimum, and that is the thing to understand before
  # touching it. Too little cannot lift the bike; too much throws it clean past
  # upright, because the four-bar's self-limiting only bleeds off so much and
  # the shortened wing has little inertia to absorb the rest. Measured over the
  # eight-fall set in MuJoCo:
  #     0.34 -> 1/8    0.38..0.50 -> 8/8    0.54 -> 7/8    0.62 -> 0/8
  # 0.44 is the middle of that window, deliberately, rather than the edge.
  #
  # This differs from the geared pair, where more torque is simply more margin.
  # Re-measure the window after ANY change to wing length, mass or contact --
  # it moved once already when the wing was shortened (the old geometry wanted
  # 0.66, which now fails outright).
  goal_current_nm: 0.44
