# The floor rig, as a MuJoCo model: the FULL bike (whatever build_model builds
# today) hung from a yaw -> tilt -> roll -> pitch chain instead of a freejoint.
#
#   python -m aow_sim.floor_rig --png runs/floor_rig_smoke.png   # render a look
#   mjpython -m aow_sim.floor_rig --view                         # interactive
#
# Plan: docs/plans/pre-assembly-bench-checklist.md, "Rig 1 -- the floor arm".
#
# PLACEHOLDER PHYSICS by default: every rig part is massless (1 mg, the
# smallest MuJoCo accepts on a moving body) and every joint is perfect -- no
# friction, no damping, no play. `link_mass_g`, `friction` and `damping` below
# are the knobs; every value there is a GUESS until the rig is built and
# weighed, and its joints commissioned (C4 hinge repeatability, C7 yaw drag).
#
# Frame: the bike's world frame. Rear contact at the origin, +x forward, z up,
# floor at z = 0. Front contact at (wheelbase, 0, 0).

# Each joint: `free`, or `locked` (the joint is simply not created, so it is
# perfectly rigid). Tilt locked + rear wheel alone = fixed-height support, the
# pitch motor then sets the rear load ("fake weight"). Tilt free = the arm
# carries no vertical force and both contacts carry the weight.
# Slide: fore/aft along the arm. Locked, the bike cannot roll forward or back
# and a forward command only scrubs the wheels -- which also takes away
# balancing by steering, since that needs the wheels to roll.
joints:
  yaw: free
  tilt: free
  slide: free
  roll: free
  pitch: free

# Slide end stops, [back, forward] in m from the start; null = unlimited.
# 200 mm of travel (was +-0.06). The roll bearing starts 210 mm behind the yaw
# axis, so at the forward stop it is 110 mm from it -- just clear of the 89 mm
# base disc; more forward travel wants a larger yaw_distance_m. A hold-station
# policy drifts forward 100-600 mm in 8 s here (2026-09-25), so expect it to
# meet the forward stop -- where driving into it wheelies the bike to its
# pitch limit (see the plan's front-hop notes).
slide_range_m: [-0.10, 0.10]

# Roll stops: two skids on the roll member that REALLY touch the floor, so a
# fall ends on a skid instead of the bike rolling on through the floor.
# `deg` is the roll angle at which they land (training episodes end at 60).
roll_stop:
  deg: 45
  limit_margin_deg: 10      # roll joint limit this far past the landing angle
  halfspan_m: 0.10          # skid centres, either side of the roll axis
  radius_m: 0.01

# Rig motor torques [N m], held every step AFTER the bike's controller (which
# owns the rest of ctrl). Clipped to the motors' +-stall. Scaffolding: a mode
# sets these; nothing drives them from the keyboard yet.
motors:
  roll: 0.0
  pitch: 0.0

# Link masses [g], lumped at each link's centre (floor_rig.add_chain says
# where). 0 = massless. Everything past the tilt axis is carried by the BIKE
# through the pitch pivot, so this is load on the bike, not only inertia. Yaw
# has no entry: a mass on the vertical axis changes nothing.
link_mass_g:
  tilt: 0         # the arm and its rail
  slide: 0        # carriage, drop post, roll servo case
  roll: 0         # roll frame, skids, pitch servo case
  pitch: 0        # the stubs

# Joint Coulomb friction (MuJoCo frictionloss): N m on the hinges, N on the
# slide. 0 = frictionless.
friction:
  yaw: 0
  tilt: 0
  slide: 0
  roll: 0
  pitch: 0

# Joint viscous damping: N m s/rad on the hinges, N s/m on the slide.
damping:
  yaw: 0
  tilt: 0
  slide: 0
  roll: 0
  pitch: 0

# XC330s in CURRENT-BASED POSITION MODE (righting_servo.py) holding an axis at
# its reference -- roll upright, pitch level. Goal Current in counts (~1 mA
# each), `max` = the Current Limit (910), `fixed` = the Current Limit AND
# Position P Gain at its register top (16383). null = no servo (the axis is
# free, or driven by `motors:`). Goal Current only CAPS the torque; below the
# cap the stiffness is the P gain's -- at the righting gains `max` leans 1.2 deg
# under a 1 N side push and gives way at 3 N, `fixed` holds 0.35 deg (measured
# 2026-09-25, in sim under the old law). The torque is linear in current
# above a ~16.5 mA drive edge, as the X330 fixture measured it: 100 counts
# ~0.07 N m of motor torque at stall, 300 ~0.24, max (910) ~0.74 -- see
# righting_servo.py. Direct drive; the servo's gearbox friction is its own,
# measured, load-proportional and added while a servo is attached
# (gearbox_friction.py); its reflected rotor inertia is NOT modelled.
servos:
  roll: null
  pitch: null
# Position P/D Gain registers; omitted = the bike's own righting gains
# (control.onboard.gains.righting).
servo_gains: {}

# The general policy's heading command on the rig (teleop). `hold`: where the
# dial put it -- the policy fights to swing the arm back to it. `follow`:
# re-aimed at the bike's own heading every step, so the policy never tries to
# hold heading. Measured 2026-09-25, curriculum2b, 12 s hold, 2 runs each:
# hold FELL (3.1, 4.8 s), follow held. `--rig-heading` overrides.
heading: hold

# Named presets for `--rig-mode NAME`. Each may override `joints`, `motors`
# or any top-level key; `--rig-lock` / `--rig-free` apply on top.
modes:
  free: {}
  no_slide:                 # the bike cannot roll fore/aft (policies fall)
    joints: {slide: locked}
  fake_weight:              # rear wheel on a fixed-height support: the pitch
    joints: {tilt: locked}  #   motor sets the rear load
    motors: {pitch: 0.2}
  pinned_yaw:               # heading held by the rig
    joints: {yaw: locked}
  stiff_roll:               # roll held upright by an XC330 at 300 counts,
    servos: {roll: 300}     #   the righting gains: compliant (sim, measured
                            #   law: 7 deg under a 0.3 N side push, gives way
                            #   at 0.6 N)
  fixed_roll:               # Current Limit and top P gain: rigid to ~0.74 N m
    servos: {roll: fixed}
  guessed_mass:             # a first GUESS at a built rig: 135 g, a little
    link_mass_g: {tilt: 30, slide: 45, roll: 55, pitch: 5}    # friction too
    friction: {yaw: 0.002, tilt: 0.002, slide: 0.3, roll: 0.02, pitch: 0.02}

# Hinge ranges, [min, max] in degrees; null = unlimited. The head's tilt
# travel in particular must be limited: unlimited, a driven bike levers the arm
# over the head. Yaw: the physical 180 deg workspace would be [-90, 90].
yaw_range_deg: null
tilt_range_deg: [-15, 15]
pitch_range_deg: [-30, 30]

yaw_distance_m: 0.50        # yaw axis, ahead of the rear contact
tilt_height_m: 0.10         # tilt axis (the head), above the floor at the yaw axis
roll_height_m: 0.0          # roll axis above the floor, on the line through both
                            #   contacts -- 0 is the ideal the eggbeater approximates
# The actuated pitch axis, at a FAKE CoG. `com` = the bike's own CoG at the
# reference pose, recomputed on every build so a bike change moves it too.
# Or [ahead_m, up_m] to place it by hand.
fake_cog: com

# Each rig joint gets this fraction of the BIKE'S OWN inertia about that axis
# as armature (no mass, no weight). Below ~1 % every constraint that closes
# through the rig -- the weld, a stop, a locked joint -- goes soft and yields
# (see floor_rig.RIG_ARMATURE). The cost is 1 % extra inertia per axis.
armature_frac: 0.01

# Torque motors on the instrumented axes: placeholder XC330s, +-stall_torque
# (servos.xc330_t181) with no servo model behind them yet.
actuators:
  roll: true
  pitch: true

# Visual only -- no mass, no contact.
front_support_ahead_m: 0.09 # roll bearing, this far ahead of the front contact
yoke_half_width_m: 0.07     # roll yoke / pitch stubs, either side of the bike
