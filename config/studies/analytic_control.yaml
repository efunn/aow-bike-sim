# THE ANALYTIC CONTROLLERS' SETTINGS: the PD cascade (legacy), the LQR
# (deprecated 2026-10-09; never drove the bike), its line/circle drive, and
# the scripted flip and pivot. Moved out of bike_params.yaml 2026-10-21:
# none of it is the bike, and no policy reads it. params.load_params()
# merges it back in under `control`, so the old paths still resolve.
# design_digest still hashes control.rate_hz, lqr and drive.speed_grid.

control:
  pd:                   # PD cascade (rear crawl only, steer held straight)
    roll_kp: 6.0        # lateral contact velocity [m/s] per rad of roll
    roll_kd: 1.2        # ... per rad/s of roll rate
    y_kp: 0.35          # roll setpoint [rad] per meter of lateral drift
    y_kd: 0.12          # ... per m/s of lateral velocity
    max_roll_setpoint_deg: 3.0
    x_kp: 8.0           # common-mode input [rad/s] per meter of fore/aft drift
  lqr:                  # weights for the DLQR on the identified lateral model
    q_ypos: 3.0
    q_yvel: 0.2
    q_roll: 60.0
    # 30, was 6.0 (2026-08-22). The old value had no recorded rationale --
    # unlike q_yaw/q_yaw_rate and r_drive below, it was a bare number from the
    # original tuning, against a plant that had NO actuator dynamics at all.
    #
    # The velocity-PI drive servo added an integrator to the actuator, i.e. a
    # pole at the origin and 90 deg of phase the 8-state lateral model does not
    # represent. At 6.0 the LQR cannot hold the bike at standstill; at 30 it
    # holds at 1.15 deg peak roll. Isolated: the DROOP alone (drive_kv 0.016,
    # drive_ki 0) is fine at 6.0 -- it is specifically the integral term.
    #
    # DE-TUNING DOES NOT FIX IT. r_drive was swept 0.05 -> 5000 (a 100000x
    # range) and it falls at every value, so this is not about control
    # authority or aggressiveness; it is the SHAPE of the feedback, and only
    # the rate weight supplies the missing damping.
    #
    # 30 is the knee, measured over an 8 s stationary hold:
    #     q_roll_rate    rim travel   reversals/s   peak roll
    #       6, 15        FELL
    #      30            0.014 m         71          1.15 deg
    #      60            0.019           99          1.13
    #     150            0.021          151          1.14
    #     300            0.033          311          1.39
    # Past 30 the reversal rate climbs steeply and buys nothing -- that is the
    # rate weight chasing noise. 14 mm of rim over 8 s is nothing; the RL
    # policies run 2-5 METRES over 15 s.
    q_roll_rate: 30.0
    q_yaw: 8.0          # LIGHT-ish: heading swings are intrinsic to crawl recovery;
    q_yaw_rate: 12.0    #   damp rotation (rate) over position. Heavy q_yaw (>~15)
    # 5.0, was 0.5 (2026-08-22). The old value let the LQR command more steer
    # than `steer_limit_deg` allows, so the steer angle sat pinned at the clamp
    # 86% of the time -- bang-banging between +-15.7 deg rather than steering.
    # Roll followed at ~1 deg while YAW ratcheted away (1.6 -> -16.6 deg over
    # 11 s) because the bang-bang is not symmetric, and the bike went over at
    # ~13.7 s. That reads as a slow oscillation and is really a saturated
    # actuator.
    #
    # The clamp exists to keep steering inside the region the model was
    # identified in, so sitting on it means the design is running outside its
    # own assumptions. Pricing the steer ANGLE pulls the command back inside
    # rather than weakening the loop:
    #     q_steer   saturated   peak roll   40 s hold
    #       0.5        86%        60 deg    FELL at 13.7 s
    #       2.0        67%        1.17      held
    #       5.0        31%        1.17      held
    #       8.0        15%        2.14      held
    #      12.0         1%        6.74      held
    # 5.0 is the best roll available and cuts saturation from 86% to 31%.
    # Raising r_steer instead also works (60.0 gives 2% saturation) but costs
    # roll -- 4.0 deg against 1.17 -- because it weakens the whole loop rather
    # than just the part that was asking for too much.
    #
    # THE TABLE ABOVE NO LONGER HOLDS (re-measured 2026-09-22, same 3 deg tilt,
    # 40 s hold). Saturation is now 73-97% for EVERY q_steer 5-40 x r_steer
    # 6/20, and rises with q_steer. The standstill steer row asks for ~50 rad
    # per rad of roll and ~45 per m/s of v_lat, i.e. 40-90 deg of steer for
    # sub-degree roll -- 3-6x the clamp -- so the steer runs as a +-15 deg
    # relay (4 sign changes/s) and holds at 0.85 deg tail roll RMS anyway.
    # Weights cannot fix that; it is the design, not the tuning.
    q_steer: 5.0        #   rings against the steer clamp; 8/12 also tracks pivots.
    # q_steer for the standstill (v = 0) design only; the gain schedule fades
    # it out by 0.25 m/s. Added for the 2026-10-05 front wheel
    # (docs/plans/lqr-baseline.md).
    q_steer_standstill: 50.0
    r_drive: 0.05       # balance of authority vs. saturation margin on pushes
    # 20.0, was 6.0 (2026-09-22). `pytest -m lqr` 8 -> 6 red, nothing new red
    # (pivot[180] and reverse_circle clear); 40 s hold unchanged (0.83 vs 0.85
    # deg tail RMS). It does NOT unpin the clamp at standstill (75.5%); at
    # 0.3 m/s it does (100% -> 13%). Tried 30 (pivot[-90] goes red) and 60
    # (three wound-steer balance tests go red).
    r_steer: 20.0
    steer_limit_deg: 15.0   # keep steering inside the identified linear region
    # The two drive-servo states (linearize.STATE_NAMES), added 2026-09-22.
    # Light on purpose: they are there so the design can SEE the crawl it has
    # commanded, not to be regulated. Standstill hold, swing-linkage bike,
    # truth attitude: steer 9.5 -> 0.05 deg RMS, pinned 99% -> 0%.
    q_crawl_rate: 0.01  # differential shaft speed [rad/s]
    q_crawl_lag: 0.01   # differential servo lag [rad]
    # crawl_lag FORGETS with this time constant (balance.CrawlSensor). A
    # deliberate steady crawl -- pivot, arc turn -- holds a constant servo lag
    # that a pure integral reads as error, so turns under-rotated ~25% (pivot
    # err -22 deg on 90). pytest -m lqr reds, and teleop's sensors at rest
    # (swing linkage, TM151 + odometry, 3 seeds x 20 s):
    #     tau      lqr reds        teleop at rest
    #     none        11           (not run)
    #     0.05         2           falls 3.3 / 10.5 / 3.3 s
    #     0.2          2           held x3
    #     0.5          4           (not run)
    crawl_lag_tau_s: 0.2
  drive:                # line/circle driving on the gain-scheduled LQR
    accel: 1.5          # m/s^2 speed-profile limit; harness sweep finds true max
    speed_grid: [0.0, 0.25, 0.5, 0.8, 1.2]   # mirrored to negatives at design
    speed_kp: 4.0       # common-mode speed loop gain [rad/s per m/s]
    steer_ff_gain: 1.0  # kinematic steer feedforward scale (circle mode)
    lean_ff: 0.85       # centripetal lean feedforward; <1 because the crowned
                        #   tire's contact shifts into the turn (ideal formula over-leans)
    ki_lat: 0.05        # slow integral lean-trim on cross-track error [rad/(m s)];
    int_limit_deg: 5.0  #   mops residual radius bias; higher values hunt
    yaw_slew: 1.5       # rad/s heading slew for low-speed (arc-mode) turns
    yaw_accel: 4.0      # rad/s^2 slew ramp (trapezoid, like the pivot profile)
    # At-speed sharp turns (feedforward-carried, circle-mode structure):
    steer_ff_max_deg: 45.0   # feedforward steer ceiling; feedback stays +-steer_limit around it
    turn_rate_margin: 0.7    # fraction of the kinematic ceiling v*tan(ff_max)/L used
    yaw_slew_sharp: 3.0      # rad/s absolute ceiling for at-speed turns
    reverse_turn_scale: 1.0  # extra cap factor for v < 0 (tune down if reverse validates worse)
    # Reverse keep-out band: cruise diverges in [-0.88,-0.78] (slow caster/
    # weave coalescence; no gain choice stabilizes it at our authority), and
    # *turning* is unreliable across (-1.15,-0.72) — only the identified grid
    # speeds outside it turn cleanly. Speed targets inside snap to the edges;
    # transiting during ramps is fine. Location depends on steering stiffness
    # -> recalibrate on hardware; stage-2 turning-equilibrium ID would shrink it.
    reverse_avoid_band: [-1.2, -0.72]
  flip:                 # 180-degree swap-ends about the midline (standstill<->standstill)
    # DEPRECATED 2026-09-21 (DriveController.command_flip): an early LQR-handoff
    # manoeuvre, tuned against the July 2026 plant; falls on the current one.
    # Realization: pre-steer the front to ~90 deg (frees it to roll laterally so
    # the bike can rotate about the midline, not the front contact), hold while
    # the rear crawls the spin, then unwind. See the decisions doc: exact
    # center-spin is a delta=90 kinematic singularity, so this bulges out to
    # ~1 wheelbase mid-spin and the hub loop reels the center back by the end.
    # Tight-throughout (<=0.5 L) needs trajectory optimization (deferred).
    yaw_accel: 4.0      # rad/s^2 yaw-rate trapezoid ramp
    yaw_rate: 1.0       # rad/s cruise yaw rate (higher = faster, looser)
    pre_steer_time: 0.7 # s to wind the front to hold_deg before spinning
    hold_deg: 90.0      # front angle held during the spin (frees the front)
    steer_rate: 8.0     # rad/s cap on the scripted steer slew
    hub_kp: 12.0        # longitudinal center-error loop [rad/s per m] (re-centers)
  pivot:                # crawl pivot about the front contact
    yaw_rate: 1.5       # rad/s cruise (crawl ceiling ~4 rad/s; balance-limited)
    yaw_accel: 4.0      # rad/s^2 profile ramp
    lean_ff: 1.0        # centripetal lean feedforward gain (0 disables)
    ff_gain: 1.0        # crawl feedforward scale (vs. kinematic)
