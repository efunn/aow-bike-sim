# THE SELF-RIGHTING STUDIES' MECHANISMS: the roof, bumpers, single arm and
# wing pairs that were never built, and the bike_width / bike_height drivers
# params.derive_righting() sizes them from. The bike's own righting module
# and rollcage stay in bike_params.yaml. Moved out of it 2026-10-21;
# params.load_params() merges this back in under `righting`, so
# build_model(righting= / wings= / linkage= / swing=) and
# analysis/mechanism/ run as before. None of it is in plant_digest.

righting:
  # THE BIKE'S RIGHTING MODULE is `module` in bike_params.yaml (2026-10-09):
  # the V2 diamond four-bar with its blades, what is going on the bike, and
  # what build_model builds BY DEFAULT. Everything in this file is the older
  # self-righting STUDY (build_model(..., righting=True) / wings= / linkage= / swing=; see
  # docs/plans/self-righting.md): mechanisms that were never built, kept so the
  # studies still run. Each of those flags builds its own mechanism INSTEAD of
  # the module. Their dimensions are `design` in the "record the intent" sense,
  # not the "we chose this" sense. The roof (below) is shared: the module keeps
  # it, the bumpers it does not.
  #
  # righting=True (the STUDY flag; the default bike does neither -- its
  # chassis lumps stay inertia only inside the rollcage) does two things
  # regardless of the sub-blocks:
  #   1. makes the chassis lumps (frame box, servos, AHRS, payload) COLLIDABLE,
  #      so a fall comes to rest on the parts that would really touch the floor
  #      instead of sinking through them, and
  #   2. adds whatever of `roof` / `bumper` / `arm` is present below.
  #
  # TWO ALTERNATIVE MECHANISMS live here, `arm` and `wings`, and they are never
  # built into the same model: build_model(righting=True) gives the single arm,
  # build_model(righting=True, wings=True) swaps it for the wing pair. Keeping
  # them exclusive is not tidiness -- the arm's mass and geometry would pollute
  # every wing torque and rest-attitude reading, and the whole point of the
  # tools in analysis/mechanism/self_righting.py is that the two sets of numbers are
  # comparable. `bumper` is shared by both.
  #
  # Frame for z: metres above the REAR AXLE, like every other chassis-frame
  # position in this file (the axle sits 51.2 mm off the floor when upright).
  #
  # ------------------------------------------------------------------
  # THE TWO DRIVERS. The roof and the stowed wings are one envelope, not two
  # parts that happen to clear each other: the roof is the circle that
  # circumscribes the stowed wing tips. Set the envelope here and
  # params.derive_righting() computes the four dimensions that follow --
  #     roof.radius, roof.height, wings.crank_length, wings.length
  # -- so the tips sit exactly ON the roof surface. Upside down they are then
  # tangent to the rolling envelope and cannot prop the bike up, which is the
  # failure that left it stuck at 154 deg before (part 5 of self-righting.md).
  # Enforced by construction, not rediscovered by sweeping.
  #
  # Both are a metre-stick measurement of the finished bike, which is the
  # point: they are the numbers to hand a CAD model or check on the bench.
  bike_width: {value: 0.120, source: design}   # wing tip to wing tip, stowed
                                               #   = the roof DIAMETER
  bike_height: {value: 0.165, source: design}  # top of the roof above the rear
                                               #   axle (216 mm off the floor)
  roof:
    # A ridge over the top of the bike, so it cannot come to rest INVERTED.
    #
    # Why it is needed even though the bare bike already "passes": statically
    # the inverted shelf past 150 deg is only 2.69 mm of CoM height, which at
    # 1016 g is ~27 mJ -- and falls arrive at the floor with 75-300 mJ. So the
    # bare bike drains back onto its side in the roll-plane landscape and still
    # ends up on its back in real falls once any side geometry gives it a
    # fulcrum (measured: 2 of 8 falls at 147 and 180 deg with an early wing).
    # It is also reachable on purpose -- reverse at speed, then a 180 flip.
    #
    # Right now the thing defining the top of the bike is the AHRS: a flat-
    # topped 30x30x12 box at z = 0.136, the highest lump on the vehicle and
    # what actually touches at 180 deg. The roof replaces that plateau with a
    # surface that has no facet to sit on.
    #
    # Shape: a CAPSULE along +X. Round in the roll plane (so an inverted bike
    # rolls off it rather than balancing), with hemispherical ends supplying
    # the fore/aft doming for free. "Mostly ridge, a bit of egg" without
    # needing a mesh -- upgrade to a revolved mesh only if the sweep says the
    # cross-section matters.
    #
    # Mass is a SHELL, not a lump: 30 g at the top of the bike raises the CoM
    # from 124.3 to 126.2 mm (+1.9 mm), which is the price of admission. Do not
    # let it become somewhere to mount things -- every gram here is at the
    # worst possible height (see the CoG breakdown in self-righting.md).
    x_start: {value: 0.020, source: design}
    x_end: {value: 0.165, source: design}   # spans ahrs (x=0.05) to steer (0.16)
    # 40 mm, not 30, and the cliff between them is sharp. At 30 mm an inverted
    # bike rolls off 180 deg and is then CAUGHT AT 154 deg by a stowed wing
    # foot -- the wings are 60 mm outboard when folded, so upside down they are
    # outriggers, which is part 2's "a rail high on the chassis becomes a foot
    # when the bike is inverted" caused by the mechanism itself. The wing tip
    # sits 60.4 mm from the roof axis; the roof has to be big enough that the
    # bike rolls decisively before the tip can reach the floor. 40 mm does it
    # (settles at 88 deg, i.e. on its side); 30 mm does not, and from 154 deg
    # the wings only reach 123 deg and stall -- on REACH, not torque (0.23 N.m).
    # radius and height are DERIVED from bike_width / bike_height above.
    # For the record, what the sweep found before they were coupled: at a
    # 30 mm radius the bike rolls off 180 deg and is then CAUGHT AT 154 deg by
    # a stowed wing foot, and from there the wings reach only 123 deg and stall
    # -- on REACH, not torque (0.23 N.m). The response is also NOT MONOTONIC in
    # the radius (50 mm was worse than either 45 or 60), which is exactly why
    # this is now derived rather than tuned. Re-run both tests after any change
    # to the envelope:
    #     python analysis/mechanism/self_righting.py invert --wings
    #     python analysis/mechanism/self_righting.py rest   --wings
    mass: {value: 0.045, source: design}    # shell only -- see the CoG note above
  bumper:
    # Side geometry that sets the resting attitude: a short capsule pad per
    # side, sitting just proud of the drive servo it protects.
    #
    # The counter-intuitive result from `self_righting.py profile --sweep` and
    # `rest`: the bare bike ALREADY settles on its side at 90.2 deg roll /
    # 10.3 deg pitch with zero spread over every fall tried, and every wide or
    # tall outrigger made that WORSE, not better. Rails at 60-75 mm half-span
    # and 100-130 mm height give the inverted bike a stable stance and it ends
    # up on its back roughly a quarter of the time (rest spread 65-115 deg).
    # A tall narrow rail is a fulcrum, not a stop.
    #
    # So the pad is deliberately minimal: barely outboard of the drive servo
    # (whose outer face is at y = 44.25 mm) and only as long as the servo, so
    # it takes the load the servo case is currently taking without changing
    # the energy landscape that already works. Measured spread over the same
    # eight falls: 0.0 deg, resting at 99.6 deg roll / 10.2 deg pitch, and
    # independent of the steer angle at the moment of the fall.
    half_span: {value: 0.046, source: design}   # pad axis; servo face is at 0.04425
    height: {value: 0.050, source: design}      # pad axis height above the rear axle
    x_start: {value: 0.026, source: design}     # spans the drive servos (x = 0.045)
    x_end: {value: 0.064, source: design}
    radius: {value: 0.006, source: design}
    mass: {value: 0.010, source: design}        # per side
  arm:
    # The righting arm: ONE extra XC330-T181 swinging a single arm through
    # +-180 deg about a fore/aft axis, so the same arm reaches the floor on
    # either side (that is what makes one servo enough for a symmetric
    # mechanism). Angle convention: 0 = stowed pointing straight up; the hinge
    # axis is body +X, so POSITIVE rotates the arm toward -Y (the bike's
    # right) -- the same handedness as roll, which is why the arm swings with
    # sign(roll) to reach the floor the bike is lying on.
    pivot: {value: [0.09, 0.0, 0.030], source: design}   # chassis-frame hinge
    length: {value: 0.080, source: design}      # pivot -> foot centre
    radius: {value: 0.005, source: design}
    foot_radius: {value: 0.010, source: design}
    mass: {value: 0.020, source: design}        # arm + foot
    servo_mass: {value: 0.023, source: datasheet}   # the extra XC330-T181
    stow_deg: {value: 0.0, source: design}
    # Reduction between servo and arm. `self_righting.py lift --sweep` says the
    # stroke needs 0.65-0.75 N.m AT THE ARM for every geometry that gets all
    # the way up, against an XC330-T181 that is 0.80 N.m at 12 V, 0.76 at the
    # 3S nominal 11.1 V and ~0.66 at the 9.9 V cutoff. Direct drive is
    # therefore a coin flip on a half-empty pack. Nothing about the stroke
    # wants speed -- two seconds is fine -- so the fix is a reduction, and 3:1
    # is the same ratio the drive belts already use. Set to 1.0 to price
    # direct drive.
    gear_ratio: {value: 4.0, source: design}
    # Position-servo gains AT THE SERVO SHAFT. Each builder applies its own
    # reduction as N^2 (see build_model), so ONE number serves the geared arm,
    # the geared wing pair and the direct-drive cranks alike -- which it did
    # not before 2026-09-16, when this was a tuning knob read as "at the servo"
    # by two builders and "at the mechanism" by three.
    #
    # DERIVED from the XC330-T181's own firmware gains in CURRENT-BASED
    # POSITION MODE (5), which is the mode the righting servo runs in:
    #
    #   kp = Position P Gain * k5 * k = 700 * 2.546e-3 A/(Kp.rad) * 0.83 N.m/A
    #   kv = (Position D Gain / 16) * (256 * k5) * dt_loop * k
    #      = (1400/16) * 0.6519 * 1e-3 * 0.83
    #
    # k5 = (4096/2pi) / (256 * 1000) is the position PID's output read as
    # milliamps, measured at 2.525e-3 on an X330 and derived at 2.546e-3; the
    # 256 divisor is measured, against a manual that says 128. k is the
    # MEASURED torque per amp above the drive edge, servos.xc330_t181.
    # current_torque_gain (was the datasheet kt 0.909 until 2026-09-26: 1.62 /
    # 0.0519). The native actuator has no drive edge; righting_servo.py does.
    # 700/1400 are the factory defaults for mode 5,
    # pinned in control.onboard.gains so the bike asserts them at startup.
    #
    # WHY MODE 5 HAS A D GAIN AT ALL and mode 3/4 ship with zero: commanding
    # current regulates the motor's back-EMF droop away, so the plant has no
    # damping of its own left and the firmware has to supply it.
    #
    # THE kv IS THE SOFT NUMBER. It assumes the firmware's D term is
    # Kd*(delta error) per tick at a 1 kHz loop rather than Kd*d(error)/dt --
    # those differ by 1000x, and 32 ms of derivative time is the reading that
    # is not absurd. It also carries the measured 256 into a path where only
    # the manual's /16 is known. To settle it: step the goal in mode 5, log
    # Present Position and Present Current at ~500 Hz, and fit
    # I = a*e + b*edot; `a` should come back at 2.525e-3 as a check on the fit.
    servo_kp: 1.48      # 1.62 with the datasheet kt; 30.0 as a tuning knob
    servo_kv: 0.0473    # 0.0519 with the datasheet kt; 1.0 before that
  wings:
    # The ALTERNATIVE to `arm`: a mirrored pair of wings, one per side, driven
    # by ONE servo through a gear train (meshed gears at the two pivots with a
    # reversal on one side, so the pair counter-rotates and deploys
    # symmetrically). Both wings swing down-and-outward together; whichever one
    # is on the fallen side plants and levers the bike up.
    #
    # The gear train is NOT modelled. All it contributes to the dynamics is
    # (a) the inversion, as a joint equality theta_left = mirror * theta_right,
    # and (b) the reduction, as gear_ratio. See docs/plans/self-righting.md.
    #
    # Angle convention, same as `arm`: hinge axis is body +X, so POSITIVE
    # rotates toward -Y (the bike's right). The right wing deploys at +d and
    # the left at -d, i.e. both swing outboard and down. 0 = stowed, folded up
    # alongside the chassis.
    #
    # Three things this buys over the single arm, and one risk:
    #   + the stroke is ONE fixed direction, so the mechanism never has to know
    #     which side it fell on (the arm swings with sign(roll));
    #   + it folds flat inside the chassis instead of standing through it;
    #   + the far wing may catch the overshoot the arm has to be stopped to
    #     avoid (see the arm's "must stop at hand-off" note above);
    #   - ...or it may plant EARLY and wedge the bike short of upright, outside
    #     the +-12 deg hand-off window. That is what `lift --wings --sweep` and
    #     `sequence --wings` exist to answer.
    pivot: {value: [0.075, 0.030, 0.0], source: design}  # [x, |y|, z]; mirrored in y
    # pivot HEIGHT is the parameter this design turns on, and -0.020 (20 mm
    # below the rear axle = 31 mm off the floor) is what `lift --wings --sweep`
    # settles on. Three things fight over it, and the third is the one that
    # actually decides:
    #
    #   packaging  A low pivot ought to stow lower. It does NOT, because a low
    #     pivot also needs a LONGER leg to reach the floor, and the extra length
    #     eats the gain exactly: z = -30/105 mm and z = -20/95 mm both stow at
    #     153 mm. Below that the wing has to grow faster than the pivot drops
    #     and the stowed height starts climbing again.
    #   torque  Also flat across the working band (0.57 N.m at both), because
    #     the same trade runs backwards: a lower pivot shortens the moment arm
    #     it pushes on, and the longer leg needed to fix that costs it back.
    #   riding-lean clearance  THE BINDING CONSTRAINT. The stowed wing is the
    #     lowest outboard thing on the bike after the wheels, so it decides the
    #     roll angle at which something other than a tyre touches down. At
    #     z = -30 that is 27 deg -- INSIDE the recoverable set (up to 30.9 deg,
    #     analysis/policy/no_return.py), so a lean the policy could still save would
    #     drag a wing on the floor. z = -20 puts it at 40 deg, clear of both the
    #     recoverable set and any riding lean.
    #
    # So the floor on pivot height is set by lean clearance, not by torque or
    # packaging -- `profile --wings` reports it as `first non-wheel contact`.
    #
    # x = 0.045 is the drive-servo station (same as the bumper pads);
    # |y| = 0.035 is INBOARD of the servo outer face at 44.25 mm, so the stowed
    # pair is narrower than the side geometry that is already known to give a
    # 0.0 deg rest spread.
    #
    # Each wing is a dogleg, as sketched: a short crank off the pivot, then the
    # long leg to the foot. Rigid -- one body, no second joint. The crank is
    # what lets the leg fold flat ALONGSIDE the chassis at stow while still
    # clearing the gear.
    #
    # crank_deg is measured from +Z and cranks OUTBOARD. It is NOT a free knob
    # to trade against torque, for two reasons, and ~90 deg is close to forced:
    #
    #   1. The crank exists to carry the leg past the RIM OF ITS OWN GEAR. The
    #      leg has to land on the floor, not on the disc it is bolted to, so
    #      the outboard reach (crank_length * sin(crank_deg)) must exceed
    #      disc_radius. Cranking inboard shortens that reach by sin and the
    #      mechanism starts standing on its gear. build_model.wing_fit()
    #      reports it as `leg_stands_on_gear`; the physics will NOT catch it,
    #      because the discs are drawn non-colliding.
    #   2. The drive servos occupy |y| = 15.75..44.25 mm, so an INBOARD crank
    #      parks the stowed leg straight through them -- also invisible to the
    #      simulation, since the wings collide only with the floor.
    #
    # The angle is somewhat notional anyway: the real part will integrate the
    # crank into the gear itself, so what this parameter actually encodes is
    # WHERE THE LEG LANDS relative to the pivot, not a physical bend.
    #
    # Note the coupling this creates: disc_radius grows with gear_ratio, so a
    # bigger reduction demands a longer crank, which widens the stance, which
    # is what part 2's rest sweep punishes. Reduction and landing behaviour are
    # not independent.
    crank_deg: {value: 90.0, source: design}       # from +Z, positive = OUTBOARD
    # crank_length and length are DERIVED from bike_width / bike_height.
    # What they have to satisfy, and what the derivation therefore guarantees:
    #   crank_length  carries the leg clear of its own gear disc (see
    #                 crank_deg above) and puts the tip at bike_width/2;
    #   length        reaches from the elbow up to the roof axis, which is
    #                 also what gives the deployed wing enough REACH -- too
    #                 short and the stroke stalls near 90 deg of roll on reach
    #                 rather than torque, and lands badly besides.
    # The real wing will be wider and curved so it rolls onto its side
    # gracefully; this straight capsule is the rough-physics stand-in.
    radius: {value: 0.005, source: design}
    foot_radius: {value: 0.010, source: design}
    mass: {value: 0.020, source: design}           # PER WING
    servo_mass: {value: 0.023, source: datasheet}  # the extra XC330-T181
    gearbox_mass: {value: 0.015, source: design}   # the gear train itself
    stow_deg: {value: 0.0, source: design}
    deploy_deg: {value: 105.0, source: design}     # hard stop; joint range is +-this
    # Reduction between servo and wing. 3:1 is the arm's number and the drive
    # belts'. NOTE the consequence the sketch already anticipated: a stow ->
    # deploy stroke of 135 deg at 3:1 is 405 deg AT THE SERVO, so this needs
    # EXTENDED POSITION (multi-turn) mode, not the 0-360 single-turn mode. The
    # analysis reports servo turns explicitly rather than assuming it.
    #
    # The ratio is ALSO a fit constraint, and that is the surprising part --
    # see build_model.wing_fit(). One central pinion meshing both wing gears
    # fixes the centre distance at the pivot half-span, so
    #     r_pinion = half_span / (1 + ratio),  r_disc = half_span - r_pinion
    # and both radii follow from the ratio alone. It runs the wrong way from
    # intuition: a BIGGER reduction shrinks the PINION rather than growing the
    # disc without limit, and the pinion is the 3D-printed part with a floor on
    # how small its teeth can be (build_model.MIN_PINION_RADIUS, a constant of
    # the retired geared-wing concept, not a parameter of any real design), and
    # the disc separately cannot exceed the pivot's height above the floor
    # without grounding out. `lift --wings --sweep` reports both ceilings.
    gear_ratio: {value: 4.0, source: design}
    gear_width: {value: 0.006, source: design}        # face width; visual only
    mirror: {value: -1.0, source: design}          # theta_left = mirror * theta_right
    # Same servo, same mode, same derivation as the arm's -- see the long note
    # there. At the servo shaft; the builder squares gear_ratio.
    servo_kp: 1.48      # the arm's derivation, k = 0.83
    servo_kv: 0.0473
