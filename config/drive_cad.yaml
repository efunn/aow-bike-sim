# The rear drive module's CAD numbers: mock rear wheel, the spline+pulley and
# drive pulley pairs, the drive case sides, the chainstays and a mock fixture.
# Read by aow_sim.cad_drive only -- never by the simulator. Metres (keys ending
# _deg or _n are not scaled). Spec: docs/plans/drive-design.md.
#
# MODULE FRAME: origin on the rear axle's centre, +Y ALONG THE MEAN BELT
# (forward, toward the servos), +X right, +Z up. In the bike the module is
# tilted by bike_params_cad drivetrain.drive_servo_angle_deg (45) about X.
#
# EVERY PART IS BUILT ON THE LEFT (-X) AND ITS RIGHT TWIN IS THE SAME SOLID
# ROTATED 180 deg ABOUT Y -- which maps servo A (horn -X, Z -) onto servo B
# (horn +X, Z +). So the pairs are one part each, by construction.
#
# "hand drawing" below means the user's printed, working version in the
# aow-bike document's `bike` tab, read off through the API on 2026-09-28
# (traces/drive/probe_bike_surfaces.txt). Those fits printed and ran.
#
#   part             print   what it is
#   spline pulley    X+/X-   15T, spline stub into the wheel's side gear, a
#                            60 deg thrust cone the chainstay bears on
#   drive pulley     X+/X-   45T on the XC430 horn: 4 pins, 4 M2 x 6
#   case side        X+/X-   plate on both servos (one's horn face, the other's
#                            back), skirt, spacers, 8 M2.5; the chainstay
#                            channel at -Y, the fixture tab at +Y (only
#                            with the fixture)
#   chainstay        X+/X-   axle boss (hex pocket for the M5 head / nut), the
#                            bearing stub, a riser inside the belt loop, the
#                            tongue into the case side's channel
#   fixture mock     Y+      PLACEHOLDER between the case sides' tabs; OFF
#                            unless asked for (see fixture:)

wheel:
  # The mock casing, as the hand drawing's mock: a core, a rim ring each side
  # standing off a pocket, the hub stub the spline pulley's shoulder bears on.
  hub_face_x: {value: 0.015, source: measured (hand drawing mock)}   # hub stub face, each side
  hub_stub_dia: {value: 0.015, source: measured (hand drawing mock)}
  core_half_width: {value: 0.0125, source: measured (hand drawing mock)}
  core_dia: {value: 0.070, source: measured (hand drawing mock)}
  rim_half_width: {value: 0.0165, source: measured (hand drawing mock; omni_wheel.width 33)}
  rim_outer_dia: {value: 0.084, source: measured (hand drawing mock)}
  rim_inner_dia: {value: 0.066, source: design (mock; clears the pulley)}
  bore_dia: {value: 0.005, source: measured (user; the wheel bears on the M5)}
  # Rollers are bike_params_cad omni_wheel (r_m, cone diameters, length, gap).

spline:
  # Configuration 5 of `aow-spline-shape` (user: "the best I found"), already
  # derived into the hand drawing. Keep these three as the variables to tune
  # if the fit changes.
  outer_dia: {value: 0.0118, source: measured (user; config 5)}
  root_dia: {value: 0.0088, source: measured (user; config 5)}
  lobe_deg: {value: 35.0, source: measured (user; config 5)}
  lobes_n: {value: 5, source: measured (hand drawing)}
  length: {value: 0.004, source: measured (hand drawing)}   # stub into the wheel

axle:
  # M5 socket head one side, hex nut the other; the hex pocket takes either,
  # which is what lets the chainstays be one part. 50.5 is head face to nut
  # face (user); the M5 preloads the cone stack through the chainstays.
  clamp_span: {value: 0.0505, source: measured (user)}
  dia: {value: 0.005, source: datasheet (M5)}
  hex_af: {value: 0.008, source: measured (hand drawing pocket)}
  nut_length: {value: 0.004, source: datasheet (M5 nut)}
  head_length: {value: 0.005, source: datasheet (M5 socket head)}

pulley:
  # Both pulleys, the tooth band and flanges as the hand drawing's HTD generator.
  pld: {value: 0.0005715, source: datasheet (HTD 5M pitch line differential)}
  tooth_width: {value: 0.010, source: measured (hand drawing; 9 mm belt)}
  flange_lip: {value: 0.0005, source: measured (hand drawing)}   # flat annulus over the tips
  flange_cone_len: {value: 0.001, source: measured (hand drawing)}
  flange_cone_deg: {value: 55.0, source: measured (hand drawing; prints unsupported)}
  flange_cyl: {value: 0.0005, source: measured (hand drawing)}
  # The spline pulley's axle bore (a clearance on the M5 -- the wheel is the
  # bearing), the 60 deg thrust cone and the counterbore the chainstay's stub
  # enters.
  bore_dia: {value: 0.0052, source: measured (hand drawing)}
  counterbore_dia: {value: 0.015, source: measured (hand drawing)}
  counterbore_floor_inset: {value: 0.00045, source: measured (hand drawing)}   # from the tooth band's inner end
  cone_deg: {value: 60.0, source: measured (hand drawing)}
  hub_dia: {value: 0.015, source: measured (hand drawing; = the wheel's hub stub)}
  hub_chamfer_deg: {value: 45.0, source: measured (hand drawing)}

# Groove shape per tooth count, off the hand drawing's HTD generator: a root
# arc, two flank arcs (centres crossed over the groove's centreline), tip
# fillets. flank_center is how far inside the tip circle the flank centres sit.
teeth_15:
  depth: {value: 0.00199, source: measured (hand drawing)}
  flank_r: {value: 0.00188, source: measured (hand drawing)}
  flank_center: {value: 0.000185, source: measured (hand drawing)}
  flank_offset: {value: 0.00014, source: measured (hand drawing)}
  tip_fillet: {value: 0.00043, source: measured (hand drawing)}
teeth_45:
  depth: {value: 0.002, source: measured (hand drawing)}
  flank_r: {value: 0.0017, source: measured (hand drawing)}
  flank_center: {value: 0.000338, source: measured (hand drawing)}
  flank_offset: {value: 0.00002, source: measured (hand drawing)}
  tip_fillet: {value: 0.00043, source: measured (hand drawing)}

drive_pulley:
  pad_dia: {value: 0.0205, source: measured (hand drawing; = horn)}
  pad_chamfer: {value: 0.0006, source: measured (hand drawing)}
  flange_gap: {value: 0.0006, source: measured (user; "kind of tight", keep)}   # flange to the case side
  boss_clearance_dia: {value: 0.0082, source: measured (hand drawing)}
  pin_dia: {value: 0.0014, source: measured (hand drawing)}
  pin_length: {value: 0.002, source: measured (hand drawing)}
  pin_circle: {value: 0.016, source: datasheet (XC430 horn PCD)}
  screw_hole_dia: {value: 0.0021, source: measured (hand drawing; M2)}
  screw_cb_dia: {value: 0.004, source: measured (hand drawing)}
  screw_seat: {value: 0.002, source: measured (hand drawing)}   # seat to the horn face
  screw_length: {value: 0.006, source: measured (user; M2 x 6 into brass inserts)}

case:
  plate_thickness: {value: 0.0036, source: measured (hand drawing)}
  skirt_depth: {value: 0.005, source: measured (hand drawing)}
  skirt_wall: {value: 0.00121, source: measured (hand drawing)}
  skirt_clearance: {value: 0.00004, source: measured (hand drawing; printed fit)}
  relief_dia: {value: 0.0221, source: measured (hand drawing)}   # through-hole for the horn
  relief_chamfer: {value: 0.0006, source: measured (hand drawing)}
  # Spacers into the XC430's own case-screw counterbores: they locate.
  spacer_dia: {value: 0.0043, source: measured (hand drawing; printed fit)}
  spacer_height: {value: 0.0028, source: measured (hand drawing)}
  screw_hole_dia: {value: 0.0027, source: measured (hand drawing; M2.5)}
  screw_cb_dia: {value: 0.005, source: measured (hand drawing)}
  screw_cb_depth: {value: 0.0024, source: measured (hand drawing)}
  # The wires leave the back face, kink 90 deg against the plate and run out
  # through this gap in the skirt, on the side of the servo whose back it is.
  wire_gap_width: {value: 0.0106, source: measured (hand drawing; 6 wires fit)}
  wire_gap_from_shaft: {value: 0.0142, source: measured (hand drawing)}   # gap centre, behind the shaft
  tire_clearance: {value: 0.003, source: design}   # rear block to the wheel's envelope
  # The rear block's +-Z corners at 45 deg (user, 2026-10-07: "the drive
  # cases corners in -Y (the part going towards the chainstays) could be
  # cut down/chamfered"). The block only carries the chainstay's channel and
  # the tension screw and nut, all within +-3.7 of mid-height; in the bike
  # the righting's turned upper case comes up under case side R's lower
  # corner there. The leg along Y and Z, from the block's -Y end: 16.9 runs
  # the chamfer to where the servo pocket starts, leaving the end 12.85 tall
  # of 29.75. 0 = square, as printed.
  rear_chamfer: {value: 0.0169, source: design (user)}

chainstay:
  pulley_gap: {value: 0.001, source: measured (hand drawing)}
  thickness: {value: 0.005, source: measured (hand drawing)}
  arm_width: {value: 0.019, source: measured (hand drawing)}
  boss_dia: {value: 0.019, source: measured (hand drawing)}
  bed_chamfer: {value: 0.0006, source: measured (hand drawing)}   # hex mouth, elephant's foot
  stub_dia: {value: 0.014, source: measured (hand drawing)}
  relief_cone_deg: {value: 35.0, source: measured (hand drawing)}
  relief_len: {value: 0.0024, source: measured (hand drawing)}
  bearing_cone_deg: {value: 60.0, source: measured (hand drawing; = pulley cone_deg)}
  bearing_len: {value: 0.001, source: measured (hand drawing)}
  # The stub's 60 deg nose drawn this far INTO the pulley's seat (cone
  # apexes at 17.78 and 17.92 in the hand drawing). It is the PRELOAD: the
  # chainstay's X is set by its tongue clamped in the case side, so the M5
  # seats the cones by flexing the arm (user: 1/4-1/2 turn of adjustment).
  cone_preload: {value: 0.00014, source: measured (hand drawing)}
  bore_dia: {value: 0.0052, source: measured (hand drawing; tight-ish in practice)}
  riser_length: {value: 0.020, source: design}   # along Y, inside the belt loop
  flange_clearance: {value: 0.002, source: design}   # riser to the 45T flange
  belt_clearance: {value: 0.001, source: design}     # riser to the belt's tooth side
  # FINISHING, folded in from the user's hand edits in `aow-bike-drive`
  # (readback 2026-10-11, traces/hand_edits/drive_hand_edits.txt; drawn on
  # chainstay L only, the twin follows by construction). In order:
  #   front_chamfer   the front-outer corner (outer face x front face), 45 deg
  #   riser_chamfer   the riser's rear-top edge, AND the same size as a gusset
  #                   (material added) in the concave corner riser x bed
  #   chamfer_fillet  both long edges of each of those three chamfer faces
  #   edge_chamfer    the outer face's rim, round the boss and on along the
  #                   side edges over the chamfer to the riser top (one
  #                   tangent chain)
  front_chamfer: {value: 0.015, source: design (user, hand edit)}
  riser_chamfer: {value: 0.005, source: design (user, hand edit)}
  chamfer_fillet: {value: 0.003, source: design (user, hand edit)}
  edge_chamfer: {value: 0.002, source: design (user, hand edit)}

tension:
  # The chainstay's tongue slides along Y in a channel at the case side's -Y
  # edge, open behind, CLOSED in front: at nominal (the exact belt length,
  # which is what drove well) the tongue's front end is on the channel's end;
  # more tension = move it back and shim that gap (user). One 6-32 x 3/8 flat
  # head, head outboard (reachable with the other side on), driven through a
  # bore from the chainstay's outer face; the nut slides in a slot along Y,
  # in from the case side's back edge.
  #
  # WHAT CLAMPS (user): the riser's big flat on the case side's outer face.
  # The tongue is a plain rectangular key -- it locates in Z and against
  # rotation (a V would cam out) -- and stops tongue_top_gap short of the
  # channel's floor, so it never takes the clamp. Narrow, because only the
  # shank passes it: the countersink sits in the riser, csk_web short of the
  # clamp face.
  tongue_width: {value: 0.007, source: design}
  # EVERY HEIGHT a ceiling sits at, measured from the bed (the case side's
  # outer face), is on the layer grid (joint.bridge_layer): layout() snaps the
  # nut slot and the tip slot to it and refuses a tongue_depth off it (user).
  tongue_depth: {value: 0.0024, source: design (user; on the 0.2 grid)}   # the channel, into the case side
  tongue_top_gap: {value: 0.0003, source: design}
  tongue_clearance: {value: 0.00015, source: GUESS (per side, print property)}
  travel: {value: 0.003, source: design (user; "whatever travel is available")}
  screw_length: {value: 0.009525, source: datasheet (6-32 x 3/8 flat head)}
  csk_web: {value: 0.0008, source: design}         # chainstay under the seat's cone
  head_bore_clearance: {value: 0.0006, source: design}   # diametral
  nut_thickness: {value: 0.00238, source: datasheet (6-32 small pattern)}
  tip_past_nut: {value: 0.0003, source: design}   # a minimum: the nut bears on the web
  min_web: {value: 0.0014, source: design (user; "can be tightened down")}   # channel floor to nut slot
  tip_slot: {value: 0.0006, source: design (user)}  # past the nut slot, so the tip cannot bottom out
  nut_roof: {value: 0.001, source: design}          # over the tip slot

fixture:
  # OFF in the module (2026-10-11, user: "for now, drop the fixture mock and
  # the extensions to the case sides that meet with it"): the case sides end
  # at the skirt's front wall. `AOW drive`'s "Fixture mock" box puts it back;
  # the v1 whole bike (cad_bike) builds it always, since its chassis grows
  # from the block.
  # 2 x 6-32 a side into a mock block between the case sides' tabs, the
  # locator a ridge along Y (the shared screw joint). The heads sit out of the
  # drive pulley's disc, so a driver reaches them with the pulley on.
  tab_length: {value: 0.024, source: design}
  screw_y0: {value: 0.006, source: design}   # from the tab's rear edge
  screw_y1: {value: 0.018, source: design}
  screw_z: {value: 0.023, source: design}    # +Z on the left side, -Z on the right
  head_clearance: {value: 0.0005, source: design}   # head edge to the pulley's flange
  gap: {value: 0.0005, source: design}       # block off the skirt's front wall

rail:
  # THE SIDE RAILS (aow-bike-whole-v2, user 2026-10-16: the drive "takes on
  # the main 'chassis' component of the bike, in two halves"). Each case side
  # grows forward as ONE part: a plate in the bike's side plane, printed on
  # the case side's outer face (|x| 20.6) like the case side itself, to the
  # steering's lower case and down to the righting's bridge, with the roll
  # cage's stubs. joint_plate thick (4.6, the house joint), so the inner face
  # is at |x| inner_x; inside the case side's own outline the extra 1.0 under
  # 17.0 is cut back (the servos are there). The rails pass wholly UNDER the
  # AHRS (user), which hangs on tabs off the case sides (ahrs: below).
  #
  # IN THE BIKE FRAME, metres: (y, z) in the side view, origin on the rear
  # axle (the module turns them by the drive's 45 deg). cad_bike_v2 refuses a
  # joint here that is not where the steering's / righting's own joint is.
  #   outline   the left rail's side view (the right rail is its mirror):
  #             in from the case side's lower-front corner (two points 1
  #             inside the case, for the union: deeper and it fills the
  #             M2.5 counterbores, which reach |z| 27.75 of the case's 29.75), along under the bridge's
  #             underside (z 38.6), up over the fork's top (module z 68.75)
  #             23 behind the steer axis -- the fork sweeps r 25.5 round it
  #             below z 67.25 -- to the steering's side pad (module z
  #             68.75..80.8, y -11.5..12: the pad's footprint), and on up
  #             to the front cage post, which is part of its outline
  #   THE CAGE POSTS (user, 2026-10-16): short posts at 15 deg. The FRONT
  #   one is parallel to the steering axis just ahead of the steering's foot
  #   (module y cage_post_ym, from the band's bottom to cage_post_top_zm);
  #   the REAR one is its exact MIRROR about mid-wheelbase, carried by an arm
  #   whose edges continue the post's bottom and the band's top (15 deg), and
  #   end ON the case side's rear chamfer face and top edge (no overlap).
  #   Each post is the rail's 4.6 thick (a boss inward blocked the front
  #   fork's nut slots) and is itself the MALE locating feature: the cage's
  #   socket slides DOWN over it along its axis, with lead-ins at its top. One
  #   6-32 in from the side, the head in the cage part outside the rail, the
  #   nut centred in the 4.6 (0.95 walls, two line widths) in a slot from the
  #   screw out through the post's FREE edge (front post: forward; rear:
  #   back). Through both edges it ran on into the rail.
  inner_x: {value: 0.016, source: design (= case_half 17 - 1.0; plate = joint_plate 4.6)}
  # the outline in two runs, the front cage post drawn between them (code:
  # cad_drive.rail_layout): along the bottom to the steering's pad, then
  # back along the top from it
  outline_bottom:
    value: [[0.082555, 0.041896], [0.0860, 0.0386], [0.1500, 0.0386], [0.160619, 0.060022], [0.171727, 0.062998]]
    source: design
  outline_top:
    value: [[0.168479, 0.07512], [0.10511, 0.06304], [0.104404, 0.063746]]
    source: design
  # The steering's frame, to draw the front post in and mirror the rear one
  # by (cad_bike_v2 refuses it if it is not the bike's): the front axle (y,
  # z, bike) and the rake. The rear axle is the origin.
  steer_axle: {value: [0.2005, 0.00005], source: design (= the bike's wheelbase, front axle height)}
  steer_rake_deg: {value: 15.0, source: design (= bike.rake_deg)}
  # The band the rail is beside the steering, module z: from the lower
  # case's bottom (the user: flush with it; the fork's top is 1.0 under it)
  # to the side pads' top.
  steer_band_zm: {value: [0.06825, 0.0808], source: design (= steering caseBot, v2PadTop)}
  # The joints: (y, z) of the head on the rail's outer face, the ridge's
  # direction in the side view (deg up from +Y) and half-length. The ridge
  # is on the OTHER part (steering pad, bridge lug); the rail has the groove.
  steer_joint: {value: [0.180946, 0.073026], source: design (= cad_steering v2 side joint, in the bike)}
  # Both joints' grooves run ALONG THE WAY THE MODULE SLIDES OUT and open
  # through the rail's lower edge (user, 2026-10-16: the steering and the
  # righting come out of the rails downward, the rails staying on the
  # drive): `*_ridge_half` is how far the groove's ridge runs past the head
  # (+1 for the groove), `*_groove_open` how far the groove runs back from
  # the head, out past the edge.
  steer_ridge_deg: {value: 105.0, source: design (up the steering axis, raked 15)}
  steer_ridge_half: {value: 0.0035, source: design (= steering v2.side_ridge_above)}
  steer_groove_open: {value: 0.0098, source: design (2.5 past the rail's edge at module z 68.25, its 45 deg end taper outside the rail)}
  bridge_joint: {value: [0.1205, 0.0435755], source: design (= cad_righting rail joint, in the bike)}
  bridge_ridge_deg: {value: 90.0, source: design (user; slides in from below)}
  bridge_ridge_half: {value: 0.003, source: design (= righting rail.ridge_half)}
  bridge_groove_open: {value: 0.007476, source: design (2.5 past the rail's edge at bike z 38.6, its taper outside)}
  # THE POWER HOLDER's AFT joint (user, 2026-10-16 night: the rear arm made
  # the part "unnecessarily long, it can fit tighter down (like basically
  # below the switch)"): a BACK EAR standing on the case side's top edge
  # (drive frame: back_ear = y0, y1, z1), under the switch, the head at
  # drive (80, 35.5): 5.75 off the top edge for the countersink, high
  # enough that the groove's closed end stays in the ear. The holder drops
  # in from above: the groove is closed below the head and open up through
  # the ear's top (ridge_deg 270). cad_bike_v2 refuses it off the holder's
  # (bike_v2_cad.yaml power.joints). Mirrored on the right, unused there.
  back_ear: {value: [0.07425, 0.08575, 0.04125], source: design}
  carrier_joint: {value: [0.0314663, 0.0816708], source: design (bike frame, = drive (80, 35.5))}
  carrier_ridge_deg: {value: 270.0, source: design (the holder drops in from above)}
  carrier_ridge_half: {value: 0.003, source: design}
  carrier_groove_open: {value: 0.011, source: design (out through the ear's top, its taper outside)}
  # The carrier's FORE joint (user, 2026-10-16 night: the holder's "2 6-32
  # installation screws are fore and aft of the electronics PCB"): an EAR
  # off the case side's front edge at its top (drive frame: front_ear =
  # length forward, z0, z1), over the AHRS tab and board, near the left
  # drive pulley. The head at drive (125, 27): the head and 1 mm round it
  # clear of the left pulley's belt in side view by 1.7, and under the
  # board's front plugs by 2.6. Mirrored on the right
  # like all of the rail, where it is behind the right pulley (unused).
  front_ear: {value: [0.0115, 0.020, 0.0335], source: design}
  carrier_front_joint: {value: [0.0692965, 0.1074802], source: design (bike frame, = drive (125, 27))}
  carrier_front_ridge_deg: {value: 270.0, source: design (the holder drops in from above)}
  carrier_front_ridge_half: {value: 0.003, source: design}
  carrier_front_groove_open: {value: 0.011, source: design (out through the ear's front-top, its taper outside)}

  cage_post_ym: {value: [0.01355, 0.02555], source: design (1.0 ahead of the steering's foot at 12.55; 12 wide)}
  cage_post_top_zm: {value: 0.083, source: design}
  cage_post_lead: {value: 0.002, source: design}    # the free edge's lead-in; the rail's side runs 45 deg from the band's top
  cage_screw_zm: {value: 0.076, source: design}     # module z of the screws (the rear's mirrored)

ahrs:
  # The TM151 on the case sides' front edges (user, 2026-10-16: "two
  # attachment points on each drive case side, positioned roughly where it
  # already is"), on its own four M2 holes (ahrs_fixture_cad.yaml tm151: 31
  # along its length, drive Z, by 30 across, drive X). Each is a TAB off the
  # case side, the board's back face on its front; the M2 (supplied, 4 long)
  # goes in through the board, a thin web, into a tiny nut slot dropped in
  # from the tab's inner end (open upward as the case side prints).
  # ORIENTATION (user, 2026-10-16: "usb should be pointing up/back"): the
  # USB-C edge (the TM151's -x) up the face, toward the battery; its +x, the
  # pin-header edge, DOWN (tm151_x_up_n -1). Pointing down, the plug's
  # overmold reached the righting's bridge.
  board_z: {value: -0.00975, source: design (its lower edge on the case's lower face)}
  tm151_x_up_n: {value: -1, source: design (user; USB up/back)}
  # 0.9 = two line widths (user, 2026-10-16: 0.5 "is just gonna be one line
  # width which is pretty sketchy"); the 4 mm screw then ends flush with the
  # nut's far face once the nut is pulled up to the web
  web: {value: 0.0009, source: design (user; two line widths)}
  nut_af: {value: 0.004, source: measured (user; M2, 4 flats)}
  nut_thickness: {value: 0.0015, source: measured (user)}
  nut_clearance: {value: 0.0001, source: GUESS (snug, print fit)}
  back_wall: {value: 0.001, source: design}
  tab_wall: {value: 0.001, source: design}           # round the nut slot, along Z
  # ONE tab a side, spanning both holes (user, 2026-10-16: "fully between the
  # two support parts ... the full 8.6mm width of the underlying drive case
  # in X"): |x| 12.0 to the outer face 20.6, the case side's own width there.
  tab_inner_x: {value: 0.012, source: design (user; = the skirt's inner face)}
  screw_length: {value: 0.004, source: measured (user)}
  hole_dia: {value: 0.0024, source: GUESS (M2 free fit, printed)}

print:
  min_wall: {value: 0.001, source: design (user; two perimeters)}

joint:
  # The shared 6-32 joint (cad_ahrs_fixture's screwJoint), as the steering's.
  joint_plate: {value: 0.0046, source: design (as-built)}
  ridge_height: {value: 0.0012, source: design}
  ridge_flat: {value: 0.0046, source: design}
  ridge_clearance: {value: 0.00015, source: design}
  bridge_layer: {value: 0.0002, source: design (layer height)}

