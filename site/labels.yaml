# Display names for the ids the site's pages carry. Edit and run
# `scripts/site.sh build`; no recompute. An id missing here shows as itself,
# and the build prints a warning naming it.
#
# What each name stands for is described in the page's own template
# ("More info"): keep the two in step when a name changes meaning.

# Trained policies (moves/<id>.yaml), oldest first.
policies:
# A is a feed-forward network; the three minGRUs are named by the plant
# (the bike model) each was trained on.
  general_rl_v3_s1: MLP
  general_puffer_fixes_72M: minGRU · plant V1
  general_puffer_rake20_80M: minGRU · plant V2
  general_puffer_a40_v4_80M: minGRU · plant V3

# Floor runs of the real bike (traces/bike/<id>).
runs:
# No dates; a policy with two runs numbers them in date order.
  261024-174349_run: minGRU · plant V1 · sample 1
  261024-191558_run: minGRU · plant V2
  261025-225207_run: MLP
  261026-154111_run_v4_80M: minGRU · plant V3
  261026-154338_run_fixes_72M: minGRU · plant V1 · sample 2

# The plant a policy is simulated on (drivetrain_trace.py's columns), shown
# after "| sim:". Every policy is flown on both; each matches the policy of
# that name's plant_digest. Plant V1 is never flown: the sim is always on
# the current geometry.
drivetrains:
  "plant V2: the params' drivetrain, no wheel play": plant V2
  "plant V3: detent+roller_slop from drivetrain_sawtooth_1024, wheel play from wheel_play_fit_1026": plant V3

# Righting-linkage designs (swing_stepthrough.py's DEFAULT).
designs:
  V1: V1 · flat panels
  V2: V2 · flat panels
  V3: V3 · curved panels
