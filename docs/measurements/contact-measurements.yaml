# Raw measurement capture sheet — tracks contact-protocol.md section by section.
#
# Enter values exactly as measured. Units are in each key's suffix:
#   _mm = millimeters (float), _n = newtons (float), _kg = kilograms (float),
#   _fps = frames per second (int). 0 / 0.0 means "not yet measured".
# This file is for raw data entry only. When a section is complete, read the
# matching entry off the tables in contact-protocol.md (or re-run
# analysis/contact_calibration.py with your numbers) and update
# `sim.contact_solref` (p0/p1) or `sim.friction_sliding` (p0b) in
# config/bike_params.yaml.

surface:
  material: "wood — smooth cutting board"   # what the tests below were run on
  notes: >
    The target floor. If this changes, both sections need redoing; see §P3 of
    the protocol for why a per-geom split does NOT do what it looks like it
    does (MuJoCo averages the pair).

p0_static_deflection:
  # Load through the axle, measure axle drop vs unloaded on the same spot and
  # the same roll phase. Three loads minimum — the contact is not linear.
  # Rear roll phases, by the roller axle nearest straight down (sim angle):
  #   "two big ends" (0 deg, one axle's two cones bridging its gap)
  #   "big-end point" (~6) / "flat on one roller" (~13) / "small-end point" (~19)
  #   "two small ends" (22.5, neighbouring axles bridging)
  roll_phase: ""              # str — one of the above
  unloaded_reference_mm: 0.0  # float — axle height, no load
  points:
    - load_kg: 0.0            # float
      deflection_mm: 0.0      # float — drop from the unloaded reference
    - load_kg: 0.0
      deflection_mm: 0.0
    - load_kg: 0.0
      deflection_mm: 0.0
  notes: >
    2026-08-08 first pass, hand-guided, ~4.5 kg: "in the mm range, say 1 mm,
    maybe more". Not recorded as a data point because the reference and roll
    phase were not controlled. Against the settled whole-bike model at
    dampratio 1.0 (contact_calibration.static_curve, 2026-10-01), rear at
    44.1 N: timeconst 0.020 -> 2.49 mm, 0.010 -> 1.18, 0.005 (ships) -> 0.57,
    0.0035 -> 0.41. So ~1 mm sits nearest 0.010, and 0.020 is unlikely but
    not ruled out. (An earlier note here said 0.020 was ruled out at "3.6 mm
    under the bike's own weight"; that came from a posed calculation that
    over-read the sink, replaced 2026-10-01.)

p0_pretest_2026_10_01:
  # ROUGH PRE-TEST, kept for reference; not the p0 data and not a fit.
  # Two dial indicators read in THOU (0.001 in = 0.0254 mm), rounded to the
  # nearest thou, one pass each: one on the scale platform, one on the top of
  # the wheel. Wheel-only sink = wheel_top - scale (about +-1 thou, +-0.025 mm).
  # Zeroed with each wheel resting under its own weight on the scale and its
  # rig propped loosely off the side (front: the forks; rear: the motor
  # assembly), so the preload is the wheel plus an unknown share of the rig,
  # and was not recorded. Surface: the scale platform.
  loads_lb: [0.5, 1.0, 3.0, 6.0]           # weights added; 6 lb is the scale's limit
  loads_n: [2.22, 4.45, 13.34, 26.69]
  scale_thou: [2, 3, 8, 16]
  wheel_top_thou:
    rear_two_big_ends: [4, 10, 20, 35]     # 2 rollers in contact, large diameter
    rear_big_end_point: [6, 10, 23, 40]    # 1 roller, large diameter
    rear_flat_one_roller: [4, 8, 18, 30]   # 1 roller, flat
    rear_two_small_ends: [4, 8, 20, 30]    # 2 rollers, small diameter
    front: [4, 8, 20, 30]
  wheel_only_mm:                           # (wheel_top - scale) * 0.0254
    rear_two_big_ends: [0.051, 0.178, 0.305, 0.483]
    rear_big_end_point: [0.102, 0.178, 0.381, 0.610]
    rear_flat_one_roller: [0.051, 0.127, 0.254, 0.356]
    rear_two_small_ends: [0.051, 0.127, 0.305, 0.356]
    front: [0.051, 0.127, 0.305, 0.356]
  notes: >
    Not measured: the small-end single point. Against the shipped
    contact_solref [0.005, 1.0], the sim started from the wheel's own weight
    (2026-10-01) adds at 26.7 N: flat 0.36, front 0.31, big-end point 0.47,
    two big ends 0.30, two small ends ~0.24 mm (that one from
    static_contact_sim.py). Flat matches; the others read 1.2-1.6x softer,
    and every contact ~0.08 mm more than the sim over the first 4.45 N. For
    the real p0: read the scale before taring it, so the preload is known.

p0b_pull:
  # mu = SLOPE of pull force against wheel load, over 3 loads. Wheel LOCKED
  # (front through the spokes, rear by tightening the axle), rolling direction
  # only, pulled slowly and low. Rig as built goes in rig_notes. See the protocol.
  # Shipped guess 0.9.
  rig_notes: ""               # str -- what the rig actually was, how it was steadied
  surface: ""                 # str -- material, backing, clean?
  pulls: []                   # [{wheel: front|rear, load_g, pull_g, kind: kinetic|static, lean_deg: 0}]
  notes: >
    Not yet measured. The spread across pulls is not noise to average away
    -- it is what sets randomization.friction_frac, currently 0.2 about a
    nominal 0.9 (so every policy in moves/ has only seen mu 0.72-1.08).

p0b_tread_print:
  # friction_torsional ~ (2/3..0.59) * mu * a, a = sqrt(print area / pi).
  # Ink or chalk the tread, set the weighted rig down on paper. Estimate for the
  # front before measuring: ~0.0026 m at mu 0.9 (shipped 0.005).
  prints: []                  # [{wheel, load_g, length_mm, width_mm, lean_deg: 0}]
  notes: >
    Not yet measured. Low priority; the risk is setting torsional too HIGH
    (0.005 -> 0.05 lost 43% of crab travel in sim).

p1_pretest_2026_10_02:
  # ROUGH PRE-TEST, kept for reference; not the p1 data and not a fit.
  # Front wheel + fork halves (86 g, weighed 2026-09-30) dropped BY HAND onto
  # force sensor 1 (TE FS2050, calibrated +-3%), read by bench/force_drop.py.
  # Partly supported at rest, so the impact mass is the weighed 86 g, not the
  # resting force. Restitution from flight time + impulse, no drop height
  # needed (synthetic check: reads +0.01 to +0.06 high).
  logs: bench/logs/drops_20261002-0131_summary.csv   # raw .csv (10 MB) kept local; 0119 = an earlier run
  clean_drops:             # 1-2.6 mm measured; 2 of 7 under 0.7 mm left out (see notes)
    h_measured_mm: [1.42, 1.01, 2.51, 2.57, 2.19]
    e_measured:    [0.39, 0.47, 0.39, 0.39, 0.38]
    peak_n:        [11.6, 11.1, 13.1, 16.3, 12.0]
    contact_ms:    [7.1, 6.4, 7.5, 7.6, 7.6]
  notes: >
    e ~0.40 over 1-2.6 mm. Against the sim's front tire on a slide at the
    same heights (timeconst 0.005): dampratio 1.0 (ships) does not bounce;
    0.3 gives e 0.36-0.42 but peaks 20-30% lower and contacts ~40% shorter
    (4.0-4.4 vs ~7.3 ms), so the real contact is softer at first touch and
    stiffer at peak than the model: a solimp question, not solref alone.
    Drops under 0.7 mm (e 0.22 and 0.72) disagree: short flights. 5 of 16 hand
    drops rocked on the button or were marginal. The drop rig
    (docs/plans/drop-release-rig.md) is meant to replace hand drops.

p1_drop_rebound:
  # Release (do not throw) from a measured height; film; read the first apex.
  # e = sqrt(h1/h0). Rebound HEIGHT is the number — bounce count is unreliable.
  camera_fps: 0               # int — 240 is plenty for a ~7 mm rebound
  drops:
    - drop_height_mm: 0.0     # float — h0, wheel bottom to floor at release
      rebound_1_mm: 0.0       # float — h1, first apex
      rebound_2_mm: 0.0       # float — h2, second apex (0 if none)
      audible_bounces: 0      # int
    - drop_height_mm: 0.0
      rebound_1_mm: 0.0
      rebound_2_mm: 0.0
      audible_bounces: 0
  notes: >
    2026-08-08 first pass, 3-4 cm onto the cutting board, hands guiding only:
    first rebound clearly visible, second barely, 2-3 audible. Consistent with
    dampratio ~0.30 (predicted apexes 7.5 then 1.9 mm from 35 mm). The shipped
    dampratio of 1.0 is critical damping and produces NO bounce at all, so
    this observation alone falsifies the current value.

p2_roll_phase:
  # A check on the mesh/layout, not on solref: in the sim, sink depends only
  # on how many contact points share the load, not on edge vs face. Phases as
  # in p0_static_deflection.
  two_big_ends_deflection_mm: 0.0      # float, at the reference load
  big_end_point_deflection_mm: 0.0     # float
  flat_one_roller_deflection_mm: 0.0   # float
  small_end_point_deflection_mm: 0.0   # float
  two_small_ends_deflection_mm: 0.0    # float
  reference_load_kg: 0.0               # float

derived:
  # Fill in once the sections above are complete.
  contact_solref_timeconst_s: 0.0   # float — from p0, via the protocol table
  contact_solref_dampratio: 0.0     # float — from p1
  friction_sliding: 0.0             # float — from p0b, = tan(mean angle)
  friction_frac_suggested: 0.0      # float — from the SPREAD of p0b, not the mean
  date: ""                          # str — YYYY-MM-DD the values were adopted
