# --- AHRS and the untethered payload.
electronics:
  ahrs_tm151:
    pos_mm: [0.0, 50.0, 130.0]
    shape: box
    envelope_mm: [34.0, 40.0, 12.6]
    mass_g: 19.0
    source: {pos: design, size: datasheet, mass: datasheet}
    note: >-
      SYD Dynamics TM151, datasheet size and mass. NOTE the simulator's
      own bike_params.yaml still carries the old 30 x 30 x 12 mm / 12 g
      placeholders — this is the CAD copy, and the two are meant to
      converge when it becomes authoritative. Long axis fore-aft and
      thin axis vertical is a MOUNTING assumption; MountCalibration
      absorbs any fixed orientation, so it only has to be right for the
      envelope. Position hardly matters (quaternion and gyro are
      position-invariant on a rigid body) but mount RIGIDITY does —
      compliance becomes a resonance the gyro reports as real body
      rotation.

  payload_battery:
    pos_mm: [0.0, 25.9, 100.2]
    shape: box
    envelope_mm: [26.0, 35.0, 72.0]
    axis_width: [0.0, 0.707107, -0.707107]
    axis_shaft: [-1.0, 0.0, 0.0]   # horn faces this way
    axis_up: [0.0, 0.707107, 0.707107]
    rotate_about: [-0.357407, 0.357407, 0.862856]
    rotate_deg: 98.4211
    mass_g: 115.0
    source: {pos: design (plausible layout, NOT a design), size: design, mass: GUESS}
    note: >-
      3S 1300-1500 mAh LiPo, slung under the frame between the wheels.
      Must stay on the centerline: lateral offset is a standing roll
      bias the controller trims out continuously. Its leads are the
      strongest magnetic source on the bike — keep them twisted and away
      from the AHRS.

  payload_pi:
    pos_mm: [0.0, 90.0, 108.0]
    shape: box
    envelope_mm: [30.0, 65.0, 5.0]
    mass_g: 11.0
    source: {pos: design (plausible layout, NOT a design), size: design, mass: datasheet}
    note: >-
      Raspberry Pi Zero 2 W. Board outline is exact; the microSD
      protrudes past it. Keep the ANTENNA end away from the pack — a
      LiPo is effectively RF-opaque. Powered through GPIO pins 2/4, so
      the micro-USB OTG port must stay reachable for the U2D2.

  payload_u2d2:
    pos_mm: [0.0, 90.0, 120.0]
    shape: box
    envelope_mm: [18.0, 48.0, 14.9]
    mass_g: 9.0
    source: {pos: design (plausible layout, NOT a design), size: design, mass: measured}
    note: >-
      ROBOTIS U2D2 with its USB cable. Needs its micro-USB and its 3-pin
      JST-EH TTL port both accessible; the USB cable to the Pi wants to
      be as short as routing allows.

  payload_power_board:
    pos_mm: [0.0, 90.0, 93.0]
    shape: box
    envelope_mm: [30.0, 30.0, 25.0]
    mass_g: 56.0
    source: {pos: design (plausible layout, NOT a design), size: design, mass: GUESS}
    note: >-
      Buck regulator, splitter perfboard, bulk caps and the XT30 trunk
      as one lump. The tallest items are the standing electrolytics.
      This is where the main switch and fuse tie in, so it wants to be
      reachable.

# --- Self-righting candidates — NOTHING HERE IS BUILT YET.
righting:
  linkage_crank_servo:
    pos_mm: [0.0, 115.5, 75.96]
    shape: box
    envelope_mm: [20.0, 23.0, 34.0]
    axis_width: [1.0, 0.0, 0.0]
    axis_shaft: [0.0, 1.0, 0.0]   # horn faces this way
    axis_up: [0.0, 0.0, 1.0]
    mass_g: 23.0
    source: {pos: design (linkage cfg), size: datasheet, mass: datasheet}
    note: >-
      XC330-T181 driving BOTH cranks off one shaft, hinge axis fore-aft.
      Arms 30.6 / 31.0 mm at 61.7 deg and 64.9 deg apart — deliberately
      UNEQUAL, so the two sides reach their dead points at different
      crank angles. Run in current-based position mode at 0.44 N.m; that
      is a WINDOW (0.38-0.50 works 8/8 falls), not a minimum.

  linkage_crank_servo_case_holes_horn:
    pos_mm: [0.0, 127.0, 75.96]
    shape: holes
    holes_mm:
      - [8.0, 127.0, 90.96]
      - [8.0, 127.0, 60.96]
      - [-8.0, 127.0, 90.96]
      - [-8.0, 127.0, 60.96]
    source: {pos: derived — case frame, size: measured (ROBOTIS drawing)}
    note: >-
      Case hole pattern, 16.0 x 30.0 mm centred on the horn-side face —
      four reference points, nothing solid. The shaft axis is NOT the
      centre of it: the axis sits 7.5 mm off along body_up, so the holes
      land asymmetrically about it.

  linkage_crank_servo_case_holes_back:
    pos_mm: [0.0, 104.0, 75.96]
    shape: holes
    holes_mm:
      - [8.0, 104.0, 90.96]
      - [8.0, 104.0, 60.96]
      - [-8.0, 104.0, 90.96]
      - [-8.0, 104.0, 60.96]
    source: {pos: derived — case frame, size: measured (ROBOTIS drawing)}
    note: >-
      Case hole pattern, 16.0 x 30.0 mm centred on the back-side face —
      four reference points, nothing solid. The shaft axis is NOT the
      centre of it: the axis sits 7.5 mm off along body_up, so the holes
      land asymmetrically about it.

  linkage_crank_horn:
    pos_mm: [0.0, 128.5, 83.46]
    shape: cylinder
    radius_mm: 8.0
    length_mm: 3.0
    axis: [0.0, 1.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived — under the mounting datum, size: measured (ROBOTIS drawing)}
    note: >-
      Output horn, 16.0 mm across and 3.0 mm thick, drawn as a plain
      disc and nothing more. It fills the 3.0 mm between the case face
      and the MOUNTING DATUM, which is the point of the same name — so
      the real horn face lands on that plane and a ROBOTIS STEP dropped
      onto it is in the right place. NO MASS: the datasheet servo figure
      is taken to be the assembled unit including the horn. BOTH crank
      arms are keyed to this one horn, at deliberately unequal angles —
      so it is the part that will actually be replaced by something
      custom, and the disc is only standing in for its hub.

  linkage_crank_shaft:
    pos_mm: [0.0, 130.0, 83.46]
    shape: point
    source: {pos: design (linkage cfg)}
    note: >-
      The crank shaft — both arms are keyed to it, and it is the servo's
      output axis (fore-aft, CAD Y). Mate the real ROBOTIS model to
      THIS, not to the box: the box orientation about this axis is a
      guess about which face carries the horn.

  crank_tip_right:
