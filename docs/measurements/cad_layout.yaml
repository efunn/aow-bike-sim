# --- Drive-servo mount — plate and sleeve. PROPOSAL.
mount:
  drive_mount_plate_right:
    pos_mm: [18.5, 67.42, 67.42]
    shape: box
    envelope_mm: [3.0, 63.5, 53.0]
    z_axis: [0.0, 0.707107, 0.707107]   # box +Z, CAD frame
    rotate_about: [-1.0, 0.0, 0.0]
    rotate_deg: 45.0
    source: {pos: derived — on the case faces, size: design (outline is a placeholder)}
    note: >-
      3.0 mm, on the bike's right. It lies on the right servo's horn-
      side face and the other servo's back face — they face opposite
      ways, so one plane touches both — and takes 8 M2.5 machine screws
      on the 22 x 40 case patterns. The cases are symmetric about the
      centreline at +/-17.0 mm precisely so this can be flat rather than
      stepped, and that symmetry is what forced the belt plane out to
      26.5 mm.

  drive_mount_relief_right:
    pos_mm: [18.5, 65.16, 85.31]
    shape: cylinder
    radius_mm: 11.75
    length_mm: 3.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived — on the horn axis, size: design}
    note: >-
      A VOID. The 23.5 mm hole the right plate needs where the right
      servo's horn passes through it — 20.5 mm horn plus 1.5 mm of
      radial clearance. Concentric with the SHAFT, not with the plate.
      Only the servo whose horn faces this plate needs one; the other
      presents its flat back face.

  drive_mount_plate_left:
    pos_mm: [-18.5, 67.42, 67.42]
    shape: box
    envelope_mm: [3.0, 63.5, 53.0]
