# AOW bike — component layout in CAD coordinates.
#
# GENERATED — do not edit. Regenerate with:
#     python -m aow_sim.cad_layout
#
# FRAME:  +X right, +Y forward, +Z up.   UNITS: mm and g.
# ORIGIN: the REAR AXLE, 51.2 mm above the floor when upright.
#
# This is the SIMULATOR's belief about the layout, exported for drawing.
# It is NOT a measurement — most entries are `design` or `GUESS`, and the
# payload positions are explicitly a plausible layout rather than a
# design. As parts get drawn and built, the real numbers go back into
# config/bike_params.yaml with `source: measured` and this file is
# REGENERATED. It is an export, never a source.
# Wing linkage geometry from: config/wing_linkage_w75.yaml
#
# Conversion from the sim frame (+X forward, +Y left, +Z up, m/kg):
#     cad_x = -model_y ;  cad_y = model_x ;  cad_z = model_z
# Both frames are right-handed, so this is a pure 90 deg rotation about Z
# with no mirroring. Box extents swap X and Y along with it.
#
# `pos_mm` is the component CENTRE unless its note says otherwise.
# `axis` is named in the frame it was authored in: `y_model` means the
# axis runs left-right across the bike, i.e. along CAD X.

# --- Rear omni-wheel and its two belt-driven inputs.
drivetrain:
  omni_wheel_rear:
    pos_mm: [0.0, 0.0, 0.0]
    shape: cylinder
    radius_mm: 51.2
    length_mm: 33.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    mass_g: 115.2
    source: {pos: origin, size: measured, mass: measured}
    note: >-
      THE ORIGIN. Axle sits 51.2 mm above the floor when upright. 8
      axles x 2 truncated-cone rollers. A bevel DIFFERENTIAL inside: the
      two inputs are the ring-gear shafts, and hub speed is their mean.

  pulley_input_left:
    pos_mm: [-26.5, 0.0, 0.0]
    shape: cylinder
    radius_mm: 13.94
    length_mm: 11.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived from belt width + wheel clearance, size: 15T HTD5M}
    note: >-
      15T pulley on the ring-gear input shaft, coaxial with the rear
      axle. Pitch dia 23.87 mm; envelope is the flange dia. Belt centre
      plane at 26.5 mm — the minimum a 9.0 mm belt allows over a 33.0 mm
      wheel.

  axle_mount_left:
    pos_mm: [-36.0, 0.0, 0.0]
    shape: cylinder
    radius_mm: 15.94
    length_mm: 8.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived, size: design}
    note: >-
      Where the rear axle is picked up, outboard of the pulley and a
      little larger so the belt never touches it. This is the stub the
      chassis eventually attaches to — the widest thing at the rear, at
      40.0 mm half-width.

  pulley_input_right:
    pos_mm: [26.5, 0.0, 0.0]
    shape: cylinder
    radius_mm: 13.94
    length_mm: 11.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived from belt width + wheel clearance, size: 15T HTD5M}
    note: >-
      15T pulley on the ring-gear input shaft, coaxial with the rear
      axle. Pitch dia 23.87 mm; envelope is the flange dia. Belt centre
      plane at 26.5 mm — the minimum a 9.0 mm belt allows over a 33.0 mm
      wheel.

  axle_mount_right:
    pos_mm: [36.0, 0.0, 0.0]
    shape: cylinder
    radius_mm: 15.94
    length_mm: 8.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived, size: design}
    note: >-
      Where the rear axle is picked up, outboard of the pulley and a
      little larger so the belt never touches it. This is the stub the
      chassis eventually attaches to — the widest thing at the rear, at
      40.0 mm half-width.

  pulley_servo_left:
    pos_mm: [-26.5, 85.31, 65.16]
    shape: cylinder
    radius_mm: 37.81
    length_mm: 11.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived — centre distance C on the belt plane, size: 45T HTD5M}
    note: >-
      45T driving pulley, pitch dia 71.62 mm. Centre distance 107.35 mm
      falls out of the 370.0 mm belt and the tooth counts — it is not a
      placement choice. Only the ANGLE about the rear axle is free, so
      both servos may sit anywhere on that circle and still share
      identical belts.

  pulley_servo_right:
    pos_mm: [26.5, 65.16, 85.31]
    shape: cylinder
    radius_mm: 37.81
    length_mm: 11.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    source: {pos: derived — centre distance C on the belt plane, size: 45T HTD5M}
    note: >-
      45T driving pulley, pitch dia 71.62 mm. Centre distance 107.35 mm
      falls out of the 370.0 mm belt and the tooth counts — it is not a
      placement choice. Only the ANGLE about the rear axle is free, so
      both servos may sit anywhere on that circle and still share
      identical belts.

# --- Front wheel, fork, steering axis.
steering:
  front_wheel:
    pos_mm: [0.0, 200.0, -1.2]
    shape: cylinder
    radius_mm: 50.0
    length_mm: 28.0
    axis: [-1.0, 0.0, 0.0]   # unit vector, CAD frame
    mass_g: 60.0
    source: {pos: design, size: design, mass: GUESS}
    note: >-
      Axle sits 1.2 mm BELOW the rear axle: the front wheel is 50.0 mm
      radius against the rear's 51.2 mm. Tire crown radius 14.0 mm. This
      wheel cannot slide sideways, which is what makes the lateral
      velocity estimator work.

  fork:
    pos_mm: [0.0, 188.35, 42.27]
    shape: capsule
    radius_mm: 5.0
    length_mm: 90.0
    axis: [0.0, -0.258819, 0.965926]   # unit vector, CAD frame
    mass_g: 25.0
    source: {pos: design, size: design, mass: GUESS}
    note: >-
      Steering axis raked 15.0 deg back from vertical, fork offset 0.0
      mm. `axis` IS the steering axis — sketch the head tube and any
      clamp perpendicular to it, not to the world. pos_mm is the capsule
      centre; the axis passes through the front axle.

