    note: >-
      Case hole pattern, 22.0 x 40.0 mm centred on the horn-side face —
      four reference points, nothing solid. The shaft axis is NOT the
      centre of it: the axis sits 12.0 mm off along body_up, so the
      holes land asymmetrically about it.

  servo_drive_left_case_holes_back:
    pos_mm: [17.0, 76.82, 56.67]
