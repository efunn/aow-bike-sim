      THE FORK'S OWN PLANE, and the one to both sketch and print it in.
      Looking down its normal you see the fork from the FRONT: two legs
      coming down left and right and meeting at the top. It holds the
      axle direction and the steering axis at once, so it is the front
      view tilted back by the 15.0 deg of rake — which is why no world
      plane will do. Sketch the profile here and extrude fore-aft; print
      it lying in this plane and both legs sit flat on the bed with the
      layers running along them.

  plane_belt_left_lower:
    pos_mm: [-26.5, 53.39, 9.04]
    shape: plane
    normal: [0.0, -0.415043, 0.909802]   # unit vector, CAD frame
    source: {pos: derived — belt tangent midpoint, size: design}
    note: >-
      CLEARANCE, not a print plane. Parallel to the LOWER belt run — the
      left servo's lower tangent, one of the two extreme angles the
      belts reach — and therefore part of the boundary of the belt-and-
      pulley hull. A rear dropout has to run from the axle OUTBOARD of
      its own belt and end up INBOARD of it at the servo mount, so
      somewhere it crosses the belt plane, and it can only do that
      outside this line. Like a chainstay threading past the chain.
      Which means the crossing dictates the part's shape and a single
      flat build plane will not align with both the sleeve and the arm —
      printing off this was the first guess and it does not survive the
      geometry. Placed in the belt plane at 26.5 mm; the ORIENTATION is
      what is derived, not the offset.

  plane_belt_left_upper:
    pos_mm: [-26.5, 22.77, 49.13]
    shape: plane
    normal: [0.0, -0.768526, 0.639819]   # unit vector, CAD frame
    source: {pos: derived — belt tangent midpoint, size: design}
    note: >-
      CLEARANCE, not a print plane. Parallel to the UPPER belt run — the
      left servo's upper tangent, one of the two extreme angles the
      belts reach — and therefore part of the boundary of the belt-and-
