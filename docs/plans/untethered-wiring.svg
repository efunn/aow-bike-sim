<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#cc3333"/></marker>
    <marker id="aDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#444444"/></marker>
    <marker id="aOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e08a1e"/></marker>
    <marker id="aGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#777777"/></marker>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2e7d32"/></marker>
    <marker id="aBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1565c0"/></marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="40" y="24" font-size="16" font-weight="bold" fill="#111">AOW bike — untethered wiring</text>

  <!-- ============ SOURCE ============ -->
  <rect x="40" y="40" width="200" height="66" rx="5" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="140" y="64" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">3S LiPo 1300–1500 mAh</text>
  <text x="140" y="82" font-size="11" text-anchor="middle" fill="#555">9.9 – 12.6 V  •  ~115 g</text>
  <text x="140" y="98" font-size="10" text-anchor="middle" fill="#888">JST-XH balance lead → charger only</text>

  <rect x="290" y="44" width="240" height="58" rx="5" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="410" y="64" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#555">BENCH ALTERNATIVE</text>
  <text x="410" y="80" font-size="10.5" text-anchor="middle" fill="#666">12 V Robotis brick via</text>
  <text x="410" y="94" font-size="10.5" text-anchor="middle" fill="#666">barrel 5.5×2.5 → XT30 lead</text>
  <path d="M290,86 L200,130" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>

  <line x1="140" y1="106" x2="140" y2="126" stroke="#cc3333" stroke-width="2.5"/>
  <line x1="124" y1="128" x2="156" y2="128" stroke="#444" stroke-width="3"/>
  <line x1="124" y1="134" x2="156" y2="134" stroke="#444" stroke-width="3"/>
  <text x="168" y="127" font-size="11" font-weight="bold" fill="#111">XT30 / XT60</text>
  <text x="168" y="140" font-size="10" fill="#888">the only power input — unplug = master off</text>

  <line x1="140" y1="134" x2="140" y2="156" stroke="#cc3333" stroke-width="2.5"/>
  <rect x="88" y="156" width="104" height="34" rx="4" fill="#fff" stroke="#cc3333" stroke-width="1.6"/>
  <text x="140" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">FUSE 7.5 A</text>
  <line x1="140" y1="190" x2="140" y2="230" stroke="#cc3333" stroke-width="2.5" marker-end="url(#aRed)"/>

  <!-- ============ BOARD ============ -->
  <rect x="40" y="228" width="520" height="330" rx="7" fill="#fcfcfc" stroke="#666" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="52" y="248" font-size="12.5" font-weight="bold" fill="#333">SPLITTER BOARD — perfboard ~25 × 25 mm</text>

  <circle cx="140" cy="262" r="4" fill="#cc3333"/>
  <line x1="140" y1="262" x2="385" y2="262" stroke="#cc3333" stroke-width="2.5"/>

  <!-- servo branch -->
  <line x1="140" y1="262" x2="140" y2="282" stroke="#cc3333" stroke-width="2.5"/>
  <rect x="72" y="282" width="136" height="40" rx="4" fill="#fff" stroke="#cc3333" stroke-width="1.6"/>
  <text x="140" y="299" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">MAIN SWITCH</text>
  <text x="140" y="314" font-size="10" text-anchor="middle" fill="#777">servo power only — Pi stays up</text>
  <line x1="140" y1="322" x2="140" y2="340" stroke="#cc3333" stroke-width="2.5"/>
  <rect x="90" y="340" width="100" height="30" rx="4" fill="#fff" stroke="#cc3333" stroke-width="1.4"/>
  <text x="140" y="360" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">1000 µF</text>
  <line x1="140" y1="370" x2="140" y2="400" stroke="#cc3333" stroke-width="2.5"/>

  <!-- Pi branch -->
  <line x1="385" y1="262" x2="385" y2="282" stroke="#cc3333" stroke-width="2.5"/>
  <rect x="333" y="282" width="104" height="30" rx="4" fill="#fff" stroke="#cc3333" stroke-width="1.4"/>
  <text x="385" y="302" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">470 µF</text>
  <line x1="385" y1="312" x2="385" y2="328" stroke="#cc3333" stroke-width="2.5"/>
  <rect x="325" y="328" width="120" height="42" rx="4" fill="#fff" stroke="#e08a1e" stroke-width="1.8"/>
  <text x="385" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">TSR 2-2450</text>
  <text x="385" y="361" font-size="10.5" text-anchor="middle" fill="#777">12 V → 5 V, 2 A</text>

  <!-- rails -->
  <line x1="70" y1="400" x2="500" y2="400" stroke="#cc3333" stroke-width="4"/>
  <text x="508" y="404" font-size="10.5" font-weight="bold" fill="#cc3333">VDD</text>
  <line x1="70" y1="428" x2="500" y2="428" stroke="#b8860b" stroke-width="4"/>
  <text x="508" y="432" font-size="10.5" font-weight="bold" fill="#b8860b">DATA</text>
  <line x1="70" y1="456" x2="500" y2="456" stroke="#444" stroke-width="4"/>
  <text x="508" y="460" font-size="10.5" font-weight="bold" fill="#444">GND</text>

  <path d="M445,349 L585,349 L585,240 L614,240" stroke="#e08a1e" stroke-width="2.5" fill="none" marker-end="url(#aOrange)"/>
  <text x="470" y="342" font-size="10.5" font-weight="bold" fill="#e08a1e">5 V</text>
  <path d="M500,456 L600,456 L600,272 L614,272" stroke="#444" stroke-width="2" fill="none" marker-end="url(#aDark)"/>
  <text x="566" y="400" font-size="9.5" fill="#888">GND ref</text>

  <!-- two headers only -->
  <rect x="93" y="486" width="112" height="42" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="149" y="503" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">B3B-EH-A</text>
  <text x="149" y="519" font-size="9.5" text-anchor="middle" fill="#888">→ head of servo chain</text>
  <line x1="115" y1="486" x2="115" y2="400" stroke="#cc3333" stroke-width="1.6"/>
  <line x1="149" y1="486" x2="149" y2="428" stroke="#b8860b" stroke-width="1.6"/>
  <line x1="183" y1="486" x2="183" y2="456" stroke="#444" stroke-width="1.6"/>

  <rect x="300" y="486" width="112" height="42" rx="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="356" y="503" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">B3B-EH-A</text>
  <text x="356" y="519" font-size="9.5" text-anchor="middle" fill="#888">→ U2D2 TTL port</text>
  <line x1="322" y1="486" x2="322" y2="400" stroke="#cc3333" stroke-width="1.6"/>
  <line x1="356" y1="486" x2="356" y2="428" stroke="#b8860b" stroke-width="1.6"/>
  <line x1="390" y1="486" x2="390" y2="456" stroke="#444" stroke-width="1.6"/>

  <text x="52" y="548" font-size="10" fill="#888">Only two headers — the daisy chain does the rest. No crimping anywhere.</text>

  <!-- U2D2 cable -->
  <path d="M412,507 L582,507 L582,478 L610,478" stroke="#777" stroke-width="5" fill="none" marker-end="url(#aGrey)"/>
  <text x="424" y="500" font-size="10" fill="#666">stock 3-pin cable — GND / VDD / DATA</text>

  <!-- ============ SERVO CHAIN ============ -->
  <path d="M149,528 L149,606" stroke="#777" stroke-width="5" fill="none" marker-end="url(#aGrey)"/>

  <rect x="87" y="608" width="124" height="72" rx="5" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="149" y="630" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">XC430-W150</text>
  <text x="149" y="647" font-size="11" text-anchor="middle" fill="#555">drive A</text>
  <text x="149" y="666" font-size="11" font-weight="bold" text-anchor="middle" fill="#b8860b">ID 1</text>

  <path d="M211,644 L233,644" stroke="#777" stroke-width="5" fill="none" marker-end="url(#aGrey)"/>

  <rect x="237" y="608" width="124" height="72" rx="5" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="299" y="630" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">XC430-W150</text>
  <text x="299" y="647" font-size="11" text-anchor="middle" fill="#555">drive B</text>
  <text x="299" y="666" font-size="11" font-weight="bold" text-anchor="middle" fill="#b8860b">ID 2</text>

  <path d="M361,644 L383,644" stroke="#777" stroke-width="5" fill="none" marker-end="url(#aGrey)"/>

  <rect x="387" y="608" width="124" height="72" rx="5" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="449" y="630" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">XC330-T181</text>
  <text x="449" y="647" font-size="11" text-anchor="middle" fill="#555">steer</text>
  <text x="449" y="666" font-size="11" font-weight="bold" text-anchor="middle" fill="#b8860b">ID 3</text>

  <text x="87" y="702" font-size="10" fill="#888">Each servo has two identical connectors wired straight through — VDD, GND and DATA</text>
  <text x="87" y="716" font-size="10" fill="#888">all pass to the next. First cable carries ~3.6 A peak; at stock length that is ~0.12 V.</text>
  <text x="87" y="730" font-size="10" fill="#888">Electrically the chain beats a star: one continuous line, no stubs to ring.</text>

  <!-- ============ TM151 ============ -->
  <rect x="614" y="30" width="346" height="68" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="787" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">TM151 AHRS</text>
  <text x="787" y="69" font-size="10.5" text-anchor="middle" fill="#555">pin 1 RXD · 2 TXD · 3 VCC 5V · 4 GND · 5 GND (linked to 4)</text>
  <text x="787" y="86" font-size="10" text-anchor="middle" fill="#888">200 Hz @ 460800 baud  •  3.3 V TTL, 5 V-tolerant — no shifter</text>

  <line x1="662" y1="98" x2="662" y2="166" stroke="#e08a1e" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="668" y="130" font-size="10" fill="#e08a1e">5 V → p3</text>
  <line x1="750" y1="98" x2="750" y2="166" stroke="#444" stroke-width="2" marker-end="url(#aDark)"/>
  <text x="756" y="130" font-size="10" fill="#444">GND → p4</text>
  <line x1="848" y1="166" x2="848" y2="98" stroke="#2e7d32" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="854" y="130" font-size="10" fill="#2e7d32">p2 TXD → RXD</text>
  <line x1="944" y1="166" x2="944" y2="98" stroke="#bbb" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="938" y="152" font-size="9" text-anchor="end" fill="#aaa">p1 RXD (optional)</text>

  <!-- ============ PI ============ -->
  <rect x="614" y="168" width="346" height="210" rx="5" fill="#fff" stroke="#1565c0" stroke-width="1.8"/>
  <text x="787" y="192" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Raspberry Pi Zero 2 W</text>
  <text x="787" y="208" font-size="10" text-anchor="middle" fill="#888">numpy + pyserial + dynamixel-sdk — no MuJoCo</text>

  <line x1="630" y1="218" x2="944" y2="218" stroke="#ddd" stroke-width="1"/>
  <text x="632" y="240" font-size="11" fill="#111">pin 2   5V</text><text x="944" y="240" font-size="10.5" text-anchor="end" fill="#e08a1e">◄ in from buck</text>
  <text x="632" y="262" font-size="11" fill="#111">pin 4   5V</text><text x="944" y="262" font-size="10.5" text-anchor="end" fill="#e08a1e">► out to TM151</text>
  <text x="632" y="284" font-size="11" fill="#111">pin 6   GND</text><text x="944" y="284" font-size="10.5" text-anchor="end" fill="#444">— TM151</text>
  <text x="632" y="306" font-size="11" fill="#111">pin 9   GND</text><text x="944" y="306" font-size="10.5" text-anchor="end" fill="#444">— board GND rail</text>
  <text x="632" y="328" font-size="11" fill="#111">pin 10  RXD</text><text x="944" y="328" font-size="10.5" text-anchor="end" fill="#2e7d32">◄ TM151 TX</text>
  <text x="632" y="350" font-size="11" fill="#111">pin 8   TXD</text><text x="944" y="350" font-size="10.5" text-anchor="end" fill="#aaa">► TM151 RXD — optional</text>
  <text x="632" y="370" font-size="10.5" font-weight="bold" fill="#1565c0">micro-USB [USB/OTG port, not PWR IN]</text>

  <line x1="760" y1="378" x2="760" y2="404" stroke="#1565c0" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="770" y="396" font-size="10.5" fill="#1565c0">micro-USB OTG adapter</text>

  <!-- ============ U2D2 ============ -->
  <rect x="610" y="406" width="284" height="88" rx="5" fill="#fff" stroke="#b8860b" stroke-width="1.8"/>
  <text x="752" y="428" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">U2D2</text>
  <text x="752" y="446" font-size="10.5" text-anchor="middle" fill="#555">USB ↔ TTL half-duplex, 3 Mbps</text>
  <text x="752" y="463" font-size="10" text-anchor="middle" fill="#888">latency_timer = 1 (udev rule)</text>
  <text x="752" y="482" font-size="10" text-anchor="middle" fill="#888">logic powered from USB; VDD pin is bus pass-through</text>

  <!-- ============ LEGEND ============ -->
  <line x1="614" y1="520" x2="960" y2="520" stroke="#ddd" stroke-width="1"/>
  <text x="614" y="542" font-size="11.5" font-weight="bold" fill="#333">LEGEND</text>
  <line x1="614" y1="558" x2="646" y2="558" stroke="#cc3333" stroke-width="3.5"/><text x="654" y="562" font-size="10.5" fill="#333">VDD — pack voltage, 9.9–12.6 V (20 AWG)</text>
  <line x1="614" y1="578" x2="646" y2="578" stroke="#444" stroke-width="3.5"/><text x="654" y="582" font-size="10.5" fill="#333">GND — common return</text>
  <line x1="614" y1="598" x2="646" y2="598" stroke="#e08a1e" stroke-width="3.5"/><text x="654" y="602" font-size="10.5" fill="#333">5 V — regulated, Pi + AHRS</text>
  <line x1="614" y1="618" x2="646" y2="618" stroke="#b8860b" stroke-width="3.5"/><text x="654" y="622" font-size="10.5" fill="#333">DATA — Dynamixel TTL bus</text>
  <line x1="614" y1="638" x2="646" y2="638" stroke="#777" stroke-width="5"/><text x="654" y="642" font-size="10.5" fill="#333">stock 3-pin cable — all three conductors</text>
  <line x1="614" y1="658" x2="646" y2="658" stroke="#2e7d32" stroke-width="3.5"/><text x="654" y="662" font-size="10.5" fill="#333">UART — AHRS → Pi, one direction only</text>
  <line x1="614" y1="678" x2="646" y2="678" stroke="#1565c0" stroke-width="3.5"/><text x="654" y="682" font-size="10.5" fill="#333">USB</text>

  <text x="614" y="714" font-size="10.5" font-weight="bold" fill="#333">Note the two power domains</text>
  <text x="614" y="730" font-size="10" fill="#666">The switch sits on the servo branch only, so the Pi keeps running</text>
  <text x="614" y="744" font-size="10" fill="#666">with torque off. The fuse sits ahead of the split, protecting the</text>
  <text x="614" y="758" font-size="10" fill="#666">trunk and everything downstream. Address 144 gives LVC for free.</text>

  <text x="40" y="782" font-size="10" fill="#999">docs/plans/untethered-setup.md</text>
</svg>
